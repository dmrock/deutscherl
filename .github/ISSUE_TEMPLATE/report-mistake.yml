# Opened from the "Report a mistake" link on the site. Every field id can be prefilled with a URL
# query parameter, for example:
# https://github.com/dmrock/deutscherl/issues/new?template=report-mistake.yml&page-url=https%3A%2F%2Fdeutscherl.com%2Fa2%2Fperfekt%2F&locale=en&item-id=c3
name: Report a mistake
description: Something on the site is wrong (German, explanation, translation or exercise).
title: '[Mistake] '
labels: ['content-mistake']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping to make the site correct! Please write in English if you can.
        Filled-in fields come from the page you were on; you can change them.
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: The page where you found the mistake.
      placeholder: https://deutscherl.com/a2/perfekt/
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Language of the page
      description: Language code of the page, for example `en` or `ru`.
      placeholder: en
    validations:
      required: true
  - type: input
    id: item-id
    attributes:
      label: Item id
      description: Id of the example or exercise, if the mistake is in one (shown in the link you followed).
      placeholder: c3
    validations:
      required: false
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What is wrong?
      description: Quote the text and explain the problem.
    validations:
      required: true
  - type: textarea
    id: what-is-correct
    attributes:
      label: What is correct?
      description: The correct version, if you know it.
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A grammar book, dictionary or other reference that supports the correction (for example Duden or the Österreichisches Wörterbuch).
    validations:
      required: false
