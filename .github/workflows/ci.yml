# One pipeline for checks and deploys (CLAUDE.md, "Deployment" and "Testing").
# Checks run in parallel; e2e tests run on the build output; deploy jobs run only after every
# check passed and never for forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by in every commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Commits on main were already checked in their pull request (squash commits get
          # GitHub-generated authors, so they are not re-checked here).
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event: commits were checked in their pull request."
            exit 0
          fi
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')
            subject=$(git log -1 --format='%s' "$sha")
            if git log -1 --format='%B' "$sha" | tr '[:upper:]' '[:lower:]' \
              | grep '^signed-off-by: ' | grep -qF "<$email>"; then
              echo "ok      ${sha:0:7} $subject"
            else
              echo "::error::Commit ${sha:0:7} (\"$subject\") has no 'Signed-off-by:' line matching its author <$email>."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off your commits with 'git commit -s' (see CONTRIBUTING.md). To fix existing commits: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi

  language:
    name: Language check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # No dependencies needed: the script runs on Node's built-in TypeScript support.
      - run: node scripts/check-language.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Biome
        run: pnpm exec biome ci .
      - name: Prettier (.astro, .svelte)
        run: pnpm exec prettier --check "**/*.{astro,svelte}"

  typecheck:
    name: Astro check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Astro build
        env:
          # `preview` adds noindex to every page.
          PUBLIC_DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: pnpm build
      - name: JS budget
        run: pnpm budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same value the build used, so the noindex tests know which build they are testing.
      PUBLIC_DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    needs: [dco, language, lint, typecheck, unit, build, e2e]
    # Pull requests from branches of this repository only, never from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: deutscherl # same as "name" in wrangler.jsonc
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # `wrangler versions upload` fails for a Worker that was never deployed. On first use,
      # deploy once without routes so the Worker exists but the custom domain stays untouched
      # until the first production deploy from main.
      - name: Create the Worker if it does not exist yet
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")
          case "$status" in
            200) echo "Worker $WORKER_NAME exists." ;;
            404)
              echo "Worker $WORKER_NAME does not exist yet: bootstrap deploy without routes."
              node scripts/ci/wrangler-bootstrap-config.ts wrangler.bootstrap.json
              pnpm exec wrangler deploy --config wrangler.bootstrap.json --message "Bootstrap from PR #$PR_NUMBER (no routes)"
              ;;
            *) echo "::error::Cloudflare API returned HTTP $status while looking up the Worker."; exit 1 ;;
          esac

      - name: Upload preview version
        id: upload
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER ${HEAD_SHA:0:7}"
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").trim().split("\n");
            const entry = lines.map((line) => JSON.parse(line)).find((e) => e.type === "version-upload");
            process.stdout.write(entry?.preview_alias_url ?? "");
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            # Wrangler prints a preview URL only if the Worker has previews enabled and the account
            # has a workers.dev subdomain. Show both so the cause is visible in the log.
            api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
            echo "Account workers.dev subdomain:"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/subdomain" | jq '{result, errors}'
            echo "Worker subdomain settings:"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/$WORKER_NAME" | jq '{subdomain: .result.subdomain, errors}'
            echo "::error::Wrangler returned no preview alias URL. Preview URLs need preview_urls enabled on the Worker and a workers.dev subdomain on the account (see the output above)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- deutscherl-preview -->';
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${process.env.HEAD_SHA}. Preview pages are marked \`noindex\`.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-production:
    name: Deploy production
    needs: [dco, language, lint, typecheck, unit, build, e2e]
    # Pushes to main of this repository only (a fork's own main never deploys).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dmrock/deutscherl'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://deutscherl.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Wrangler deploy
        run: pnpm exec wrangler deploy --message "main ${GITHUB_SHA:0:7}"
