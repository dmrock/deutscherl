# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks nicht, the forms of kein and the answer words that the page highlights.

examples:
  # kein: masculine | feminine | neuter | plural
  - id: e1
    de: 'Das ist **kein** Problem.'
  - id: e2
    de: 'Ich habe heute **keine** Zeit.'
  - id: e3
    de: 'Wir haben **kein** Auto.'
  - id: e4
    de: 'Meine Nachbarn haben **keine** Kinder.'
  # keinen for a masculine direct object
  - id: e5
    de: 'Ich habe **keinen** Hunger.'
  - id: e6
    de: 'Er trinkt **keinen** Kaffee.'
  # nicht at the end
  - id: e7
    de: 'Ich komme heute **nicht**.'
  - id: e8
    de: 'Ich kenne den Mann **nicht**.'
  # nicht before adjectives, places and the second verb
  - id: e9
    de: 'Das Wasser ist **nicht** kalt.'
  - id: e10
    de: 'Er wohnt **nicht** in Wien.'
  - id: e11
    de: 'Ich kann heute leider **nicht** kommen.'
  # nicht for one part only, with sondern
  - id: e12
    de: 'Ich komme **nicht** heute, sondern morgen.'
  - id: e13
    de: 'Wir fahren **nicht** nach Wien, sondern nach Graz.'
  # kein or nicht: one example per cell of the table
  - id: e14
    de: 'Das ist **kein** Handy, das ist eine Kamera.'
  - id: e15
    de: 'Ich finde den Schlüssel **nicht**.'
  - id: e16
    de: 'Ich habe **kein** Geld dabei.'
  - id: e17
    de: 'Das ist **nicht** mein Handy.'
  # Answering negative questions
  - id: e18
    de: 'Hast du keinen Hunger? – **Doch**, ich habe Hunger.'
  - id: e19
    de: 'Kommst du nicht mit? – **Nein**, ich bleibe zu Hause.'

choice:
  - id: c1
    text: Ich habe ___ Auto.
    answer: kein
    options: [kein, keine, keinen, nicht]
