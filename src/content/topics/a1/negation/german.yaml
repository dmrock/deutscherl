wordOrder:
  - id: w1
    parts: [ich, komme, heute, nicht]
    accept:
      - [heute, komme, ich, nicht]
    punctuation: '.'
  - id: w2
    parts: [ich, kenne, den Mann, nicht]
    accept:
      - [den Mann, kenne, ich, nicht]
    punctuation: '.'
  - id: w3
    parts: [das, ist, nicht, teuer]
    accept:
      - [teuer, ist, das, nicht]
    punctuation: '.'
  - id: w4
    parts: [er, wohnt, nicht, in Wien]
    accept:
      - [in Wien, wohnt, er, nicht]
    punctuation: '.'
  - id: w5
    parts: [wir, haben, keine Zeit]
    accept:
      - [keine Zeit, haben, wir]
    punctuation: '.'
  - id: w6
    parts: [ich, kann, leider, nicht, kommen]
    accept:
      - [leider, kann, ich, nicht, kommen]
    punctuation: '.'
  - id: w7
    parts: [hast, du, keinen Hunger]
    fixed: true
    punctuation: '?'
  - id: w8
    parts: [das, ist, nicht, mein Handy]
    accept:
      - [mein Handy, ist, das, nicht]
    punctuation: '.'

