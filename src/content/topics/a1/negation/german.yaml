wordOrder:
  - id: w1
    parts: [ich, verstehe, die Frage, nicht]
    accept:
      - [die Frage, verstehe, ich, nicht]
    punctuation: '.'
  - id: w2
    parts: [ich, weiß, das, nicht]
    accept:
      - [das, weiß, ich, nicht]
    punctuation: '.'
  - id: w3
    parts: [das, ist, nicht, teuer]
    accept:
      - [teuer, ist, das, nicht]
    punctuation: '.'
  - id: w4
    parts: [er, wohnt, nicht, in Wien]
    accept:
      - [in Wien, wohnt, er, nicht]
    punctuation: '.'
  - id: w5
    parts: [das Essen, schmeckt, mir, nicht]
    accept:
      - [mir, schmeckt, das Essen, nicht]
    punctuation: '.'
  - id: w6
    parts: [ich, kann, leider, nicht, kommen]
    accept:
      - [leider, kann, ich, nicht, kommen]
    punctuation: '.'
  - id: w7
    parts: [kommst, du, nicht, mit]
    fixed: true
    punctuation: '?'
  - id: w8
    parts: [er, ist, nicht, zu Hause]
    accept:
      - [zu Hause, ist, er, nicht]
    punctuation: '.'
  - id: w9
    parts: [er, will, den Film, nicht, sehen]
    accept:
      - [den Film, will, er, nicht, sehen]
    punctuation: '.'
  - id: w10
    parts: [sie, kommt, nicht, 'aus Deutschland,', sondern, aus Österreich]
    punctuation: '.'

