# English translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: That's no problem.
  e2: I don't have time today.
  e3: We don't have a car.
  e4: My neighbours don't have any children.
  e5: I'm not hungry.
  e6: He doesn't drink coffee.
  e7: I'm not coming today.
  e8: I don't know the man.
  e9: The water isn't cold.
  e10: He doesn't live in Vienna.
  e11: Unfortunately I can't come today.
  e12: I'm not coming today, but tomorrow.
  e13: We're not going to Vienna, but to Graz.
  e14: That's not a phone, it's a camera.
  e15: I can't find the key.
  e16: I don't have any money on me.
  e17: That's not my phone.
  e18: Aren't you hungry? – Yes, I am.
  e19: Aren't you coming along? – No, I'm staying at home.

choice:
  c1:
    why: 'The positive is *ein Auto*, so the negative is *kein Auto*. *Auto* is neuter.'
  c2:
    why: 'The positive is *ein Problem*, so the negative is *kein Problem*. After *das ist* there is no object, so no *-en*.'
  c3:
    why: '*Zeit* has no article in the positive (*Zeit haben*), so it takes *kein*. *Zeit* is feminine: *keine Zeit*.'
  c4:
    why: '*Hunger* is masculine and the direct object of *haben*, so *kein* becomes *keinen*.'
  c5:
    why: 'There is no noun to negate, so you need *nicht*. It comes before the second verb *abholen* at the end.'
  c6:
    why: '*teuer* is an adjective. Adjectives take *nicht*, never *kein*.'
  c7:
    why: '*mein Fahrrad* has *mein*, not *ein*, so it takes *nicht*: *nicht mein Fahrrad*.'
  c8:
    why: '*Geschwister* (brothers and sisters) is plural and has no article in the positive, so it takes *keine*.'
  c9:
    why: 'You negate the place (*nach Italien*), and there is no noun with *ein*, so you need *nicht*. It comes right before the place.'
  c10:
    why: '*Fleisch* has no article in the positive (*Ich esse Fleisch*), so it takes *kein*. *Fleisch* is neuter: *kein Fleisch*.'
  c11:
    why: 'The question is negative, but the next sentence says you are coming, so the answer is "yes, I have time". After a negative question, that "yes" is *doch*, and the rest of the answer is positive.'
  c12:
    why: 'The next sentence says you are staying at home, so you agree with the negative question. That is *nein*, and the rest of the answer stays negative. *doch* would mean you are coming after all.'
  c13:
    why: 'Only the place is negated, and *sondern* gives the correct one. A place takes *nicht*.'
  c14:
    why: 'After *es gibt* comes the accusative. *Supermarkt* is masculine, so *ein* → *einen* → *keinen*.'
  c15:
    why: '*Milch* has no article in the positive (*Ich trinke Milch*), so it takes *kein*. *Milch* is feminine: *keine Milch*, also as the object of *trinken*.'

wordOrder:
  w1:
    translation: I don't understand the question.
    why: '*die Frage* has *die*, so you negate with *nicht*. To negate the whole sentence, *nicht* goes at the end, after the object. *die Frage* can also come first.'
  w2:
    translation: I don't know that.
    why: '*nicht* goes at the end, after the object *das*. *das* can also come first, which is very common.'
  w3:
    translation: That's not expensive.
    why: '*nicht* comes right before the adjective *teuer*. When *teuer* comes first to stress it, *nicht* stays at the end.'
  w4:
    translation: He doesn't live in Vienna.
    why: '*nicht* comes before the place *in Wien*. When *in Wien* comes first, *nicht* stays at the end.'
  w5:
    translation: I don't like the food.
    why: '*nicht* negates the whole sentence, so it goes at the end, after *mir*. *mir* can also come first: *mir schmeckt das Essen nicht*.'
  w6:
    translation: Unfortunately I can't come.
    why: '*nicht* comes before the second verb *kommen* at the end. *leider* (unfortunately) can also come first.'
  w7:
    translation: Aren't you coming along?
    why: 'A yes/no question starts with the verb *kommst*, then the subject *du*. *mitkommen* splits, and *mit* goes to the end. *nicht* comes right before it.'
  w8:
    translation: He isn't at home.
    why: '*nicht* comes before the place *zu Hause*. When *zu Hause* comes first, *nicht* stays at the end.'
  w9:
    translation: He doesn't want to see the film.
    why: '*nicht* comes after the object *den Film* and before the second verb *sehen* at the end. *den Film* can also come first.'
  w10:
    translation: She isn't from Germany, but from Austria.
    why: 'Only the place is negated, so *nicht* comes right before *aus Deutschland*. *sondern* then gives the correct place.'

austrianNotes:
  at1: We're not going on holiday this year.
