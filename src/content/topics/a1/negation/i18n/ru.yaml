# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Это не проблема.
  e2: У меня сегодня нет времени.
  e3: У нас нет машины.
  e4: У моих соседей нет детей.
  e5: Я не хочу есть.
  e6: Он не пьёт кофе.
  e7: Я сегодня не приду.
  e8: Я не знаю этого человека.
  e9: Вода не холодная.
  e10: Он не живёт в Вене.
  e11: К сожалению, сегодня я не смогу прийти.
  e12: Я приду не сегодня, а завтра.
  e13: Мы едем не в Вену, а в Грац.
  e14: Это не телефон, это фотоаппарат.
  e15: Я не могу найти ключ.
  e16: У меня с собой нет денег.
  e17: Это не мой телефон.
  e18: Ты не хочешь есть? – Хочу.
  e19: Ты не пойдёшь с нами? – Нет, я останусь дома.

choice:
  c1:
    why: 'В утвердительном предложении — *ein Auto*, значит, в отрицании — *kein Auto*. *Auto* среднего рода.'
  c2:
    why: 'В утвердительном предложении — *ein Problem*, значит, в отрицании — *kein Problem*. После *das ist* дополнения нет, поэтому без *-en*.'
  c3:
    why: 'У *Zeit* в утвердительном предложении нет артикля (*Zeit haben*), поэтому нужен *kein*. *Zeit* женского рода: *keine Zeit*.'
  c4:
    why: '*Hunger* мужского рода и стоит как прямое дополнение после *haben*, поэтому *kein* становится *keinen*.'
  c5:
    why: 'Здесь нет существительного, которое можно отрицать, поэтому нужно *nicht*. Оно стоит перед вторым глаголом *abholen* в конце.'
  c6:
    why: '*teuer* — прилагательное. Прилагательные отрицают через *nicht*, никогда через *kein*.'
  c7:
    why: 'У *mein Fahrrad* стоит *mein*, а не *ein*, поэтому нужно *nicht*: *nicht mein Fahrrad*.'
  c8:
    why: '*Geschwister* (братья и сёстры) — множественное число без артикля в утвердительном предложении, поэтому *keine*.'
  c9:
    why: 'Ты отрицаешь место (*nach Italien*), и существительного с *ein* здесь нет, поэтому нужно *nicht*. Оно стоит прямо перед местом.'
  c10:
    why: 'У *Fleisch* в утвердительном предложении нет артикля (*Ich esse Fleisch*), поэтому нужен *kein*. *Fleisch* среднего рода: *kein Fleisch*.'
  c11:
    why: 'Вопрос с отрицанием, но дальше сказано, что ты пойдёшь, значит, ответ — «да, у меня есть время». После вопроса с отрицанием такое «да» — это *doch*, а остальная часть ответа утвердительная.'
  c12:
    why: 'Дальше сказано, что ты останешься дома, значит, ты соглашаешься с отрицанием в вопросе. Это *nein*, и остальная часть ответа тоже с отрицанием. *doch* значило бы, что ты всё-таки пойдёшь.'
  c13:
    why: 'Отрицается только место, а *sondern* называет правильное. Место отрицают через *nicht*.'
  c14:
    why: 'После *es gibt* стоит винительный падеж. *Supermarkt* мужского рода, поэтому *ein* → *einen* → *keinen*.'
  c15:
    why: 'У *Ahnung* (понятие, представление) в утвердительном предложении нет артикля, поэтому нужен *kein*. *Ahnung* женского рода: *keine Ahnung*, и как дополнение после *haben* тоже.'

wordOrder:
  w1:
    translation: Я не понимаю вопрос.
    why: 'У *die Frage* стоит *die*, поэтому отрицают через *nicht*. Когда отрицается всё предложение, *nicht* стоит в конце, после дополнения. *die Frage* может стоять и первым.'
  w2:
    translation: Я этого не знаю.
    why: '*nicht* стоит в конце, после дополнения *das*. *das* может стоять и первым, так говорят очень часто.'
  w3:
    translation: Это недорого.
    why: '*nicht* стоит прямо перед прилагательным *teuer*. Если *teuer* стоит первым, чтобы выделить его, *nicht* остаётся в конце.'
  w4:
    translation: Он не живёт в Вене.
    why: '*nicht* стоит перед местом *in Wien*. Если *in Wien* стоит первым, *nicht* остаётся в конце.'
  w5:
    translation: Мне не нравится еда.
    why: '*nicht* отрицает всё предложение, поэтому стоит в конце, после *mir*. *mir* может стоять и первым: *mir schmeckt das Essen nicht*.'
  w6:
    translation: К сожалению, я не смогу прийти.
    why: '*nicht* стоит перед вторым глаголом *kommen* в конце. *leider* (к сожалению) может стоять и первым.'
  w7:
    translation: Ты не пойдёшь с нами?
    why: 'Вопрос без вопросительного слова начинается с глагола *kommst*, потом подлежащее *du*. У *mitkommen* отделяемая приставка: *mit* уходит в конец, а *nicht* стоит прямо перед ней.'
  w8:
    translation: Его нет дома.
    why: '*nicht* стоит перед местом *zu Hause*. Если *zu Hause* стоит первым, *nicht* остаётся в конце.'
  w9:
    translation: Он не хочет смотреть этот фильм.
    why: '*nicht* стоит после дополнения *den Film* и перед вторым глаголом *sehen* в конце. *den Film* может стоять и первым.'
  w10:
    translation: Она не из Германии, а из Австрии.
    why: 'Отрицается только место, поэтому *nicht* стоит прямо перед *aus Deutschland*. Потом *sondern* называет правильное место.'

austrianNotes:
  at1: В этом году мы не поедем в отпуск.
