# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Это не проблема.
  e2: У меня сегодня нет времени.
  e3: У нас нет машины.
  e4: У моих соседей нет детей.
  e5: Я не хочу есть.
  e6: Он не пьёт кофе.
  e7: Я сегодня не приду.
  e8: Я не знаю этого человека.
  e9: Вода не холодная.
  e10: Он живёт не в Вене.
  e11: К сожалению, сегодня я не смогу прийти.
  e12: Я приду не сегодня, а завтра.
  e13: Мы едем не в Вену, а в Грац.
  e14: Это не телефон, это фотоаппарат.
  e15: Я не могу найти ключ.
  e16: У меня с собой нет денег.
  e17: Это не мой телефон.
  e18: Ты не хочешь есть? – Хочу.
  e19: Ты не пойдёшь с нами? – Нет, я останусь дома.

choice:
  c1:
    why: 'В утвердительном предложении — *ein Auto*, значит, в отрицании — *kein Auto*. *Auto* среднего рода.'
  c2:
    why: 'В утвердительном предложении — *ein Problem*, значит, в отрицании — *kein Problem*. После *das ist* дополнения нет, поэтому без *-en*.'
  c3:
    why: 'У *Zeit* в утвердительном предложении нет артикля (*Zeit haben*), поэтому нужен *kein*. *Zeit* женского рода: *keine Zeit*.'
  c4:
    why: '*Hunger* мужского рода и стоит как прямое дополнение после *haben*, поэтому *kein* становится *keinen*.'
  c5:
    why: 'Здесь ты отрицаешь глагол, поэтому нужно *nicht*. Оно стоит в конце, после дополнения *das*.'
  c6:
    why: '*teuer* — прилагательное. Прилагательные отрицают через *nicht*, никогда через *kein*.'
  c7:
    why: 'У *mein Fahrrad* стоит *mein*, а не *ein*, поэтому нужно *nicht*: *nicht mein Fahrrad*.'
  c8:
    why: '*Geschwister* (братья и сёстры) — множественное число без артикля в утвердительном предложении, поэтому *keine*.'
  c9:
    why: 'У *meinen Schlüssel* стоит *mein*, поэтому отрицают через *nicht*. Оно стоит в конце, после дополнения.'
  c10:
    why: 'У *Alkohol* в утвердительном предложении нет артикля, и он мужского рода. Как прямое дополнение он получает *keinen*.'
  c11:
    why: 'Вопрос с отрицанием, а ответ значит «да, у меня есть время». Такое «да» — это *doch*.'
  c12:
    why: 'Ответ соглашается с отрицанием в вопросе: я не пойду. Это *nein*.'
  c13:
    why: 'Отрицается только место, а *sondern* называет правильное. Место отрицают через *nicht*.'
  c14:
    why: 'После *es gibt* стоит винительный падеж. *Supermarkt* мужского рода, поэтому *ein* → *einen* → *keinen*.'

wordOrder:
  w1:
    translation: Я сегодня не приду.
    why: '*nicht* отрицает всё предложение, поэтому стоит в конце, после слова времени *heute*. *heute* может стоять и первым. *nicht heute* тоже правильно, но тогда отрицается только день (*nicht heute, sondern morgen*).'
  w2:
    translation: Я этого не знаю.
    why: '*nicht* стоит в конце, после дополнения *das*. *das* может стоять и первым, так говорят очень часто.'
  w3:
    translation: Это недорого.
    why: '*nicht* стоит прямо перед прилагательным *teuer*. Если *teuer* стоит первым, чтобы выделить его, *nicht* остаётся в конце.'
  w4:
    translation: Он живёт не в Вене.
    why: '*nicht* стоит перед местом *in Wien*. Если *in Wien* стоит первым, *nicht* остаётся в конце.'
  w5:
    translation: У нас нет времени.
    why: 'У *Zeit* в утвердительном предложении нет артикля, поэтому в отрицании — *keine Zeit*. *keine Zeit* может стоять и первым, чтобы выделить его.'
  w6:
    translation: К сожалению, я не смогу прийти.
    why: '*nicht* стоит перед вторым глаголом *kommen* в конце. *leider* (к сожалению) может стоять и первым.'
  w7:
    translation: Ты не хочешь есть?
    why: 'Вопрос без вопросительного слова начинается с глагола *hast*, потом подлежащее *du*. *Hunger* мужского рода: *keinen Hunger*.'
  w8:
    translation: Это не мой телефон.
    why: 'У *mein Handy* стоит *mein*, поэтому нужно *nicht* прямо перед ним. Если *mein Handy* стоит первым, *nicht* уходит в конец.'

austrianNotes:
  at1: В этом году мы не поедем в отпуск.
