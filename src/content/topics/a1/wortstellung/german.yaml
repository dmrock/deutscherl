    parts: [ich, wohne, in Graz]
    accept:
      - [in Graz, wohne, ich]
    punctuation: '.'
  - id: w2
    parts: [am Montag, habe, ich, frei]
    fixed: true
    punctuation: '.'
  - id: w3
    parts: [morgen, muss, ich, lange, arbeiten]
    fixed: true
    punctuation: '.'
  - id: w4
    parts: [der Film, fängt, um acht Uhr, an]
    accept:
      - [um acht Uhr, fängt, der Film, an]
    punctuation: '.'
  - id: w5
    parts: [sprechen, Sie, Englisch]
    fixed: true
    punctuation: '?'
  - id: w6
    parts: [wo, wohnst, du]
    fixed: true
    punctuation: '?'
  - id: w7
    parts: [was, machst, du, am Wochenende]
    fixed: true
    punctuation: '?'
  - id: w8
    parts: [kannst, du, mir, helfen]
    fixed: true
    punctuation: '?'

