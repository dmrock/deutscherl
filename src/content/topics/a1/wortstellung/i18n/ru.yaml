# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я живу в Граце.
  e2: Мой брат работает в отеле.
  e3: Сегодня я работаю дома.
  e4: На выходных мы едем в Зальцбург.
  e5: В Вене живёт моя сестра.
  e6: Этот фильм я уже знаю.
  e7: Я хочу выпить кофе.
  e8: Завтра мне нужно долго работать.
  e9: Я каждый день встаю в семь часов.
  e10: Курс начинается в девять часов.
  e11: Я хочу есть, но холодильник пустой.
  e12: Сегодня мы остаёмся дома, потому что идёт дождь.
  e13: Вы говорите по-английски?
  e14: Ты давно живёшь в Вене?
  e15: Где ты живёшь?
  e16: Откуда вы?
  e17: Куда ты едешь летом?
  e18: Когда начинается курс?
  e19: Что ты делаешь на выходных?
  e20: Почему ты учишь немецкий?

choice:
  c1:
    why: '*heute* стоит на первом месте, поэтому глагол *gehe* идёт вторым, а подлежащее *ich* — за ним.'
  c2:
    why: '*am Wochenende* — одна часть, она стоит на первом месте. Глагол *besuche* идёт вторым, потом *ich*.'
  c3:
    why: 'Дополнение *Deutsch* стоит первым, чтобы его выделить. Глагол всё равно идёт вторым, потом *ich*.'
  c4:
    why: 'В вопросе первым стоит вопросительное слово, вторым — глагол: *wo wohnst du*.'
  c5:
    why: 'Вопросительное слово *was* стоит на первом месте, поэтому глагол *machst* идёт вторым, потом *du*.'
  c6:
    why: 'В ответе место, откуда человек (*aus Polen*), поэтому спрашивают *woher*.'
  c7:
    why: 'В ответе место, где человек находится (*in Linz*), поэтому спрашивают *wo*.'
  c8:
    why: 'В ответе место, куда человек едет (*nach Italien*), поэтому спрашивают *wohin*.'
  c9:
    why: 'В ответе время (*um acht Uhr*), поэтому спрашивают *wann*.'
  c10:
    why: 'Имя спрашивают через *wie*: *Wie heißt du?*'
  c11:
    why: 'Модальный глагол *möchte* стоит на втором месте, а второй глагол уходит в конец в начальной форме: *essen*.'
  c12:
    why: '*abfahren* — глагол с отделяемой приставкой. *fährt* стоит на втором месте, а *ab* уже стоит в конце.'
  c13:
    why: '*denn* не занимает места. Предложение после него начинается с *es*, а глагол *regnet* идёт вторым.'

wordOrder:
  w1:
    translation: Я живу в Граце.
    why: 'Глагол *wohne* стоит вторым. *in Graz* может стоять и первым, тогда *ich* идёт после глагола.'
  w2:
    translation: В понедельник у меня выходной.
    why: '*am Montag* стоит на первом месте, поэтому глагол *habe* идёт вторым, а *ich* — сразу за ним.'
  w3:
    translation: Завтра мне нужно долго работать.
    why: 'После *morgen* на втором месте стоит *muss*, потом *ich*. Второй глагол *arbeiten* уходит в конец.'
  w4:
    translation: Фильм начинается в восемь часов.
    why: '*fängt* стоит на втором месте, а *an* от *anfangen* уходит в конец. *um acht Uhr* может стоять и первым.'
  w5:
    translation: Вы говорите по-английски?
    why: 'Вопрос без вопросительного слова начинается с глагола *sprechen*, потом подлежащее *Sie*.'
  w6:
    translation: Где ты живёшь?
    why: 'Первым стоит вопросительное слово *wo*, вторым — глагол *wohnst*, потом *du*.'
  w7:
    translation: Что ты делаешь на выходных?
    why: 'Первым стоит вопросительное слово *was*, потом глагол *machst* и подлежащее *du*. *am Wochenende* идёт после них.'
  w8:
    translation: Ты можешь мне помочь?
    why: 'Вопрос без вопросительного слова начинается с глагола *kannst*, потом *du*. Второй глагол *helfen* уходит в конец.'

austrianNotes:
  at1: Новый курс начинается в январе.
