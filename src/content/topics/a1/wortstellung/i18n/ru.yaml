# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я живу в Граце.
  e2: Мой брат работает в отеле.
  e3: Сегодня я работаю дома.
  e4: На выходных мы едем в Зальцбург.
  e5: В Вене живёт моя сестра.
  e6: Этот фильм я уже знаю.
  e7: Я хочу выпить кофе.
  e8: Завтра мне нужно долго работать.
  e9: Я каждый день встаю в семь часов.
  e10: Курс начинается в девять часов.
  e11: Я хочу есть, но холодильник пустой.
  e12: Сегодня мы остаёмся дома, потому что идёт дождь.
  e13: Вы говорите по-английски?
  e14: Ты давно живёшь в Вене?
  e15: Где ты живёшь?
  e16: Откуда Вы?
  e17: Куда ты едешь летом?
  e18: Когда начинается курс?
  e19: Что ты делаешь на выходных?
  e20: Почему ты учишь немецкий?

choice:
  c1:
    why: '*heute* стоит на первом месте, поэтому глагол *gehe* идёт вторым, а подлежащее *ich* — сразу за ним. *ins Kino* идёт после них.'
  c2:
    why: '*am Wochenende* — одна часть, она стоит на первом месте. Глагол *besuche* идёт вторым, потом *ich*. Подлежащее не уходит в конец.'
  c3:
    why: 'Дополнение *Deutsch* стоит первым, чтобы его выделить. Глагол *lerne* всё равно идёт вторым, потом *ich*. *seit einem Jahr* не может тоже стоять перед глаголом.'
  c4:
    why: 'В вопросе первым стоит вопросительное слово, вторым — глагол, а подлежащее сразу за ним: *wo wohnst du*. *jetzt* идёт после них.'
  c5:
    why: 'Вопросительное слово *was* стоит на первом месте, поэтому модальный глагол *möchtest* идёт вторым, потом *du*. Второй глагол *essen* уходит в конец.'
  c6:
    why: 'В ответе место, откуда человек (*aus Polen*), поэтому спрашивают *woher*.'
  c7:
    why: 'В ответе место, где человек находится (*in Linz*), поэтому спрашивают *wo*.'
  c8:
    why: 'В ответе место, куда человек едет (*nach Italien*), поэтому спрашивают *wohin*.'
  c9:
    why: 'В ответе время (*um acht Uhr*), поэтому спрашивают *wann*.'
  c10:
    why: '*morgen* стоит на первом месте, поэтому *muss* идёт вторым, потом *ich*. После модального глагола *aufstehen* уходит в конец одним словом.'
  c11:
    why: 'Модальный глагол *möchte* стоит на втором месте, а второй глагол уходит в конец в начальной форме: *essen*. *esse*, *isst* и *esst* меняются по лицам.'
  c12:
    why: '*abfahren* — глагол с отделяемой приставкой. *fährt* стоит на втором месте, а *ab* уходит в конец: *fährt gleich ab*.'
  c13:
    why: '*denn* не занимает места. Предложение после него начинается с *ich*, а глагол *bin* идёт вторым. Глагол в конце бывает после *weil*, а не после *denn*.'
  c14:
    why: '*aber* не занимает места. После него на первом месте стоит *am Sonntag*, поэтому глагол *schlafe* идёт вторым, потом *ich*.'
  c15:
    why: 'Первым стоит вопросительное слово *wann*, вторым — модальный глагол *kannst*, потом *du*. После модального глагола *abholen* уходит в конец одним словом.'

wordOrder:
  w1:
    translation: Уже поздно, но мне ещё нужно поработать.
    why: '*aber* не занимает места, поэтому *ich* стоит на первом месте, а *muss* — на втором. Второй глагол *arbeiten* уходит в конец. *aber* может стоять и после глагола: *ich muss aber noch arbeiten*.'
  w2:
    translation: В понедельник у меня выходной.
    why: '*am Montag* стоит на первом месте, поэтому глагол *habe* идёт вторым, а *ich* — сразу за ним.'
  w3:
    translation: Завтра мне нужно долго работать.
    why: 'После *morgen* на втором месте стоит *muss*, потом *ich*. Второй глагол *arbeiten* уходит в конец.'
  w4:
    translation: Когда начинается фильм?
    why: 'Первым стоит вопросительное слово *wann*, вторым — глагол *fängt*, потом подлежащее *der Film*. *an* от *anfangen* уходит в конец.'
  w5:
    translation: В субботу я убираю свою комнату.
    why: '*am Samstag* стоит на первом месте, поэтому *räume* идёт вторым, потом *ich*. *auf* от *aufräumen* уходит в конец.'
  w6:
    translation: Хочешь выпить кофе?
    why: 'Вопрос без вопросительного слова начинается с глагола *möchtest*, потом *du*. Второй глагол *trinken* уходит в конец.'
  w7:
    translation: Что ты делаешь на выходных?
    why: 'Первым стоит вопросительное слово *was*, потом глагол *machst* и подлежащее *du*. *am Wochenende* идёт после них.'
  w8:
    translation: Ты можешь мне помочь?
    why: 'Вопрос без вопросительного слова начинается с глагола *kannst*, потом *du*. Второй глагол *helfen* уходит в конец.'
  w9:
    translation: Сегодня вечером я тебе позвоню.
    why: '*heute Abend* стоит на первом месте, поэтому *rufe* идёт вторым, потом *ich* и *dich*. *an* от *anrufen* уходит в конец.'
  w10:
    translation: Где здесь можно припарковаться?
    why: 'Первым стоит вопросительное слово *wo*, вторым — модальный глагол *kann*, потом *ich*. Второй глагол *parken* уходит в конец.'

austrianNotes:
  at1: Новый курс начинается в январе.
