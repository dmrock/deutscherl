      - [unserer Oma, schenken, wir, einen Kalender]
      - [einen Kalender, schenken, wir, unserer Oma]
    punctuation: '.'
  - id: w2
    parts: [wem, schenkst, du, die Blumen]
    fixed: true
    punctuation: '?'
  - id: w3
    parts: [die Jacke, gefällt, mir, sehr]
    accept:
      - [mir, gefällt, die Jacke, sehr]
    punctuation: '.'
  - id: w4
    parts: [nach dem Essen, trinken, wir, einen Kaffee]
    fixed: true
    punctuation: '.'
  - id: w5
    parts: [gibst, du, mir, deine Telefonnummer]
    fixed: true
    punctuation: '?'
  - id: w6
    parts: [ich, zeige, meinen Freunden, ein Video]
    accept:
      - [meinen Freunden, zeige, ich, ein Video]
      - [ein Video, zeige, ich, meinen Freunden]
    punctuation: '.'
  - id: w7
    parts: [ich, gratuliere, dir, zum Geburtstag]
    fixed: true
    punctuation: '.'

