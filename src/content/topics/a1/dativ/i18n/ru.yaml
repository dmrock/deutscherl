# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Кому ты пишешь? – Моей бабушке.
  e2: Я иду гулять с собакой.
  e3: Сегодня я ночую у подруги.
  e4: Со своим ребёнком я говорю по-немецки.
  e5: Я играю с детьми в футбол.
  e6: Дом принадлежит моим родителям.
  e7: Моя мама любит играть с малышами.
  e8: Ты едешь на велосипеде или на автобусе?
  e9: Мой сын сегодня у своего друга.
  e10: Завтра я еду к родителям.
  e11: После завтрака я читаю газету.
  e12: Подарок от моей тёти.
  e13: Достань, пожалуйста, молоко из холодильника.
  e14: Как мне дойти до вокзала?
  e15: Я езжу на работу на велосипеде.
  e16: Я сейчас в булочной.
  e17: Я заберу тебя с вокзала.
  e18: Сегодня я помогаю бабушке.
  e19: Спасибо тебе за помощь.
  e20: Мы поздравляем нашу учительницу с днём рождения.
  e21: Моему папе не нравится этот свитер.
  e22: Велосипед принадлежит моей сестре.
  e23: Детям нравится суп.
  e24: Я даю официанту деньги.
  e25: Мы дарим маме цветы.
  e26: Учительница показывает ученикам картинку.
  e27: Передай мне, пожалуйста, соль.
  e28: Кому ты помогаешь? – Моему брату.
  e29: Дети помогают маме на кухне.
  e30: Нашим гостям очень нравится город.

choice:
  c1:
    why: 'После *mit* — дательный падеж. *der Zug* мужского рода, поэтому *mit dem Zug*.'
  c2:
    why: 'После *nach* — дательный падеж. *der Kurs* мужского рода, поэтому *nach dem Kurs*. *den* — это винительный падеж.'
  c3:
    why: 'После *bei* — дательный падеж. *die Mutter* женского рода, поэтому *seine* превращается в *seiner*.'
  c4:
    why: 'В дательном падеже множественного числа существительное получает лишнее -n: *die Kinder* → *mit den Kindern*.'
  c5:
    why: '*gehören* требует дательного падежа. *die Lehrerin* женского рода, поэтому артикль в дательном — *der*.'
  c6:
    why: '*helfen* требует дательного падежа, поэтому *ich* превращается в *mir*. *mich* — это винительный падеж.'
  c7:
    why: '*gratulieren* требует дательного падежа. *der Bruder* мужского рода, поэтому *meinem Bruder*. *meinen* был бы винительным падежом.'
  c8:
    why: '*der Zahnarzt* мужского рода, и *zu dem* превращается в *zum*. *zu* — когда идёшь куда-то; *beim* — когда ты уже там.'
  c9:
    why: 'Здесь *von* значит «с, от». *die Arbeit* женского рода, а у *von der* нет короткой формы. *vom* — только для мужского и среднего рода.'
  c10:
    why: '*schmecken* требует дательного падежа. *die Gäste* — множественное число: *den Gästen*, с лишним -n у существительного.'
  c11:
    why: 'Подруга получает книгу, поэтому она в дательном падеже. *die Freundin* женского рода: *meiner Freundin*.'
  c12:
    why: '*schmecken* требует дательного падежа. *das Kind* среднего рода, поэтому *kein* превращается в *keinem*.'
  c13:
    why: '*gehören* требует дательного падежа, поэтому вопрос о человеке — *Wem?* (кому?). *Wen?* — для винительного падежа, *Wer?* — для подлежащего.'
  c14:
    why: 'После *aus* — дательный падеж. *die Schweiz* женского рода и всегда идёт с артиклем: *aus der Schweiz*.'
  c15:
    why: '*die Schule* женского рода, и *zu der* превращается в *zur*. *zum* — для мужского и среднего рода.'

wordOrder:
  w1:
    translation: Мы дарим бабушке календарь.
    why: 'Глагол *schenken* стоит на втором месте. Человек (*unserer Oma*, дательный падеж) идёт перед вещью (*einen Kalender*, винительный падеж). Любое из дополнений может стоять и первым; тогда *wir* встаёт после глагола.'
  w2:
    translation: Кому ты даришь цветы?
    why: 'Сначала вопросительное слово *wem*, потом глагол *schenkst*, потом подлежащее *du*, а затем вещь.'
  w3:
    translation: Мне очень нравится эта куртка.
    why: 'С *gefallen* вещь (*die Jacke*) — подлежащее, а человек (*mir*) стоит в дательном падеже. *mir* может стоять и первым: *mir gefällt die Jacke sehr*.'
  w4:
    translation: После еды мы пьём кофе.
    why: '*nach dem Essen* стоит на первом месте, поэтому дальше идёт глагол *trinken*, а подлежащее *wir* встаёт после него.'
  w5:
    translation: Дашь мне свой номер телефона?
    why: 'В вопросе без вопросительного слова глагол *gibst* стоит первым, подлежащее *du* — вторым. Человек (*mir*) идёт перед вещью.'
  w6:
    translation: Я показываю друзьям видео.
    why: '*zeige* стоит на втором месте. Человек (*meinen Freunden*, дательный падеж множественного числа с -n) идёт перед вещью (*ein Video*). Любое из дополнений может стоять и первым; тогда *ich* встаёт после глагола.'
  w7:
    translation: Поздравляю тебя с днём рождения.
    why: '*gratulieren* требует дательного падежа: *dir*. Повод идёт с *zum* (*zu dem*): *zum Geburtstag*.'

austrianNotes:
  at1: Мы едем на трамвае к ратуше.
  at2: Сегодня вечером мы идём в винный ресторанчик.
