choice:
  c1:
    why: 'Ты обращаешься к Анне — одному человеку на «ты». У *geben* e меняется на i (*du gibst*), и это чередование остаётся: *gib*. *Gebt* — для нескольких человек, а *Geb* — ошибка, потому что чередование остаётся.'
  c2:
    why: 'Ты обращаешься к Лукасу, поэтому нужна форма для *du*. У *essen* e меняется на i (*du isst*), и чередование остаётся: *iss*. *ess* — ошибка, потому что чередование остаётся, а *esst* — для нескольких человек.'
  c3:
    why: 'У *fahren* с *du* a меняется на ä (*du fährst*), но в повелительном наклонении умлаут пропадает: *fahr*. *Fahrt* — для нескольких человек.'
  c4:
    why: 'У *lesen* e меняется на ie (*du liest*), и чередование остаётся: *lies*. От *liest* убирается только *-t*. *les* — ошибка, потому что чередование остаётся, а *lest* — для нескольких человек.'
  c5:
    why: 'Ты обращаешься к нескольким детям, поэтому нужна форма для *ihr*: *ihr nehmt* → *nehmt*. В форме для *ihr* гласная никогда не меняется. *nimm* — для одного человека.'
  c6:
    why: 'Ты вежливо обращаешься к госпоже Грубер, поэтому нужно *Sie*: сначала глагол, потом *Sie*. *nimm Sie* смешивает форму для *du* с *Sie*, а *nehmen* без *Sie* — не повелительное наклонение.'
  c7:
    why: 'Ты обращаешься к нескольким детям, поэтому нужна форма *sein* для *ihr*: *seid*. *sei* — для одного человека, а *sind* — не повелительное наклонение.'
  c8:
    why: 'Ты обращаешься к Тиму — одному человеку на «ты». Повелительное наклонение *sein* для *du* — *sei*. *bist* — это настоящее время, а *seid* — для нескольких человек.'
  c9:
    why: 'Ты вежливо обращаешься к господину Новаку, поэтому нужно *Seien Sie*. *sein* — единственный глагол, у которого форма для *Sie* не совпадает с настоящим временем: *Sind Sie* — это вопрос.'
  c10:
    why: 'Ты обращаешься к Мии, поэтому нужна форма для *du*. Основа *wart-* заканчивается на *-t*, поэтому форма с *-e*: *warte*. *wartet* — для нескольких человек.'
  c11:
    why: 'После пропуска стоит *Sie*, поэтому нужна форма для *Sie*, а она выглядит как инфинитив: *helfen Sie*. Чередование e → i бывает только с *du*: *hilf*. *helft* — для нескольких человек, к которым обращаешься на «ты».'
  c12:
    why: '*anmachen* — глагол с отделяемой приставкой. В повелительном наклонении глагол стоит первым, а *an* уходит в конец: *Mach bitte das Licht an*. В форме для *du* нет *-st*.'
  c13:
    why: 'Ты вежливо обращаешься к господину Бергеру, поэтому нужна форма инфинитива и *Sie*: *rufen Sie*. *ruf Sie* смешивает форму для *du* с *Sie*, а *rufen* без *Sie* — не повелительное наклонение.'
  c14:
    why: 'Ты обращаешься к дедушке — одному человеку на «ты». У *helfen* e меняется на i (*du hilfst*), и чередование остаётся: *hilf*. *helf* — ошибка, потому что чередование остаётся, а *helft* — для нескольких человек.'
  c15:
    why: 'Ты обращаешься к нескольким детям, поэтому нужна форма для *ihr*: *ihr geht* → *geht*. *geh* — для одного человека. Без местоимения *gehen* и *gehst* — не повелительное наклонение.'
  c16:
    why: 'Ты обращаешься к Йонасу, поэтому нужна форма для *du*: убери *du* и *-st* из *du schreibst* — получится *schreib*. *schreibt* — для нескольких человек.'
  c17:
    why: 'У *sprechen* e меняется на i (*du sprichst*), и чередование остаётся: *sprich*. *Sprech* — ошибка, потому что чередование остаётся, а *Sprecht* — для нескольких человек.'
  c18:
    why: 'Ты обращаешься к Марии, поэтому нужна форма для *du*. Основа *arbeit-* заканчивается на *-t*, поэтому форма с *-e*: *arbeite*. *arbeitet* — для нескольких человек.'
  c19:
    why: 'Ты обращаешься к Эмилю, поэтому нужна форма для *du*. У *schlafen* с *du* a меняется на ä (*du schläfst*), но в повелительном наклонении умлаут пропадает: *schlaf*. *schlaft* — для нескольких человек.'
  c20:
    why: 'Ты вежливо обращаешься к госпоже Вебер, поэтому нужна форма инфинитива и *Sie*: *fahren Sie*. *fahr* — форма для *du*, а *fahrt* — для нескольких человек.'
  c21:
    why: '*einsteigen* — глагол с отделяемой приставкой. Глагол стоит первым, а *ein* уходит в самый конец: *Steig schnell ein*. В форме для *du* нет *-st*.'

wordOrder:
  w1:
