    why: 'Глагол *lies* стоит первым. *den Text* и *noch einmal* могут стоять в любом порядке.'
  w12:
    translation: Откройте учебники!
    why: 'Форма для *ihr* *macht* стоит первой, а *auf* из *aufmachen* уходит в конец.'
