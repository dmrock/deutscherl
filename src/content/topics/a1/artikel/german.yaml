# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks the articles that the page highlights.

examples:
  # People: gender usually matches, with das Kind and das Mädchen as exceptions
  - id: e1
    de: '**Der** Mann dort ist mein Chef.'
  - id: e2
    de: '**Die** Frau dort ist meine Chefin.'
  - id: e3
    de: '**Das** Kind ist drei Jahre alt.'
  - id: e4
    de: '**Das** Mädchen heißt Lea.'
  # Things: masculine | feminine | neuter | plural
  - id: e5
    de: '**Der** Tisch ist neu.'
  - id: e6
    de: '**Die** Lampe ist schön.'
  - id: e7
    de: '**Das** Buch ist spannend.'
  - id: e8
    de: '**Die** Stühle sind bequem.'
  # ein or der
  - id: e9
    de: 'Dort ist **ein** Café. **Das** Café ist sehr gut.'
  - id: e10
    de: 'Heute scheint **die** Sonne.'
  - id: e11
    de: 'Im Park spielen Kinder.'
  # Clues for the gender
  - id: e12
    de: '**Die** Zeitung liegt auf dem Tisch.'
  - id: e13
    de: '**Die** Lehrerin ist sehr nett.'
  - id: e14
    de: '**Das** Brötchen ist noch warm.'
  - id: e15
    de: '**Das** Essen ist fertig.'
  - id: e16
    de: '**Der** Sommer in Wien ist heiß.'
  - id: e17
    de: '**Der** Fahrer wartet schon.'
  # Compound nouns: the last part decides
  - id: e18
    de: '**Die** Haustür ist offen.'
  - id: e19
    de: '**Der** Kühlschrank ist leer.'

