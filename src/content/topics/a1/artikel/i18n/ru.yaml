# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Мужчина вон там — мой начальник.
  e2: Женщина вон там — моя начальница.
  e3: Ребёнку три года.
  e4: Девочку зовут Леа.
  e5: Стол новый.
  e6: Лампа красивая.
  e7: Книга интересная.
  e8: Стулья удобные.
  e9: Вон там есть кафе. Это кафе очень хорошее.
  e10: Сегодня светит солнце.
  e11: В парке играют дети.
  e12: Газета лежит на столе.
  e13: Учительница очень милая.
  e14: Булочка ещё тёплая.
  e15: Еда готова.
  e16: Лето в Вене жаркое.
  e17: Водитель уже ждёт.
  e18: Входная дверь открыта.
  e19: Холодильник пустой.

choice:
  c1:
    why: '*Tisch* мужского рода: *der Tisch*. Род никак не связан со значением, поэтому учи слово с артиклем.'
  c2:
    why: 'Существительные на *-ung* женского рода: *die Zeitung*.'
  c3:
    why: 'Окончание *-chen* всегда даёт *das*, даже в *das Mädchen*, хотя это девочка.'
  c4:
    why: 'Глагол *sind* показывает, что это множественное число. Во множественном числе у всех существительных *die*: *die Brötchen*.'
  c5:
    why: '*Wohnung* заканчивается на *-ung*, поэтому это слово женского рода: *die Wohnung*.'
  c6:
    why: 'Женская профессия на *-in* — женского рода: *die Lehrerin*.'
  c7:
    why: 'Времена года мужского рода: *der Winter*, *der Sommer*.'
  c8:
    why: 'Существительные на *-ion* женского рода: *die Information*.'
  c9:
    why: '*Bäckerei* (пекарня) женского рода (*die Bäckerei*), поэтому неопределённый артикль — *eine*.'
  c10:
    why: '*Fahrrad* среднего рода (*das Fahrrad*), поэтому неопределённый артикль — *ein*. *einen* бывает только у дополнения мужского рода.'
  c11:
    why: '*Stuhl* мужского рода (*der Stuhl*). После *das ist* это не дополнение, поэтому артикль остаётся *ein*.'
  c12:
    why: 'В сложном слове род определяет последняя часть: *der Schrank*, значит *der Kühlschrank*.'
  c13:
    why: '*Handy* (мобильный телефон) среднего рода: *das Handy*.'
  c14:
    why: '*Schlüssel* мужского рода: *der Schlüssel*.'
  c15:
    why: 'Глагол, который стал существительным, — среднего рода: *essen* → *das Essen*.'

wordOrder:
  w1:
    translation: Где газета?
    why: 'Сначала вопросительное слово *wo*, потом глагол *ist*, потом подлежащее *die Zeitung*.'
  w2:
    translation: Это собака?
    why: 'Вопрос без вопросительного слова начинается с глагола *ist*. *das* (это) — подлежащее, после него *ein Hund*.'
  w3:
    translation: Как зовут девочку?
    why: 'Сначала вопросительное слово *wie*, потом глагол *heißt*, потом подлежащее *das Mädchen*.'
  w4:
    translation: Где дети?
    why: 'Сначала вопросительное слово *wo*, потом глагол *sind*, потом подлежащее *die Kinder*.'
  w5:
    translation: Холодильник пустой?
    why: 'Вопрос без вопросительного слова начинается с глагола *ist*, потом подлежащее *der Kühlschrank*. *leer* стоит в конце.'
  w6:
    translation: Сколько стоит булочка?
    why: 'Сначала вопросительное слово *was*, потом глагол *kostet*, потом подлежащее *das Brötchen*.'
  w7:
    translation: Квартира большая?
    why: 'Вопрос без вопросительного слова начинается с глагола *ist*, потом подлежащее *die Wohnung*. *groß* стоит в конце.'

