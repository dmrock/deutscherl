# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks the words in the case the page talks about (mostly the accusative object).

examples:
  # What the accusative is
  - id: e1
    de: 'Lena liest **ein Buch**.'
  - id: e2
    de: 'Am Sonntag besucht Lena **ihren Opa**.'
  # Forms: nominative | accusative, one row per gender and the plural
  - id: e3
    de: '**Der Kaffee** ist heiß.'
  - id: e4
    de: 'Ich möchte **einen Kaffee**.'
  - id: e5
    de: '**Die Wohnung** ist groß.'
  - id: e6
    de: 'Wir suchen **eine Wohnung**.'
  - id: e7
    de: '**Das Hotel** ist teuer.'
  - id: e8
    de: 'Wir buchen **ein Hotel**.'
  - id: e9
    de: '**Die Tomaten** sind frisch.'
  - id: e10
    de: 'Ich kaufe **Tomaten**.'
  # kein and possessives
  - id: e11
    de: 'Wir haben **keinen Fernseher**.'
  - id: e12
    de: 'Ich finde **meinen Schlüssel** nicht.'
  # The article shows the role
  - id: e13
    de: '**Der Lehrer** fragt **den Schüler**.'
  - id: e14
    de: '**Den Schüler** fragt **der Lehrer**.'
  - id: e15
    de: 'Das ist **mein Freund** Tom.'
  # wer, wen, was
  - id: e16
    de: '**Wer** kommt heute Abend?'
  - id: e17
    de: '**Wen** rufst du an?'
  - id: e18
    de: '**Was** fehlt noch?'
  - id: e19
    de: '**Was** isst du gern?'
  # Verbs with an accusative object
  - id: e20
    de: 'Ich habe **einen Bruder** und **eine Schwester**.'
  - id: e21
    de: 'Magst du **den Winter**?'
  # es gibt
  - id: e22
    de: 'Gibt es hier **einen Park**?'
  - id: e23
    de: 'Hier gibt es **keine Parkplätze**.'
  # Pronouns
  - id: e24
    de: 'Wo ist mein Schlüssel? Ich finde **ihn** nicht.'
  - id: e25
    de: 'Besuchst du **uns** am Sonntag?'

choice:
  - id: c1
    text: Ich nehme heute ___ Bus.
    answer: den
    options: [den, der, das, die]
  - id: c2
    text: Hast du ___ Bleistift?
    answer: einen
    options: [einen, ein, eine, der]
  - id: c3
    text: Anna bestellt ___ Tee mit Zitrone.
    answer: einen
    options: [einen, ein, eine, der]
  - id: c4
    text: Lukas möchte ___ Fahrrad.
    answer: ein
    options: [ein, einen, eine, der]
  - id: c5
    text: Entschuldigung, ich suche ___ Apotheke.
    answer: eine
    options: [eine, einen, ein, der]
  - id: c6
    text: ___ Kaffee ist heute sehr gut.
    answer: Der
    options: [Der, Den, Die, Das]
  - id: c7
    text: ___ Film kenne ich schon.
    answer: Den
    options: [Den, Der, Die, Das]
  - id: c8
    text: Ich habe heute ___ Hunger.
    answer: keinen
    options: [keinen, kein, keine]
  - id: c9
    text: Ich rufe heute ___ Vater an.
    answer: meinen
    options: [meinen, mein, meine]
  - id: c10
    text: Gibt es hier ___ Supermarkt?
    answer: einen
    options: [einen, ein, eine, der]
  - id: c11
    text: ___ besuchst du am Wochenende? – Meine Tante.
    answer: Wen
    options: [Wen, Wer, Was]
  - id: c12
    text: ___ kocht heute? – Mein Mann.
    answer: Wer
    options: [Wer, Wen, Was]
  - id: c13
    text: ___ trinkst du am Morgen? – Kaffee.
    answer: Was
    options: [Was, Wen, Wer]
  - id: c14
    text: Der Pullover ist schön. Ich kaufe ___.
    answer: ihn
    options: [ihn, er, es, sie]
  - id: c15
    text: Das ist ___ Computer.
    answer: mein
    options: [mein, meinen, meine]
  - id: c16
    text: Kaufst du bitte ___ Tomaten?
    answer: die
    options: [die, den, das, der]
  - id: c17
    text: Kannst du bitte ___ Licht ausmachen?
    answer: das
    options: [das, den, der, die]
  - id: c18
    text: Kennst du ___ Mann dort?
    answer: den
    options: [den, der, die, das]
  - id: c19
    text: Schau, da kommt ___ Bus!
    answer: der
    options: [der, den, die, das]

wordOrder:
  - id: w1
    parts: [ich, trinke, morgens, einen Tee]
    accept:
      - [morgens, trinke, ich, einen Tee]
      - [einen Tee, trinke, ich, morgens]
    punctuation: '.'
  - id: w2
    parts: [der Lehrer, fragt, den Schüler]
    accept:
      - [den Schüler, fragt, der Lehrer]
    punctuation: '.'
  - id: w3
    parts: [wen, triffst, du, heute]
    fixed: true
    punctuation: '?'
  - id: w4
    parts: [heute, gibt, es, keinen Unterricht]
    fixed: true
    punctuation: '.'
  - id: w5
    parts: [ich, vergesse, immer, meinen Schirm]
    accept:
      - [immer, vergesse, ich, meinen Schirm]
      - [meinen Schirm, vergesse, ich, immer]
    punctuation: '.'
  - id: w6
    parts: [möchtest, du, einen Kaffee]
    fixed: true
    punctuation: '?'
  - id: w7
    parts: [was, kochst, du, heute]
    fixed: true
    punctuation: '?'
  - id: w8
    parts: [kennst, du, ihn]
    fixed: true
    punctuation: '?'

