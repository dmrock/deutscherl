# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Лена читает книгу.
  e2: В воскресенье Лена навещает дедушку.
  e3: Кофе горячий.
  e4: Мне, пожалуйста, кофе.
  e5: Квартира большая.
  e6: Мы ищем квартиру.
  e7: Отель дорогой.
  e8: Мы бронируем отель.
  e9: Помидоры свежие.
  e10: Я покупаю помидоры.
  e11: У нас нет телевизора.
  e12: Я не могу найти свой ключ.
  e13: Учитель спрашивает ученика.
  e14: Ученика спрашивает учитель.
  e15: Это мой друг Том.
  e16: Кто придёт сегодня вечером?
  e17: Кому ты звонишь?
  e18: Чего ещё не хватает?
  e19: Что ты любишь есть?
  e20: У меня есть брат и сестра.
  e21: Ты любишь зиму?
  e22: Здесь есть парк?
  e23: Здесь нет парковочных мест.
  e24: Где мой ключ? Не могу его найти.
  e25: Ты зайдёшь к нам в воскресенье?

choice:
  c1:
    why: '*Bus* мужского рода (*der Bus*), и это то, на чём я еду, — прямое дополнение: *der* превращается в *den*.'
  c2:
    why: '*Bleistift* мужского рода (*der Bleistift*) и это прямое дополнение глагола *haben*, поэтому *ein* превращается в *einen*.'
  c3:
    why: '*Tee* мужского рода (*der Tee*), и это то, что заказывает Анна, поэтому винительный падеж — *einen Tee*.'
  c4:
    why: '*Fahrrad* среднего рода (*das Fahrrad*). Средний род в винительном падеже не меняется: *ein Fahrrad*.'
  c5:
    why: '*Apotheke* женского рода (*die Apotheke*). Женский род в винительном падеже не меняется: *eine Apotheke*.'
  c6:
    why: 'Здесь кофе — подлежащее (он «хороший»), а не дополнение. Подлежащее стоит в именительном падеже: *der Kaffee*.'
  c7:
    why: 'Подлежащее здесь *ich*, значит, *Film* — дополнение, хоть и стоит первым. Дополнение мужского рода: *den Film*.'
  c8:
    why: '*Hunger* мужского рода (*der Hunger*) и это прямое дополнение глагола *haben*. *kein* меняется как *ein*: *keinen Hunger*.'
  c9:
    why: '*Vater* мужского рода, и это тот, кому я звоню, — в немецком это прямое дополнение. *mein* меняется как *ein*: *meinen Vater*.'
  c10:
    why: 'После *es gibt* идёт винительный падеж. *Supermarkt* мужского рода, поэтому форма — *einen Supermarkt*.'
  c11:
    why: 'В ответе человек (*meine Tante*), и навещает её *du*, значит, тётя — дополнение. Человек-дополнение: *wen*.'
  c12:
    why: 'В ответе человек (*mein Mann*), который готовит, значит, он подлежащее. Человек-подлежащее: *wer*.'
  c13:
    why: 'В ответе предмет (*Kaffee*), поэтому вопрос — *was*. *wer* и *wen* спрашивают только о людях.'
  c14:
    why: '*Pullover* мужского рода (*der Pullover*), поэтому местоимение — *er*. Как прямое дополнение *er* превращается в *ihn*.'
  c15:
    why: 'У *sein* (здесь *ist*) нет прямого дополнения, поэтому *Computer* остаётся в именительном падеже: *mein Computer*, а не *meinen*.'
  c16:
    why: '*Tomaten* — множественное число. Во множественном числе винительный падеж не меняется: *die Tomaten*.'
  c17:
    why: '*Licht* среднего рода (*das Licht*). Средний род в винительном падеже не меняется: *das Licht*.'
  c18:
    why: '*Mann* мужского рода, и это тот, кого знает *du*, — прямое дополнение: *den Mann*.'
  c19:
    why: 'Автобус здесь подлежащее: это он приезжает. Подлежащее остаётся в именительном падеже, даже если стоит после глагола: *der Bus*.'

wordOrder:
  w1:
    translation: По утрам я пью чай.
    why: 'Глагол *trinke* стоит на втором месте. *einen Tee* — прямое дополнение. Первым может стоять и *morgens* или *einen Tee*; тогда *ich* встаёт после глагола.'
  w2:
    translation: Учитель спрашивает ученика.
    why: '*der Lehrer* — подлежащее, *den Schüler* — дополнение, поэтому первым может стоять любое из них. Глагол *fragt* остаётся на втором месте, и смысл не меняется.'
  w3:
    translation: С кем ты сегодня встречаешься?
    why: 'Вопрос о человеке-дополнении, поэтому он начинается с *wen*. Дальше идёт глагол *triffst*, потом подлежащее *du*.'
  w4:
    translation: Сегодня занятий нет.
    why: 'Первым стоит *heute*, поэтому глагол *gibt* на втором месте, а *es* — после него. После *es gibt* идёт винительный падеж: *keinen Unterricht*.'
  w5:
    translation: Я всегда забываю свой зонт.
    why: 'Глагол *vergesse* стоит на втором месте. *Schirm* мужского рода, поэтому дополнение — *meinen Schirm*. Первым может стоять и *immer* или *meinen Schirm*.'
  w6:
    translation: Хочешь кофе?
    why: 'В вопросе без вопросительного слова глагол *möchtest* стоит первым, потом подлежащее *du*, потом дополнение *einen Kaffee*.'
  w7:
    translation: Что ты сегодня готовишь?
    why: 'Сначала вопросительное слово *was*, потом глагол *kochst*, потом подлежащее *du*.'
  w8:
    translation: Ты его знаешь?
    why: 'В вопросе без вопросительного слова глагол *kennst* стоит первым, потом подлежащее *du*. Дополнение *ihn* (винительный падеж от *er*) идёт после подлежащего.'

