# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Это мой брат Макс.
  e2: Это твой телефон?
  e3: Наш дом уже старый.
  e4: Где живут ваши родители?
  e5: Это ваш чемодан, госпожа Хубер?
  e6: Это Пауль. Его сестра живёт в Линце.
  e7: Это Анна. Её брат живёт в Зальцбурге.
  e8: Ребёнок устал. Мама укладывает его спать.
  e9: Том и Лиза женаты. Их дочери два года.
  e10: Ваш поезд отправляется в восемь.
  e11: Ключ у вас с собой?
  e12: Моя квартира маленькая, но светлая.
  e13: Как тебе моя квартира?
  e14: Наша машина сломалась.
  e15: Мы продаём нашу машину.
  e16: Его родители живут в Вене.
  e17: В воскресенье она едет к своим родителям.
  e18: В пятницу я иду в кино с друзьями.
  e19: Лена гуляет со своей собакой.
  e20: Ты помогаешь сестре с домашним заданием?
  e21: Книга принадлежит нашему ребёнку.
  e22: Где Лео? Его кофе остывает.
  e23: Мои соседи милые. Их сад очень красивый.
  e24: Где Сара? Её телефон лежит здесь.

choice:
  c1:
    why: 'Ты говоришь о своей сестре, поэтому *mein* (мой). *Schwester* женского рода, поэтому окончание *-e*: *Meine Schwester*.'
  c2:
    why: 'Ты обращаешься к нескольким людям (*ihr wohnt*), поэтому «ваш» — *euer*. *Wohnung* женского рода, а *euer* с окончанием становится короче: *eure Wohnung*. *deine* — для одного человека.'
  c3:
    why: 'Ответ о машине самих говорящих, поэтому *unser* (наш). *Auto* среднего рода и здесь подлежащее, поэтому окончания нет: *unser Auto*.'
  c4:
    why: 'К госпоже Бергер обращаются на *Sie*, поэтому «ваш» — *Ihr* с большой буквы. *Tasche* женского рода: *Ihre Tasche*. *deine* — для того, к кому обращаются на *du*.'
  c5:
    why: 'К человеку обращаются на *du* (*wohnst du*), поэтому «твой» — *dein*. *Wohnung* женского рода: *deine Wohnung*. *Ihre* — для того, к кому обращаются на *Sie*.'
  c6:
    why: 'Ты обращаешься к нескольким детям, поэтому «ваш» — *euer*. *Ball* мужского рода и здесь подлежащее, поэтому окончания нет: *euer Ball*. *dein* — для одного ребёнка.'
  c7:
    why: 'Владелец — господин Новак, мужчина, поэтому *sein*. *Frau* женского рода: *seine Frau*. *Ihre* значило бы жену женщины.'
  c8:
    why: 'Владелица — госпожа Новак, женщина, поэтому *ihr*. *Mann* мужского рода, но от этого зависит только окончание: *ihr Mann*. *Sein* значило бы мужа мужчины.'
  c9:
    why: 'Владелица — Лиза, поэтому *ihr*. *Bruder* мужского рода, а после *für* — винительный падеж: *ihren Bruder*.'
  c10:
    why: 'Владелец — *das Hotel*, а это средний род, поэтому *sein*. Владельцем может быть и предмет. *Zimmer* здесь во множественном числе (*sind*), поэтому окончание *-e*: *seine Zimmer*.'
  c11:
    why: 'Владельцев несколько — соседи, поэтому *ihr* (их). *Tochter* женского рода: *ihre Tochter*.'
  c12:
    why: 'Бабушка и дедушка — это несколько владельцев, поэтому *ihr* (их). *Haus* среднего рода и здесь подлежащее: *ihr Haus*. *Sein* — только для одного владельца, который *er* или *es*.'
  c13:
    why: 'Владелица — Анна, поэтому *ihr*. *Vater* мужского рода и прямое дополнение глагола *anrufen*, поэтому *ihren Vater*.'
  c14:
    why: 'Владелец — Макс, поэтому *sein*. *Freundin* женского рода, но от этого зависит только окончание: *seine Freundin*.'
  c15:
    why: '*Handy* среднего рода. В винительном падеже меняется только мужской род, поэтому остаётся *mein Handy*.'
  c16:
    why: '*Opa* мужского рода и прямое дополнение глагола *besuchen*. В винительном падеже мужской род получает *-en*: *unseren Opa*.'
  c17:
    why: '*Pass* (паспорт) мужского рода и прямое дополнение глагола *haben*, поэтому *deinen Pass*.'
  c18:
    why: '*Eltern* — множественное число и здесь подлежащее, поэтому окончание *-e*: *meine Eltern*.'
  c19:
    why: '*Oma* женского рода. Женский род в винительном падеже не меняется, а *euer* с окончанием становится короче: *eure Oma*.'
  c20:
    why: '*Bus* мужского рода и здесь подлежащее, поэтому окончания нет: *euer Bus*.'
  c21:
    why: '*Hund* мужского рода и прямое дополнение глагола *mitbringen*. С окончанием *-en* *euer* становится короче: *euren Hund*.'
  c22:
    why: '*Telefonnummer* женского рода. Женский род в винительном падеже не меняется, поэтому *Ihre Telefonnummer*. *Ihren* — только для мужского рода.'
  c23:
    why: '*Auto* среднего рода. Средний род в винительном падеже не меняется, поэтому *sein Auto*.'
  c24:
    why: 'После *sein* (быть) существительное остаётся в именительном падеже. *Lehrerin* женского рода: *unsere Lehrerin*.'
  c25:
    why: '*Ring* мужского рода и прямое дополнение глагола *suchen*, поэтому *ihren Ring*.'
  c26:
    why: 'После *mit* — дательный падеж. *Freundin* женского рода, поэтому *meiner Freundin*.'
  c27:
    why: 'После *bei* — дательный падеж. *Eltern* — множественное число, поэтому *deinen Eltern*. *Eltern* уже оканчивается на -n, поэтому лишнего -n нет.'
  c28:
    why: '*helfen* требует дательного падежа. *Vater* мужского рода, поэтому *seinem Vater*. *seinen* — это винительный падеж.'
  c29:
    why: '*gehören* требует дательного падежа. *Tochter* женского рода, поэтому *unserer Tochter*.'
  c30:
    why: 'После *zu* — дательный падеж. *Großeltern* — множественное число, поэтому *euren Großeltern*. Форма множественного числа уже оканчивается на -n.'

  c31:
    why: 'После *mit* — дательный падеж. *Auto* среднего рода, поэтому *unserem Auto*, как в мужском роде.'
  c32:
    why: 'После *mit* — дательный падеж. Во множественном числе артикль оканчивается на *-en*, а существительное получает лишнее *-n*: *die Kinder* → *mit seinen Kindern*.'

