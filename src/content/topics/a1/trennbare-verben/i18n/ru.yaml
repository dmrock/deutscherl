# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я позвоню тебе завтра.
  e2: В субботу мы идём за покупками.
  e3: На выходных я встаю поздно.
  e4: Моя подруга пойдёт с нами сегодня вечером.
  e5: Здесь душно. Я открою окно.
  e6: Теперь холодно. Я снова закрою окно.
  e7: На главном вокзале мы выходим.
  e8: Я заеду за тобой в пять.
  e9: В пять я заканчиваю работу.
  e10: Дети хорошо слушают.
  e11: Я звоню маме каждое воскресенье после обеда.
  e12: Завтра я приглашаю коллег на обед.
  e13: Когда твой брат вернётся из отпуска?
  e14: Ты сегодня ещё пойдёшь за покупками?
  e15: Сегодня я с вами не пойду.
  e16: Ты можешь забрать меня с вокзала?
  e17: Мой брат каждый вечер смотрит телевизор.
  e18: Учебный год в школе начинается в сентябре.
  e19: Мой поезд прибывает в девять часов.
  e20: На день рождения мне подарят велосипед.
  e21: В воскресенье мы едем в гости к бабушке и дедушке.
  e22: Извините, я не понимаю вопрос.

choice:
  c1:
    why: 'С *ich* основная часть — *stehe*, она стоит на втором месте. Приставка *auf* уже стоит в конце, поэтому впереди её быть не может: *aufstehe* — ошибка.'
  c2:
    why: '*anrufen* делится: *ruft* стоит на втором месте, а *an* уходит в самый конец, после *mich* и *jeden Tag*.'
  c3:
    why: 'В вопросе с *wann* основная часть *kommt* стоит второй, потом подлежащее *der Zug*. Приставка *an* уходит в конец.'
  c4:
    why: 'В вопросе без вопросительного слова основная часть стоит первой, а *mit* уже в конце. С *du* форма — *kommst*.'
  c5:
    why: 'На *ver-* никогда не падает ударение, поэтому *verstehen* не делится: *ich verstehe das nicht*. С *ich* форма — *verstehe*.'
  c6:
    why: '*be-* не отделяется, поэтому *besuchen* остаётся одним словом. После *wann* глагол стоит вторым, потом подлежащее *du*.'
  c7:
    why: 'Основная часть *anfangen* меняется так же, как *fangen*: *er fängt*. *an* уже в конце. *fängst* — форма для *du*.'
  c8:
    why: 'Основная часть *fernsehen* меняется так же, как *sehen*: *du siehst*. В вопросе без вопросительного слова она стоит первой, а *fern* уходит в конец.'
  c9:
    why: 'Покупать продукты домой — это *einkaufen*, поэтому приставка *ein*.'
  c10:
    why: 'Когда холодно, окно закрывают: *zumachen*. *aufmachen* значит «открывать».'
  c11:
    why: '*Paul* — один человек, поэтому форма *hört*. Приставка *auf* уже в конце, поэтому перед глаголом её нет.'
  c12:
    why: '*be-* не отделяется, поэтому *bekomme* остаётся одним словом. После *zum Geburtstag* глагол стоит вторым, а *ich* — сразу за ним.'
  c13:
    why: 'Основная часть *einladen* меняется так же, как *laden*: *sie lädt*. *ein* уже в конце. *lädst* — форма для *du*.'
  c14:
    why: '*mitkommen* делится, и *mit* — самое последнее слово. *nicht* стоит прямо перед приставкой.'
  c15:
    why: 'Если на втором месте модальный глагол, например *kannst*, глагол с отделяемой приставкой уходит в конец одним словом: *abholen*.'
  c16:
    why: 'На своей остановке из автобуса или трамвая выходят, поэтому глагол — *aussteigen*. *einsteigen* значит «садиться».'

wordOrder:
  w1:
    translation: На вечеринку я принесу торт.
    why: '*zur Party* стоит на первом месте, поэтому *bringe* идёт вторым, потом *ich* и *einen Kuchen*. Приставка *mit* уходит в конец.'
  w2:
    translation: В субботу мы делаем покупки в супермаркете.
    why: '*am Samstag* стоит на первом месте, поэтому *kaufen* идёт вторым, потом *wir*. Место стоит в середине, а *ein* уходит в конец.'
  w3:
    translation: Когда вы приезжаете в Зальцбург?
    why: 'После *wann* основная часть *kommt* идёт второй, потом подлежащее *ihr*. *in Salzburg* стоит в середине, а *an* уходит в конец.'
  w4:
    translation: Пойдёшь с нами сегодня вечером?
    why: 'Вопрос без вопросительного слова начинается с основной части *kommst*, потом *du*. Приставка *mit* уходит в конец.'
  w5:
    translation: Мой поезд отправляется в восемь.
    why: 'Основная часть *abfahren* меняется так же, как *fahren*: *er fährt*. *fährt* стоит на втором месте, а *ab* уходит в конец.'
  w6:
    translation: Моя дочь слишком много смотрит телевизор.
    why: '*sieht* стоит на втором месте, а *fern* от *fernsehen* уходит в конец. *zu viel* стоит в середине.'
  w7:
    translation: Когда ты за мной заедешь?
    why: 'После *wann* основная часть *holst* идёт второй, потом *du* и *mich*. Приставка *ab* уходит в конец.'
  w8:
    translation: Сегодня я с вами не пойду.
    why: '*heute* стоит на первом месте, поэтому *komme* идёт вторым, потом *ich*. *nicht* стоит прямо перед приставкой *mit*, а она уходит в конец.'
  w9:
    translation: Закроешь, пожалуйста, окно?
    why: 'Вопрос начинается с основной части *machst*, потом *du*. *zu* от *zumachen* уходит в конец. *bitte* может стоять и после *das Fenster*.'
  w10:
    translation: На выходных мы ездим в гости к бабушке и дедушке.
    why: 'У *besuchen* приставка *be-*, поэтому он не делится. Он остаётся одним словом на втором месте, а *wir* идёт сразу за ним.'
  w11:
    translation: Я не понимаю это слово.
    why: 'У *verstehen* приставка *ver-*, поэтому он не делится. *verstehe* стоит на втором месте, а *nicht* уходит в конец.'
  w12:
    translation: Когда ты вернёшься из отпуска?
    why: 'После *wann* основная часть *kommst* идёт второй, потом *du*. *aus dem Urlaub* стоит в середине, а *zurück* уходит в конец.'

austrianNotes:
  at1: Включишь, пожалуйста, свет?
