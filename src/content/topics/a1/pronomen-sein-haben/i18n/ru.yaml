# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Макс, ты устал?
  e2: Дети, вы готовы?
  e3: Госпожа Бергер, у Вас есть минутка?
  e4: Господин и госпожа Новак, Вы впервые в Вене?
  e5: Где ключ? – Он в сумке.
  e6: Как суп? – Очень вкусный.
  e7: Номер свободен? – Да, свободен.
  e8: Где дети? – Они в саду.
  e9: Я учительница.
  e10: Мы из Граца.
  e11: Ты очень приятный человек.
  e12: Вы сегодня такие тихие.
  e13: Сегодня хорошая погода.
  e14: Мои родители в отпуске.
  e15: Это Пауль. Он студент.
  e16: Моему сыну семь лет.
  e17: У меня есть сестра.
  e18: У нас сегодня нет времени.
  e19: У тебя есть велосипед?
  e20: У вас красивая квартира.
  e21: У него сегодня день рождения.
  e22: У Вас есть свободный номер?
  e23: Я хочу есть. А ты?
  e24: Дети боятся собаки.

choice:
  c1:
    why: '*sein* с *ich* — это *bin*.'
  c2:
    why: '*ihr* (несколько человек, с которыми ты на «ты») требует *seid*. *sind* — форма для *wir*, *sie* и *Sie*.'
  c3:
    why: '*Paul* — это *er*, а *haben* с *er* — это *hat*: буква b пропадает.'
  c4:
    why: 'Вопрос к одному человеку на «ты»: *hast du …?* В вопросе без вопросительного слова глагол стоит первым.'
  c5:
    why: '*sein* с *wir* — это *sind*. *seid* — форма для *ihr*.'
  c6:
    why: 'С вежливым *Sie* форма та же, что с *sie* (они): *Sie haben*.'
  c7:
    why: '*Tisch* мужского рода (*der Tisch*), поэтому местоимение — *er*, даже для предмета. *Ihn* — форма для дополнения (*ich kaufe ihn*), а не для подлежащего.'
  c8:
    why: '*Lampe* женского рода (*die Lampe*), поэтому местоимение — *sie*. *ihn* не подходит дважды: это мужской род и форма для дополнения.'
  c9:
    why: '*Fahrrad* среднего рода (*das Fahrrad*), поэтому местоимение — *es*. *Ihm* значит «ему» (*ich gebe ihm das Buch*), поэтому не может быть подлежащим.'
  c10:
    why: 'По-немецки говорят «иметь жажду»: *Durst haben*. С *ich* глагол *haben* — это *habe*.'
  c11:
    why: 'Возраст выражают через *sein*. *Meine Tochter* — это *sie* (один человек), поэтому форма — *ist*.'
  c12:
    why: 'Том и Лиза — два человека, поэтому местоимение — *sie* (они), а *sein* с *sie* — это *sind*. Здесь оно стоит в начале предложения, поэтому с большой буквы. *Ihr seid* значило бы, что ты обращаешься к ним.'
  c13:
    why: 'Ты обращаешься к нескольким детям, поэтому местоимение — *ihr*, а *haben* с *ihr* — это *habt*. По-немецки говорят «иметь голод»: *Hunger haben*.'
  c14:
    why: 'По-немецки говорят «иметь страх»: *Angst haben*. *Das Kind* — это *es*, поэтому форма — *hat*.'
  c15:
    why: 'Ты не знаешь этого человека, поэтому обращаешься на вежливое *Sie*. С *Sie* — *sind*.'
  c16:
    why: 'Возраст выражают через *sein*, а не *haben*: *Wie alt sind deine Kinder?* *deine Kinder* — это *sie* (они), поэтому форма — *sind*.'
  c17:
    why: '*Schuhe* — множественное число, а местоимение для множественного числа всегда *sie* (они), и для предметов тоже, поэтому глагол — *sind*. *Sie ist* было бы для одного предмета женского рода: *die* здесь — артикль множественного числа. *es* было бы для одного предмета среднего рода.'
  c18:
    why: 'Ты обращаешься к одному незнакомому человеку, поэтому нужно вежливое *Sie*. С *Sie* всегда *sind*, даже если человек один: *ist Sie* и *seid Sie* — ошибки. *ihr* — для нескольких человек, с которыми ты на «ты».'
  c19:
    why: 'Ты обращаешься к бабушке и дедушке — двум людям, с которыми ты на «ты», поэтому нужно *ihr*. *sein* с *ihr* — это *seid*, а не *sind*.'
  c20:
    why: 'Ты обращаешься к маленькому мальчику, поэтому нужно *du*. По-немецки говорят «иметь страх»: *Angst haben*, поэтому *hast du*, а не *bist du*.'
  c21:
    why: '*Handy* среднего рода (*das Handy*), поэтому местоимение — *es*. По *mein* этого не видно: оно бывает и при мужском, и при среднем роде. *Ihm* значит «ему», поэтому не может быть подлежащим.'
  c22:
    why: '*Kaffee* мужского рода (*der Kaffee*), поэтому местоимение — *er*, а не *es*. *ihn* — форма для дополнения (*ich trinke ihn*), а не для подлежащего.'
  c23:
    why: 'По-немецки говорят «иметь день рождения»: *Geburtstag haben*. *mein Opa* — это *er*, поэтому форма — *hat*.'
  c24:
    why: '*die Kinder* — несколько человек (*sie*), поэтому *sein* — это *sind*. Подлежащее здесь стоит после глагола, так что смотри дальше пропуска.'
  c25:
    why: 'Ты говоришь о фрау Новак, а не с ней, поэтому она — *sie* (она), а *haben* с *sie* — это *hat*. *haben* было бы для *Sie*.'

