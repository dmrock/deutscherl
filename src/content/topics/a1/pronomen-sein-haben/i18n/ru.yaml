choice:
  c1:
    why: '*sein* с *ich* — это *bin*.'
  c2:
    why: '*ihr* (несколько человек, с которыми ты на «ты») требует *seid*. *sind* — форма для *wir*, *sie* и *Sie*.'
  c3:
    why: '*Paul* — это *er*, а *haben* с *er* — это *hat*: буква b пропадает.'
  c4:
    why: 'Вопрос к одному человеку на «ты»: *hast du …?* В вопросе без вопросительного слова глагол стоит первым.'
  c5:
    why: '*sein* с *wir* — это *sind*. *seid* — форма для *ihr*.'
  c6:
    why: 'С вежливым *Sie* форма та же, что с *sie* (они): *Sie haben*.'
  c7:
    why: '*Tisch* мужского рода (*der Tisch*), поэтому местоимение — *er*, даже для предмета.'
  c8:
    why: '*Lampe* женского рода (*die Lampe*), поэтому местоимение — *sie*.'
  c9:
    why: '*Fahrrad* среднего рода (*das Fahrrad*), поэтому местоимение — *es*.'
  c10:
    why: 'По-немецки говорят «иметь жажду»: *Durst haben*. С *ich* глагол *haben* — это *habe*.'
  c11:
    why: 'Возраст выражают через *sein*. *Meine Tochter* — это *sie* (один человек), поэтому форма — *ist*.'
  c12:
    why: 'Том и Лиза — два человека, поэтому местоимение — *sie* (они). Здесь оно стоит в начале предложения, поэтому с большой буквы.'
  c13:
    why: 'Ты обращаешься к двум друзьям, поэтому местоимение — *ihr*, а *sein* с *ihr* — это *seid*.'
  c14:
    why: 'По-немецки говорят «иметь страх»: *Angst haben*. *Das Kind* — это *es*, поэтому форма — *hat*.'
  c15:
    why: 'Ты не знаешь этого человека, поэтому обращаешься на вежливое *Sie*. С *Sie* — *sind*.'

wordOrder:
  w1:
    translation: Я голоден.
    why: 'Глагол *habe* стоит на втором месте. *Hunger* тоже может стоять первым, чтобы выделить его; тогда *ich* встаёт после глагола.'
  w2:
    translation: Ты сегодня дома?
    why: 'Вопрос без вопросительного слова начинается с глагола *bist*, потом подлежащее *du*. *heute* (когда) стоит перед *zu Hause* (где).'
  w3:
    translation: У Вас есть свободный номер?
    why: 'Вопрос без вопросительного слова начинается с глагола *haben*, потом подлежащее *Sie*. *frei* стоит в конце.'
  w4:
    translation: Где вы?
    why: 'Сначала вопросительное слово *wo*, потом глагол *seid*, потом подлежащее *ihr*.'
  w5:
    translation: У моей мамы сегодня день рождения.
    why: 'Глагол *hat* стоит на втором месте. *heute* тоже может стоять первым; тогда *meine Mutter* встаёт после глагола.'
  w6:
    translation: Вы госпожа Бергер?
    why: 'Вопрос без вопросительного слова начинается с глагола *sind*, потом подлежащее *Sie*.'
  w7:
    translation: Сколько тебе лет?
    why: 'Сначала вопросительные слова *wie alt*, потом глагол *bist*, потом подлежащее *du*. Возраст выражают через *sein*.'

