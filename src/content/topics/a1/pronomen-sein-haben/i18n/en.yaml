choice:
  c1:
    why: '*sein* with *ich* is *bin*.'
  c2:
    why: '*ihr* (several people you call *du*) takes *seid*. *sind* goes with *wir*, *sie* and *Sie*.'
  c3:
    why: '*Paul* is *er*, and *haben* with *er* is *hat*: the b disappears.'
  c4:
    why: 'A question to one person you call *du*: *hast du …?* The verb comes first in a yes/no question.'
  c5:
    why: '*sein* with *wir* is *sind*. *seid* is the form for *ihr*.'
  c6:
    why: 'Polite *Sie* takes the same form as the plural *sie*: *Sie haben*.'
  c7:
    why: '*Tisch* is masculine (*der Tisch*), so the pronoun is *er*, even for a thing. *Ihn* is the form for the object (*ich kaufe ihn*), not for the subject.'
  c8:
    why: '*Lampe* is feminine (*die Lampe*), so the pronoun is *sie*. *ihn* is wrong twice: it is masculine, and it is the form for the object.'
  c9:
    why: '*Fahrrad* is neuter (*das Fahrrad*), so the pronoun is *es*. *Ihm* means "to him" or "to it" (*ich gebe ihm das Buch*), so it cannot be the subject.'
  c10:
    why: 'German says "have thirst": *Durst haben*. With *ich*, *haben* is *habe*.'
  c11:
    why: 'Age goes with *sein*, as in English. *Meine Tochter* is *sie* (one person), so the form is *ist*.'
  c12:
    why: 'Tom and Lisa are two people, so the pronoun is *sie* (they), and *sein* with *sie* is *sind*. Here it starts the sentence, so it has a capital S. *Ihr seid* would mean you speak to them.'
  c13:
    why: 'You speak to several children, so the pronoun is *ihr*, and *haben* with *ihr* is *habt*. German says "have hunger": *Hunger haben*.'
  c14:
    why: 'German says "have fear": *Angst haben*. *Das Kind* is *es*, so the form is *hat*.'
  c15:
    why: 'You do not know the man, so you use polite *Sie*. *Sie* takes *sind*.'
  c16:
    why: 'Age goes with *sein*, not *haben*: *Wie alt sind deine Kinder?* *deine Kinder* are *sie* (they), so the form is *sind*.'
  c17:
    why: '*Schuhe* is plural, and the pronoun for a plural noun is always *sie* (they), also for things, so the verb is *sind*. *Sie ist* would be one feminine thing: *die* here is the plural article.'
  c18:
    why: 'You speak to one person you do not know, so you use polite *Sie*. *Sie* always takes *sind*, also for one person: *ist Sie* and *seid Sie* are wrong. *ihr* is for several people you call *du*.'
  c19:
    why: 'You speak to your grandparents, two people you call *du*, so you use *ihr*. *sein* with *ihr* is *seid*, not *sind*.'
  c20:
    why: 'You speak to a small boy, so you use *du*. German says "have fear": *Angst haben*, so *hast du*, not *bist du*.'
  c21:
    why: '*Handy* is neuter (*das Handy*), so the pronoun is *es*. *mein* does not show this: it goes with masculine and neuter nouns. *Ihm* means "to him" or "to it", so it cannot be the subject.'
  c22:
    why: '*Kaffee* is masculine (*der Kaffee*), so the pronoun is *er*, not *es*, even though English says "it". *ihn* is the form for the object (*ich trinke ihn*), not for the subject.'
  c23:
    why: 'German says "have birthday": *Geburtstag haben*. *mein Opa* is *er*, so the form is *hat*.'
  c24:
    why: '*die Kinder* are several people (*sie*), so *sein* is *sind*. The subject comes after the verb here, so look past the gap.'
  c25:
    why: 'You talk about Frau Novak, not to her, so she is *sie* (she), and *haben* with *sie* is *hat*. *haben* would be for *Sie*.'

