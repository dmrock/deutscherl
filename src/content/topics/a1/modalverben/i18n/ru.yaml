# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Летом мы хотим поехать в Зальцбург.
  e2: Тебе завтра нужно на работу?
  e3: Я умею хорошо плавать.
  e4: Мы можем созвониться завтра.
  e5: Ты умеешь играть на гитаре?
  e6: Вы можете переночевать у нас.
  e7: Мой сын уже умеет читать.
  e8: Не могли бы Вы повторить, пожалуйста?
  e9: Тебе обязательно нужно прочитать эту книгу!
  e10: Сегодня вам можно смотреть телевизор подольше.
  e11: Моя бабушка очень хорошо готовит.
  e12: Мы можем поехать и на поезде.
  e13: Мне каждый день нужно вставать в шесть.
  e14: Вам нужно расписаться здесь.
  e15: Можно я быстро воспользуюсь твоим телефоном?
  e16: В музее нельзя фотографировать.
  e17: Завтра праздник. Нам не нужно работать.
  e18: Здесь школа. Тебе нельзя ехать так быстро.
  e19: Мой брат хочет купить новую машину.
  e20: Хочешь пойти с нами в кино?
  e21: Врач говорит, что мне нужно пить больше воды.
  e22: Тебе помочь?
  e23: Мне кофе, пожалуйста.
  e24: Мы хотели бы расплатиться.
  e25: Что ты будешь пить?
  e26: Хотите ещё кусочек торта?
  e27: Пауль хотел бы на выходных поехать в горы.
  e28: Не хотите присесть?
  e29: Ты любишь рыбу?
  e30: Дети очень любят свою учительницу.

choice:
  c1:
    why: '*können* с *ich* — это *kann*, без окончания.'
  c2:
    why: '*mein Bruder* — это *er*. У модальных глаголов форма для *er* такая же, как для *ich*, без окончания: *er kann*. *kannst* — это форма для *du*, *könnt* — для *ihr*.'
  c3:
    why: 'С *du* глагол *können* — это *kannst*. Вопрос без вопросительного слова начинается с модального глагола, а *anrufen* уходит в конец.'
  c4:
    why: 'С *ihr* форма множественного числа правильная: основа *müss-* + *-t*, то есть *ihr müsst*. *musst* — это форма для *du*.'
  c5:
    why: 'С *du* глагол *müssen* — это *musst*. Основа уже заканчивается на звук «с», поэтому с *du* добавляется только *-t*. *müsst* — это форма для *ihr*.'
  c6:
    why: '*Max* — это *er*, а у *er* та же форма, что у *ich*, без окончания: *er darf*. *darfst* — это форма для *du*, *dürft* — для *ihr*.'
  c7:
    why: 'С *ihr* гласная остаётся как в инфинитиве, а окончание *-t*: *ihr dürft*. *darf* и *darfst* — формы единственного числа, а *dürfen* — форма для *wir*, *sie* и *Sie*.'
  c8:
    why: 'С *du* у *möchten* окончание *-est*: *du möchtest*. Здесь *möchten* стоит просто с существительным, без второго глагола.'
  c9:
    why: '*mein Freund* — это *er*, а *er möchte* без *-t*, как *ich möchte*. *möchtet* — это форма для *ihr*.'
  c10:
    why: 'С вежливым *Sie* форма совпадает с инфинитивом: *Sie möchten*.'
  c11:
    why: '*wollen* с *ich* — это *will*, без окончания.'
  c12:
    why: 'С *du* глагол *wollen* — это *willst*: в единственном числе гласная *i*. *will* — это форма для *ich* и *er*, *wollt* — для *ihr*.'
  c13:
    why: '*Lisa* — это *sie* (один человек), а у *sie* та же форма, что у *ich*, без окончания: *sie soll*. Этого хочет её мама, поэтому нужен глагол *sollen*.'
  c14:
    why: 'С *du* глагол *mögen* — это *magst*: в единственном числе гласная *a*. *mag* — это форма для *ich* и *er*, *mögt* — для *ihr*.'
  c15:
    why: '*meine Eltern* — это несколько человек (*sie*), поэтому форма совпадает с инфинитивом: *mögen*. *mögt* — это форма для *ihr*.'
  c16:
    why: 'В отпуске вставать рано не нужно: *ich muss nicht*. С *ich* глагол *müssen* — это *muss*, без окончания. *darfst* — форма для *du*, а *ich darf nicht* значило бы, что это запрещено.'
  c17:
    why: 'Музей бесплатный, поэтому платить не нужно: *wir müssen nichts bezahlen*. С *wir* форма совпадает с инфинитивом. *dürft* — форма для *ihr*, а *wir dürfen nichts bezahlen* значило бы, что платить запрещено.'
  c18:
    why: 'У Йонаса теперь есть машина, поэтому ездить на автобусе ему больше не нужно: *er muss nicht mehr*. У *er* та же форма, что у *ich*: *muss*. *darfst* — форма для *du*, а *er darf nicht* значило бы, что ездить на автобусе ему запрещено.'
  c19:
    why: 'С *Darf ich …?* вежливо просят разрешения. С *ich* форма *darf*, без окончания. *Willst* — форма для *du*, а *wollen* говорит о собственном желании.'
  c20:
    why: 'Ты вежливо говоришь, чего хочешь прямо сейчас, поэтому нужен *möchte*. С *ich* окончание *-e*. *magst* — форма для *du*, а *mögen* говорит о том, что тебе нравится, а не о том, чего ты хочешь сейчас.'
  c21:
    why: 'Ты слушаешь джаз каждый день, то есть он тебе вообще нравится: *ich mag*, без окончания. *möchtest* — форма для *du*, а *möchten* — для желания прямо сейчас.'
  c22:
    why: 'Это твоя собственная мечта, поэтому нужен *wollen*: *ich will*, без окончания. *sollst* — форма для *du*, а *sollen* значило бы, что этого хочет кто-то другой.'
  c23:
    why: 'Этого хочет начальник, а не ты, поэтому нужен *sollen*: *ich soll*, без окончания. *willst* — форма для *du*, а *wollen* значило бы, что это твоё собственное желание.'
  c24:
    why: 'С *Soll ich …?* спрашивают, чего от тебя хочет собеседник. С *ich* форма *soll*, без окончания. *Willst* — форма для *du*, а *wollen* спрашивает о твоём собственном желании.'

wordOrder:
  w1:
    translation: В субботу я хочу подольше поспать.
    why: '*am Samstag* стоит на первом месте, поэтому *will* идёт вторым, потом *ich*. Инфинитив *schlafen* уходит в конец.'
  w2:
    translation: Ты хорошо готовишь?
    why: 'Вопрос без вопросительного слова начинается с модального глагола *kannst*, потом *du*. Инфинитив *kochen* уходит в конец.'
  w3:
    translation: Что ты хочешь сегодня поесть?
    why: 'Первым стоит вопросительное слово *was*, потом модальный глагол *möchtest* и *du*. Инфинитив *essen* уходит в конец.'
  w4:
    translation: Сегодня вечером нам нужно убрать квартиру.
    why: '*heute Abend* стоит на первом месте, поэтому *müssen* идёт вторым, потом *wir*. Инфинитив *putzen* уходит в конец, после *die Wohnung*.'
  w5:
    translation: Здесь можно фотографировать?
    why: 'Вопрос без вопросительного слова начинается с модального глагола *darf*, потом *ich*. Инфинитив *fotografieren* уходит в конец.'
  w6:
    translation: Когда мы можем встретиться?
    why: 'Первым стоит вопросительное слово *wann*, потом модальный глагол *können* и *wir*. *uns* стоит перед инфинитивом *treffen*, который уходит в конец.'
  w7:
    translation: Моя дочь хочет стать врачом.
    why: '*meine Tochter* стоит на первом месте, модальный глагол *will* — на втором. Инфинитив *werden* уходит в конец.'
  w8:
    translation: Завтра мне хотелось бы поехать в Линц.
    why: '*ich* стоит на первом месте, модальный глагол *möchte* — на втором. Инфинитив *fahren* уходит в конец.'
  w9:
    translation: Поедем на автобусе?
    why: 'Вопрос без вопросительного слова начинается с модального глагола *sollen*, потом *wir*. Инфинитив *nehmen* уходит в конец.'
  w10:
    translation: На уроке вам нельзя пользоваться телефоном.
    why: '*im Unterricht* стоит на первом месте, поэтому *dürft* идёт вторым, потом *ihr*. *nicht* стоит прямо перед инфинитивом *benutzen* в конце.'
  w11:
    translation: Хотите что-нибудь выпить?
    why: 'Вопрос без вопросительного слова начинается с модального глагола *möchten*, потом *Sie*. Инфинитив *trinken* уходит в конец.'
  w12:
    translation: На выходных мы хотим навестить друзей в Граце.
    why: '*am Wochenende* стоит на первом месте, поэтому *wollen* идёт вторым, потом *wir*. Инфинитив *besuchen* уходит в конец. *in Graz* может стоять до или после *Freunde*.'
