choice:
  c1:
    why: '*können* with *ich* is *kann*, with no ending.'
  c2:
    why: '*mein Bruder* is *er*. With modal verbs, *er* has the same form as *ich*, with no ending: *er kann*. *kannst* is the form for *du*, *könnt* the form for *ihr*.'
  c3:
    why: 'With *du*, *können* is *kannst*. The yes/no question starts with the modal verb, and *anrufen* goes to the end.'
  c4:
    why: 'With *ihr*, the plural form is regular: the stem *müss-* + *-t*, so *ihr müsst*. *musst* is the form for *du*.'
  c5:
    why: 'With *du*, *müssen* is *musst*. The stem already ends in an s sound, so *du* adds only *-t*. *müsst* is the form for *ihr*.'
  c6:
    why: '*Max* is *er*, and *er* has the same form as *ich*, with no ending: *er darf*. *darfst* is the form for *du*, *dürft* the form for *ihr*.'
  c7:
    why: 'With *ihr*, the vowel stays as in the infinitive and the ending is *-t*: *ihr dürft*. *darf* and *darfst* are singular forms, and *dürfen* is the form for *wir*, *sie* and *Sie*.'
  c8:
    why: 'With *du*, *möchten* takes *-est*: *du möchtest*. Here *möchten* goes with a noun alone, without a second verb.'
  c9:
    why: '*mein Freund* is *er*, and *er möchte* has no *-t*, like *ich möchte*. *möchtet* is the form for *ihr*.'
  c10:
    why: 'Polite *Sie* takes the infinitive form: *Sie möchten*.'
  c11:
    why: '*wollen* with *ich* is *will*, with no ending.'
  c12:
    why: 'With *du*, *wollen* is *willst*: the singular has *i*. *will* is the form for *ich* and *er*, *wollt* the form for *ihr*.'
  c13:
    why: '*Lisa* is *sie* (one person), and *sie* has the same form as *ich*, with no ending: *sie soll*. Her mother wants it, so the verb is *sollen*.'
  c14:
    why: 'With *du*, *mögen* is *magst*: the singular has *a*. *mag* is the form for *ich* and *er*, *mögt* the form for *ihr*.'
  c15:
    why: '*meine Eltern* are several people (*sie*), so the form is the infinitive: *mögen*. *mögt* is the form for *ihr*.'
  c16:
    why: 'On holiday, getting up early is not necessary: *ich muss nicht*. With *ich*, *müssen* is *muss*, with no ending. *darfst* is a form for *du*, and *ich darf nicht* would mean it is forbidden.'
  c17:
    why: 'The museum is free, so paying is not necessary: *wir müssen nichts bezahlen*. With *wir*, the form is the infinitive. *dürft* is a form for *ihr*, and *wir dürfen nichts bezahlen* would mean paying is forbidden.'
  c18:
    why: 'Jonas has a car now, so taking the bus is no longer necessary: *er muss nicht mehr*. *er* has the same form as *ich*: *muss*. *darfst* is a form for *du*, and *er darf nicht* would mean taking the bus is forbidden.'
  c19:
    why: 'With *Darf ich …?* you ask politely for permission. With *ich*, the form is *darf*, with no ending. *Willst* is a form for *du*, and *wollen* says what you want yourself.'
  c20:
    why: 'You say politely what you want right now, so you use *möchte*. With *ich*, the ending is *-e*. *magst* is a form for *du*, and *mögen* says what you like, not what you want now.'
  c21:
    why: 'You listen to jazz every day, so you like it in general: *ich mag*, with no ending. *möchtest* is a form for *du*, and *möchten* is for a wish right now.'
  c22:
    why: 'It is your own dream, so you use *wollen*: *ich will*, with no ending. *sollst* is a form for *du*, and *sollen* would mean someone else wants it.'
  c23:
    why: 'Your boss wants it, not you, so you use *sollen*: *ich soll*, with no ending. *willst* is a form for *du*, and *wollen* would mean it is your own wish.'
  c24:
    why: 'With *Soll ich …?* you ask what the other person wants you to do. With *ich*, the form is *soll*, with no ending. *Willst* is a form for *du*, and *wollen* asks about your own wish.'

wordOrder:
  w1:
    translation: On Saturday I want to sleep in.
    why: '*am Samstag* is in position 1, so *will* comes second, then *ich*. The infinitive *schlafen* goes to the end.'
  w2:
    translation: Can you cook well?
    why: 'A yes/no question starts with the modal verb *kannst*, then *du*. The infinitive *kochen* goes to the end.'
  w3:
    translation: What would you like to eat today?
    why: 'The question word *was* comes first, then the modal verb *möchtest* and *du*. The infinitive *essen* goes to the end.'
  w4:
    translation: This evening we have to clean the flat.
    why: '*heute Abend* is in position 1, so *müssen* comes second, then *wir*. The infinitive *putzen* goes to the end, after *die Wohnung*.'
  w5:
    translation: Am I allowed to take photos here?
    why: 'A yes/no question starts with the modal verb *darf*, then *ich*. The infinitive *fotografieren* goes to the end.'
  w6:
    translation: When can we meet?
    why: 'The question word *wann* comes first, then the modal verb *können* and *wir*. *uns* stays before the infinitive *treffen* at the end.'
  w7:
    translation: My daughter wants to be a doctor.
    why: '*meine Tochter* is in position 1 and the modal verb *will* second. The infinitive *werden* goes to the end.'
  w8:
    translation: I'd like to go to Linz tomorrow.
    why: '*ich* is in position 1 and the modal verb *möchte* second. The infinitive *fahren* goes to the end.'
  w9:
    translation: Shall we take the bus?
    why: 'A yes/no question starts with the modal verb *sollen*, then *wir*. The infinitive *nehmen* goes to the end.'
  w10:
    translation: You're not allowed to use your phones in class.
    why: '*im Unterricht* is in position 1, so *dürft* comes second, then *ihr*. *nicht* comes right before the infinitive *benutzen* at the end.'
  w11:
    translation: Would you like something to drink?
    why: 'A yes/no question starts with the modal verb *möchten*, then *Sie*. The infinitive *trinken* goes to the end.'
  w12:
    translation: At the weekend we want to visit friends in Graz.
    why: '*am Wochenende* is in position 1, so *wollen* comes second, then *wir*. The infinitive *besuchen* goes to the end. *in Graz* can stand before or after *Freunde*.'
