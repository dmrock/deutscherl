# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я живу в Зальцбурге.
  e2: Мы вместе учим немецкий.
  e3: Что ты делаешь на выходных?
  e4: Вы очень хорошо играете в теннис.
  e5: Мой дедушка готовит каждое воскресенье.
  e6: Где Вы живёте?
  e7: Сегодня я работаю из дома.
  e8: Мы ждём автобус.
  e9: Как тебе город?
  e10: Вы давно ждёте?
  e11: Моя сестра работает в отеле.
  e12: Дети отвечают очень быстро.
  e13: Опять идёт дождь.
  e14: Супермаркет открывается в восемь.
  e15: Как тебя зовут?
  e16: Ты очень хорошо танцуешь!
  e17: Что ты сейчас делаешь? – Готовлю.
  e18: Он каждое утро пьёт чай.
  e19: Завтра мы идём в гости к бабушке.
  e20: Курс начинается на следующей неделе.

choice:
  c1:
    why: 'С *ich* окончание *-e*: *ich wohne*.'
  c2:
    why: 'С *du* окончание *-st*: *du machst*.'
  c3:
    why: '*Lisa* — это *sie* (один человек), окончание *-t*: *sie spielt*.'
  c4:
    why: 'С *wir* форма совпадает с инфинитивом: *wir lernen*.'
  c5:
    why: 'С *ihr* окончание *-t*: *ihr kocht*. В вопросе без вопросительного слова глагол стоит первым.'
  c6:
    why: 'Основа *arbeit-* заканчивается на *-t*, поэтому перед окончанием появляется лишнее *-e-*: *er arbeitet*.'
  c7:
    why: 'Основа *heiß-* уже заканчивается на звук «с», поэтому с *du* добавляется только *-t*: *du heißt*.'
  c8:
    why: 'Основа *arbeit-* заканчивается на *-t*, поэтому с *du* окончание *-est*: *du arbeitest*. Формы *arbeitst* не бывает.'
  c9:
    why: '*regnen* получает лишнее *-e-*, как глаголы на *-t* и *-d*: *es regnet*.'
  c10:
    why: 'С вежливым *Sie* форма совпадает с инфинитивом: *Sie kommen*.'
  c11:
    why: 'Основа *tanz-* заканчивается на *-z*, поэтому с *du* добавляется только *-t*: *du tanzt*.'
  c12:
    why: '*Paul und Emma* — два человека (*sie*), поэтому форма совпадает с инфинитивом: *gehen*.'
  c13:
    why: '*der Film* — это *er*, окончание *-t*: *er beginnt*.'
  c14:
    why: 'Основа *wart-* заканчивается на *-t*, поэтому с *ihr* окончание *-et*: *ihr wartet*. *wartest* — форма для *du*.'

wordOrder:
  w1:
    translation: Где ты живёшь?
    why: 'Сначала вопросительное слово *wo*, потом глагол *wohnst*, потом подлежащее *du*.'
  w2:
    translation: Завтра мы идём в гости к бабушке.
    why: 'Глагол *besuchen* стоит на втором месте. Первым может стоять *morgen*, *wir* или *unsere Oma*. Настоящее время с *morgen* говорит о будущем.'
  w3:
    translation: Вы любите готовить?
    why: 'Вопрос без вопросительного слова начинается с глагола *kocht*, потом подлежащее *ihr*. *gern* (охотно) значит, что вам это нравится.'
  w4:
    translation: Мой брат работает в Линце.
    why: 'Глагол *arbeitet* стоит на втором месте. *in Linz* тоже может стоять первым; тогда *mein Bruder* встаёт после глагола.'
  w5:
    translation: Как тебя зовут?
    why: 'Сначала вопросительное слово *wie*, потом глагол *heißt*, потом подлежащее *du*.'
  w6:
    translation: Сегодня идёт дождь.
    why: 'Глагол *regnet* стоит на втором месте. *heute* тоже может стоять первым; тогда *es* встаёт после глагола.'
  w7:
    translation: Ты учишь немецкий?
    why: 'Вопрос без вопросительного слова начинается с глагола *lernst*, потом подлежащее *du*.'
  w8:
    translation: Что ты делаешь на выходных?
    why: 'Сначала вопросительное слово *was*, потом глагол *machst*, потом подлежащее *du*. Время *am Wochenende* стоит в конце.'

