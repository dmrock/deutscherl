# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks the verb forms that the page highlights.

examples:
  # Only du and er / sie / es change: one example per cell of the forms table
  - id: e1
    de: 'Ich **fahre** jeden Tag mit dem Rad.'
  - id: e2
    de: 'Wir **essen** heute bei meiner Oma.'
  - id: e3
    de: '**Sprichst** du Englisch?'
  - id: e4
    de: '**Nehmt** ihr den Bus oder die U-Bahn?'
  - id: e5
    de: 'Mein Bruder **schläft** noch.'
  - id: e6
    de: 'Was **lesen** Sie gerade?'
  # e becomes i
  - id: e7
    de: 'Mein Vater **hilft** mir bei den Hausaufgaben.'
  - id: e8
    de: 'Wann **triffst** du deine Freunde?'
  # e becomes ie
  - id: e9
    de: 'Lena **liest** gern Krimis.'
  - id: e10
    de: '**Siehst** du den Bus da vorne?'
  # a becomes ä
  - id: e11
    de: 'Wie lange **schläfst** du am Sonntag?'
  - id: e12
    de: 'Die Wohnung **gefällt** mir sehr.'
  # au becomes äu
  - id: e13
    de: 'Mein Sohn **läuft** sehr schnell.'
  - id: e14
    de: '**Läufst** du jeden Morgen im Park?'
  # Spelling: nehmen
  - id: e15
    de: 'Ich nehme einen Tee. Was **nimmst** du?'
  - id: e16
    de: 'Meine Frau **nimmt** immer den Zug um sieben.'
  # Spelling: stems ending in an s sound
  - id: e17
    de: 'Was **isst** du zum Frühstück?'
  - id: e18
    de: '**Liest** du die Zeitung noch?'
  # Verbs that do not change
  - id: e19
    de: 'Sie **geht** jeden Tag zu Fuß zur Arbeit.'
  - id: e20
    de: 'Er **kauft** am Samstag immer frisches Brot.'

choice:
  # du: the vowel changes
  - id: c1
    text: Du ___ zu schnell! Bitte langsamer.
    answer: fährst
    options: [fährst, fahrst, fährt, fahrt]
  - id: c2
    text: Wie viele Sprachen ___ du?
    answer: sprichst
    options: [sprichst, sprechst, spricht, sprecht]
