        region: AT

wordOrder:
  - id: w1
    parts: [ich, habe, gestern, einen Film, gesehen]
    accept:
      - [gestern, habe, ich, einen Film, gesehen]
      - [einen Film, habe, ich, gestern, gesehen]
    punctuation: '.'
  - id: w2
    parts: [wir, sind, nach Wien, gefahren]
    accept:
      - [nach Wien, sind, wir, gefahren]
    punctuation: '.'
  - id: w3
    parts: [bist, du, gut, nach Hause, gekommen]
    fixed: true
    punctuation: '?'
  - id: w4
    parts: [wann, bist, du, aufgestanden]
    fixed: true
    punctuation: '?'
  - id: w5
    parts: [er, ist, zu Hause, geblieben]
    accept:
      - [zu Hause, ist, er, geblieben]
    punctuation: '.'
  - id: w6
    parts: [die, Kinder, haben, die, Pizza, gegessen]
    accept:
      - [die, Pizza, haben, die, Kinder, gegessen]
    punctuation: '.'

