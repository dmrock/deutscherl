    de: 'Ich **habe** gestern einen Film **gesehen**.'
  - id: e2
    de: 'Wir **sind** am Wochenende nach Graz **gefahren**.'
  - id: e3
    de: 'Ich **bin** heute um sieben Uhr **aufgewacht**.'
  - id: e4
    de: 'Er **ist** den ganzen Tag zu Hause **geblieben**.'
  - id: e5
    de: '**Hast** du gut **geschlafen**?'

choice:
  - id: c1
    text: Ich ___ gestern ins Kino gegangen.
    answer: bin
    options: [bin, habe]
  - id: c2
    text: Wir ___ am Abend Pizza gegessen.
    answer: haben
    options: [sind, haben]
  - id: c3
    text: Anna ___ nach Salzburg gefahren.
    answer: ist
    options: [ist, hat]
  - id: c4
    text: Was ___ ihr am Wochenende gemacht?
    answer: habt
    options: [seid, habt]
  - id: c5
    text: Mein Bruder ___ letztes Jahr Vater geworden.
    answer: ist
    options: [ist, hat]
  - id: c6
    text: Die Kinder ___ sehr lange geschlafen.
    answer: haben
    options: [sind, haben]
  - id: c7
    text: Wann ___ du heute aufgestanden?
    answer: bist
    options: [bist, hast]
  - id: c8
    text: Ich ___ dir eine Nachricht geschrieben.
    answer: habe
    options: [bin, habe]
  - id: c9
    text: Wir ___ den ganzen Tag zu Hause geblieben.
    answer: sind
    options: [sind, haben]
  - id: c10
    text: Wir ___ lange im Café gesessen.
    answer: haben
    options: [haben, sind, hat, ist]
    alsoCorrect:
