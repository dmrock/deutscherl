# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Это телефон моего папы.
  e2: Название улицы очень длинное.
  e3: Чей это ключ?
  e4: Кабинет начальника на третьем этаже.
  e5: Дверь кухни открыта.
  e6: Она дочь врача.
  e7: Я живу в квартире одной подруги.
  e8: Ты знаешь девушку моего брата?
  e9: Машина моих родителей очень старая.
  e10: Сад у дома очень большой.
  e11: Мне нравится цвет машины.
  e12: Брат Анны живёт в Линце.
  e13: Это рюкзак Макса?
  e14: В конце месяца у меня мало денег.
  e15: Рядом с вокзалом есть аптека?
  e16: Это велосипед моего брата.
  e17: Конец фильма был грустный.

choice:
  c1:
    why: '*Bruder* — мужской род, и у существительного есть окончание родительного падежа *-s* (*Bruders*), поэтому нужно *meines*. *meinem* и *meinen* — формы дательного или винительного падежа.'
  c2:
    why: '*die Jacke* — женский род. В родительном падеже у женского рода артикль *der*: *die Farbe der Jacke*. *des* бывает только у мужского и среднего рода.'
  c3:
    why: '*das Geschäft* — средний род, поэтому в родительном падеже *des Geschäfts*: артикль *des*, а к существительному добавляется *-s*.'
  c4:
    why: '*das Jahr* — средний род: *am Anfang des Jahres*. У мужского и среднего рода в родительном падеже артикль *des*.'
  c5:
    why: 'У мужского рода в родительном падеже нужны обе части: *meines* и окончание *-s* у существительного: *meines Chefs*. В *meines Chef* не хватает *-s*.'
  c6:
    why: '*eine Lehrerin* — женский род, поэтому в родительном падеже *einer Lehrerin*. Существительные женского рода окончания не получают.'
  c7:
    why: 'К имени добавляют *-s* без апострофа: *Annas Schwester*. *Anna’s* с апострофом в обычном предложении неправильно.'
  c8:
    why: '*Max* заканчивается на *x*, поэтому в родительном падеже получает только апостроф: *Max’ Zimmer*. Лишнее *-s* не нужно.'
  c9:
    why: '*wessen* спрашивает «чей?» и стоит прямо перед существительным: *Wessen Tasche ist das?* *wer*, *wen* и *wem* так перед существительным не ставят.'
  c10:
    why: '*die Stadt* — женский род, поэтому в родительном падеже артикль *der*: *in der Mitte der Stadt*.'
  c11:
    why: 'После *von* всегда идёт дательный падеж, а не родительный. *der Vater* — мужской род, поэтому в дательном *meinem Vater*.'
  c12:
    why: '*Eltern* — множественное число. Во множественном числе в родительном падеже артикль *der*, поэтому нужно *meiner*: *die Wohnung meiner Eltern*.'
  c13:
    why: '*das Hotel* — средний род, поэтому в родительном падеже *eines Hotels*: комната какого-то отеля. *einer* — для женского рода.'
  c14:
    why: '*die Schwester* — женский род, поэтому притяжательное слово в родительном падеже — *deiner*: *der Freund deiner Schwester*.'

wordOrder:
  w1:
    translation: Собака моей соседки очень шумная.
    why: 'Родительный падеж *meiner Nachbarin* стоит сразу после существительного, к которому относится: *der Hund meiner Nachbarin*. Потом глагол *ist* на втором месте.'
  w2:
    translation: Мы живём рядом с вокзалом.
    why: '*in der Nähe des Bahnhofs* — одно целое: родительный падеж *des Bahnhofs* идёт после *in der Nähe*. Всё это выражение может стоять и первым; тогда *wir* встаёт после глагола.'
  w3:
    translation: Чья это была идея?
    why: '*wessen* стоит прямо перед своим существительным: *wessen Idee*. Вместе они — вопросительное слово на первом месте, а за ними идёт глагол *war*.'
  w4:
    translation: Брат Анны работает в отеле.
    why: 'Имя в родительном падеже стоит перед существительным: *Annas Bruder*. *in einem Hotel* тоже может стоять первым; тогда *Annas Bruder* встаёт после глагола.'
  w5:
    translation: В конце курса мы устраиваем вечеринку.
    why: 'Родительный падеж *des Kurses* идёт после *am Ende*. Всё это выражение стоит на первом месте, поэтому дальше глагол *machen*, а после него подлежащее *wir*.'
  w6:
    translation: Это машина моего дяди.
    why: 'Здесь вместо родительного падежа *von* + дательный: *das Auto von meinem Onkel*. В разговорной речи так говорят очень часто.'
  w7:
    translation: Ты знаешь сестру Ханса?
    why: '*Hans* заканчивается на *s*, поэтому получает только апостроф: *Hans’ Schwester*. Имя стоит перед существительным. В вопросе без вопросительного слова глагол стоит первым.'

