choice:
  c1:
    why: '*der Bruder* — мужской род. В родительном падеже нужны обе части: *meines* и окончание *-s* у существительного: *das Zimmer meines Bruders*. *meinem Bruder* — это дательный падеж.'
  c2:
    why: '*die Jacke* — женский род. В родительном падеже у женского рода артикль *der*: *die Farbe der Jacke*. *des* бывает только у мужского и среднего рода.'
  c3:
    why: '*das Geschäft* — средний род, поэтому в родительном падеже *des Geschäfts*: артикль *des*, а к существительному добавляется *-s*. В *des Geschäft* не хватает *-s*.'
  c4:
    why: '*das Jahr* — средний род, поэтому в родительном падеже *des Jahres*: *am Anfang des Jahres*. Артикль *der* в родительном падеже бывает только у женского рода и во множественном числе.'
  c5:
    why: 'У мужского рода в родительном падеже нужны обе части: *meines* и окончание *-s* у существительного: *meines Chefs*. В *meines Chef* не хватает *-s*.'
  c6:
    why: '*eine Lehrerin* — женский род, поэтому в родительном падеже *einer Lehrerin*. Существительные женского рода окончания не получают.'
  c7:
    why: 'К имени добавляют *-s* без апострофа и без артикля и ставят его перед существительным: *Annas Schwester*. С *von* существительное идёт первым: *die Schwester von Anna*.'
  c8:
    why: '*Max* оканчивается на *x*, поэтому на письме в родительном падеже получает только апостроф: *Max’ Hund*. Лишнее *-s* не нужно.'
  c9:
    why: '*wessen* спрашивает «чей?» и стоит прямо перед существительным: *Wessen Tasche ist das?* *wer*, *wen* и *wem* так перед существительным не ставят.'
  c10:
    why: '*die Stadt* — женский род, поэтому в родительном падеже артикль *der*: *in der Mitte der Stadt*.'
  c11:
    why: 'После *von* всегда идёт дательный падеж, а не родительный. *der Vater* — мужской род, поэтому в дательном *meinem Vater*.'
  c12:
    why: '*Eltern* — множественное число. Во множественном числе в родительном падеже артикль *der*, поэтому нужно *meiner*: *die Wohnung meiner Eltern*.'
  c13:
    why: '*das Hotel* — средний род, поэтому в родительном падеже *eines Hotels*, с *-s* у существительного. *einem Hotel* — это дательный падеж.'
  c14:
    why: '*die Schwester* — женский род, поэтому притяжательное слово в родительном падеже — *deiner*: *der Freund deiner Schwester*.'
  c15:
    why: '*das Haus* — средний род и оканчивается на *-s*, поэтому в родительном падеже окончание *-es*: *die Fenster des Hauses*. В *des Haus* не хватает окончания.'
  c16:
    why: '*der Platz* — мужской род и оканчивается на *-z*, поэтому в родительном падеже окончание *-es*: *auf der anderen Seite des Platzes*.'
  c17:
    why: '*Kinder* — множественное число. Во множественном числе в родительном падеже артикль *der*, а окончания у существительного нет: *die Schule der Kinder*. *-n* в *Kindern* — это дательный падеж.'
  c18:
    why: '*die Chefin* — женский род, поэтому притяжательное слово в родительном падеже — *meiner*, а у существительного нет окончания: *der Mann meiner Chefin*.'
  c19:
    why: '*Klaus* оканчивается на *s*, поэтому на письме получает только апостроф: *Klaus’ Freundin*. Ни *-s*, ни *-es* не нужно.'
  c20:
    why: '*der Kurs* — мужской род и оканчивается на *-s*, поэтому в родительном падеже *des Kurses*: *am Ende des Kurses*.'
  c21:
    why: '*die Wohnung* — женский род, поэтому притяжательное слово в родительном падеже — *unserer*: *in der Nähe unserer Wohnung*.'
  c22:
    why: '*Flüge* — множественное число без артикля, поэтому родительный падеж здесь не виден. Вместо него нужно *von* + дательный падеж, а во множественном числе в дательном добавляется *-n*: *der Preis von Flügen*.'
  c23:
    why: '*der Freund* — мужской род, поэтому в родительном падеже *eines Freundes*: *das Auto eines Freundes*. *einem Freund* — это дательный падеж.'
  c24:
    why: '*das Handy* — средний род, поэтому в родительном падеже *meines Handys*, с *-s* у существительного: *der Akku meines Handys*. *meiner* — для женского рода и множественного числа.'
  c25:
    why: 'После *gehören* идёт дательный падеж, поэтому вопрос — *wem*: *Wem gehört die Jacke?* *wessen* стоит перед существительным: *Wessen Jacke ist das?*'

