# English translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: That's my father's phone.
  e2: The name of the street is very long.
  e3: Whose key is this?
  e4: The boss's office is on the second floor.
  e5: The kitchen door is open.
  e6: She is a doctor's daughter.
  e7: I live in a friend's flat.
  e8: Do you know my brother's girlfriend?
  e9: My parents' car is very old.
  e10: The garden of the house is very big.
  e11: I like the colour of the car.
  e12: Anna's brother lives in Linz.
  e13: Is that Max's backpack?
  e14: At the end of the month I don't have much money.
  e15: Is there a pharmacy near the station?
  e16: That's my brother's bike.
  e17: The end of the film was sad.
  e18: Who does the key belong to?

choice:
  c1:
    why: '*der Bruder* is masculine. In the genitive you need both parts: *meines* and the ending *-s* on the noun: *das Zimmer meines Bruders*. *meinem Bruder* is the dative.'
  c2:
    why: '*die Jacke* is feminine. In the genitive, feminine nouns take *der*: *die Farbe der Jacke*. *des* is only for masculine and neuter nouns.'
  c3:
    why: '*das Geschäft* is neuter, so the genitive is *des Geschäfts*: the article is *des* and the noun adds *-s*. *des Geschäft* is missing the *-s*.'
  c4:
    why: '*das Jahr* is neuter, so the genitive is *des Jahres*: *am Anfang des Jahres*. *der* is the genitive article only for feminine and plural nouns.'
  c5:
    why: 'Masculine nouns need both parts in the genitive: *meines* and the ending *-s* on the noun: *meines Chefs*. *meines Chef* is missing the *-s*.'
  c6:
    why: '*eine Lehrerin* is feminine, so the genitive is *einer Lehrerin*. Feminine nouns get no ending.'
  c7:
    why: 'With a name, add *-s* with no apostrophe and no article, and put the name before the noun: *Annas Schwester*. With *von*, the noun comes first: *die Schwester von Anna*.'
  c8:
    why: '*Max* ends in *x*, so in writing it gets only an apostrophe in the genitive: *Max’ Hund*. No extra *-s*.'
  c9:
    why: '*wessen* asks "whose?" and comes right before the noun: *Wessen Tasche ist das?* *wer*, *wen* and *wem* cannot stand before a noun like this.'
  c10:
    why: '*die Stadt* is feminine, so the genitive article is *der*: *in der Mitte der Stadt*.'
  c11:
    why: '*von* always takes the dative, not the genitive. *der Vater* is masculine, so the dative is *meinem Vater*.'
  c12:
    why: '*Eltern* is plural. In the genitive, plural nouns take *der*, so the possessive is *meiner*: *die Wohnung meiner Eltern*.'
  c13:
    why: '*das Hotel* is neuter, so the genitive is *eines Hotels*, with *-s* on the noun. *einem Hotel* is the dative.'
  c14:
    why: '*die Schwester* is feminine, so the genitive possessive is *deiner*: *der Freund deiner Schwester*.'
  c15:
    why: '*das Haus* is neuter and ends in *-s*, so the genitive ending is *-es*: *die Fenster des Hauses*. *des Haus* is missing the ending.'
  c16:
    why: '*der Platz* is masculine and ends in *-z*, so the genitive ending is *-es*: *auf der anderen Seite des Platzes*.'
  c17:
    why: '*Kinder* is plural. In the genitive, plural nouns take *der* and get no ending: *die Schule der Kinder*. The *-n* in *Kindern* belongs to the dative.'
  c18:
    why: '*die Chefin* is feminine, so the genitive possessive is *meiner*, and the noun gets no ending: *der Mann meiner Chefin*.'
  c19:
    why: '*Klaus* ends in *s*, so in writing it gets only an apostrophe: *Klaus’ Freundin*. No extra *-s* or *-es*.'
  c20:
    why: '*der Kurs* is masculine and ends in *-s*, so the genitive is *des Kurses*: *am Ende des Kurses*.'
  c21:
    why: '*die Wohnung* is feminine, so the genitive possessive is *unserer*: *in der Nähe unserer Wohnung*.'
  c22:
    why: '*Flüge* is a plural with no article, so it cannot show the genitive. Use *von* + dative instead, and the dative plural adds *-n*: *der Preis von Flügen*.'
  c23:
    why: '*der Freund* is masculine, so the genitive is *eines Freundes*: *das Auto eines Freundes*. *einem Freund* is the dative.'
  c24:
    why: '*das Handy* is neuter, so the genitive is *meines Handys*, with *-s* on the noun: *der Akku meines Handys*. *meiner* is for feminine and plural nouns.'
  c25:
    why: '*gehören* takes the dative, so the question word is *wem*: *Wem gehört die Jacke?* *wessen* goes before a noun: *Wessen Jacke ist das?*'

