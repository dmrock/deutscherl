    answer: neuer
    options: [neuer, neue, neuen, neues]
  - id: c8
    text: Ich fahre mit dem ___ Fahrrad zur Arbeit.
    answer: alten
    options: [alten, alte, altes, alter]
  - id: c9
    text: Sie trägt eine ___ Jacke.
    answer: warme
    options: [warme, warmen, warmer, warmes]
  - id: c10
    text: Das ___ Wetter gefällt mir nicht.
    answer: kalte
    options: [kalte, kalten, kaltes, kalter]
  - id: c11
    text: Wir haben leider keine ___ Zimmer mehr.
    answer: freien
    options: [freien, freie, freies, freier]
  - id: c12
    text: Er hilft einer ___ Frau über die Straße.
    answer: alten
    options: [alten, alte, alter, altes]
  - id: c13
    text: Das ist ein sehr ___ Hotel.
    answer: teures
    options: [teures, teuren, teurer, teure]
  - id: c14
    text: Auf dem ___ Berg liegt noch Schnee.
    answer: hohen
    options: [hohen, hochen, hohem, hoher]
  - id: c15
    text: Zum Mittagessen bestelle ich ein ___ Schnitzel.
    answer: Wiener
    options: [Wiener, Wieneres, Wienern]

