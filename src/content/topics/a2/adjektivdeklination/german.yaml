# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks the adjective whose ending the page explains.

examples:
  # No ending after sein, an ending before a noun
  - id: e1
    de: 'Unsere Wohnung ist **neu**.'
  - id: e2
    de: 'Wir haben eine **neue** Wohnung.'
  # After der, die, das
  - id: e3
    de: 'Der **neue** Kollege kommt aus Graz.'
  - id: e4
    de: 'Das **alte** Fahrrad gehört meinem Bruder.'
  - id: e5
    de: 'Wie findest du die **rote** Jacke?'
  - id: e6
    de: 'Siehst du den **kleinen** Hund dort?'
  - id: e7
    de: 'Die **neuen** Schuhe sind sehr bequem.'
  - id: e8
    de: 'Kennst du die Frau mit der **blauen** Brille?'
  # After ein, kein, mein
  - id: e9
    de: 'Das ist ein **guter** Plan.'
  - id: e10
    de: 'Wien ist eine **schöne** Stadt.'
  - id: e11
    de: 'Mein **neues** Handy ist schon kaputt.'
  - id: e12
    de: 'Wir haben ein **kleines** Problem.'
  - id: e13
    de: 'Er trägt einen **schwarzen** Mantel.'
  - id: e14
    de: 'Hast du keinen **warmen** Pullover?'
  - id: e15
    de: 'Meine **alten** Freunde wohnen in Salzburg.'
  - id: e16
    de: 'Wir haben keine **freien** Zimmer mehr.'
  # Dative: always -en
  - id: e17
    de: 'Sie wohnt in einer **kleinen** Wohnung.'
  - id: e18
    de: 'Ich fahre mit meinem **alten** Auto zur Arbeit.'
  # Spelling changes
  - id: e19
    de: 'Das ist ein **teures** Hotel.'
  - id: e20
    de: 'Auf dem **hohen** Berg liegt noch Schnee.'
  - id: e21
    de: 'Sie trägt ein **dunkles** Kleid.'
  # Words without an ending
  - id: e22
    de: 'Ich bestelle ein **Wiener** Schnitzel.'
  - id: e23
    de: 'Wir treffen uns am **Salzburger** Hauptbahnhof.'
  - id: e24
    de: 'Sie hat eine **lila** Tasche.'

choice:
  - id: c1
    text: Der ___ Kollege ist sehr nett.
    answer: neue
    options: [neue, neuen, neuer, neues]
  - id: c2
    text: Ich kaufe einen ___ Tisch.
    answer: neuen
    options: [neuen, neuer, neue, neues]
  - id: c3
    text: Das ist ein ___ Buch.
    answer: gutes
    options: [gutes, guter, gute, guten]
  - id: c4
    text: Wir wohnen in einer ___ Wohnung.
    answer: kleinen
    options: [kleinen, kleine, kleiner, kleines]
  - id: c5
    text: Die ___ Schuhe sind bequem.
    answer: roten
    options: [roten, rote, roter, rotes]
  - id: c6
    text: Hast du einen ___ Regenschirm?
    answer: großen
    options: [großen, großer, große, großes]
  - id: c7
