# English translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Our flat is new.
  e2: We have a new flat.
  e3: The new colleague is from Graz.
  e4: The old bike belongs to my brother.
  e5: What do you think of the red jacket?
  e6: Do you see the little dog over there?
  e7: The new shoes are very comfortable.
  e8: Do you know the woman with the blue glasses?
  e9: That's a good plan.
  e10: Vienna is a beautiful city.
  e11: My new phone is already broken.
  e12: We have a small problem.
  e13: He's wearing a black coat.
  e14: Don't you have a warm jumper?
  e15: My old friends live in Salzburg.
  e16: We have no free rooms left.
  e17: She lives in a small flat.
  e18: I drive to work in my old car.
  e19: That's an expensive hotel.
  e20: There's still snow on the high mountain.
  e21: She's wearing a dark dress.
  e22: I'll have a Wiener schnitzel.
  e23: We're meeting at Salzburg central station.
  e24: She has a purple bag.

choice:
  c1:
    why: '*der Kollege* is masculine and the subject, so it is in the nominative. After *der* in the nominative, the ending is *-e*: *der neue Kollege*.'
  c2:
    why: '*einen* shows the masculine accusative. After *einen*, the ending is *-en*: *einen neuen Tisch*.'
  c3:
    why: '*das Buch* is neuter, and *ein* has no ending, so the adjective shows the neuter with *-es*: *ein gutes Buch*.'
  c4:
    why: '*in einer* is dative. In the dative the adjective always ends in *-en*: *in einer kleinen Wohnung*.'
  c5:
    why: '*Äpfel* is plural. After *die* in the plural, the adjective ends in *-en*: *die roten Äpfel*.'
  c6:
    why: '*die Hose* is feminine and in the accusative. After *die*, the feminine accusative has *-e*, the same as the nominative: *die schwarze Hose*. Only the masculine changes to *-en* in the accusative.'
  c7:
    why: '*der Hund* is masculine and the subject. *mein* has no ending, so the adjective shows the masculine with *-er*: *mein kleiner Hund*.'
  c8:
    why: '*mit* takes the dative, *mit dem*. In the dative the adjective always ends in *-en*: *mit dem alten Fahrrad*.'
  c9:
    why: '*die Jacke* is feminine and in the accusative. After *eine*, the ending is *-e*: *eine warme Jacke*.'
  c10:
    why: '*das Wetter* is neuter and the subject. After *das* in the nominative, the ending is *-e*: *das kalte Wetter*.'
  c11:
    why: '*Eier* is plural. After *keine* in the plural, the adjective ends in *-en*: *keine frischen Eier*.'
  c12:
    why: '*helfen* takes the dative, *einer Frau*. In the dative the adjective always ends in *-en*: *einer alten Frau*.'
  c13:
    why: '*das Handy* is neuter and in the accusative. *kein* has no ending, so the adjective shows the neuter with *-es*. *teuer* loses its *e* before the ending: *kein teures Handy*.'
  c14:
    why: '*in einem* is dative, so the ending is *-en*. *hoch* loses the *c* before an ending: *einem hohen Haus*.'
  c15:
    why: '*vor dem* is dative, but *Wiener* still gets no ending. Adjectives made from city names with *-er* keep the same form in every gender and case: *vor dem Wiener Rathaus*.'
  c16:
    why: '*mit* takes the dative, and *den Nachbarn* is plural. In the dative the adjective always ends in *-en*: *mit den freundlichen Nachbarn*.'
  c17:
    why: '*das Auto* is neuter and in the accusative. *mein* has no ending, so the adjective shows the neuter with *-es*: *mein altes Auto*.'
  c18:
    why: '*der Supermarkt* is masculine and the subject. *ein* has no ending, so the adjective shows the masculine with *-er*: *ein großer Supermarkt*.'
  c19:
    why: '*in einem* is dative. After an article, the dative adjective always ends in *-en*, even though *einem* ends in *-em*: *in einem italienischen Restaurant*.'
  c20:
    why: '*Fotos* is plural. After *meine* in the plural, the adjective ends in *-en*: *meine neuen Fotos*. With an article, the plural ending is always *-en*.'
  c21:
    why: '*die Familie* is feminine and the subject. After *eine*, the ending is *-e*: *eine nette Familie*.'
  c22:
    why: '*einen* shows the masculine accusative, so the ending is *-en*. *dunkel* loses its second *e* before the ending: *einen dunklen Anzug*.'
  c23:
    why: 'After *sein*, the adjective is not before a noun, so it has no ending: *Die Suppe ist heiß.*'
  c24:
    why: '*der Zug* is masculine, and *den* shows the accusative. After *den*, the ending is *-en*: *den nächsten Zug*.'
  c25:
    why: '*das Zimmer* is neuter and in the accusative. After *das*, the ending is *-e*: *das große Zimmer*. After an article, *-es* comes after *ein*, *kein* or a possessive like *mein*.'

