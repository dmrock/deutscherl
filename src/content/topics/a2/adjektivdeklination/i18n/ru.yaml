# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Наша квартира новая.
  e2: У нас новая квартира.
  e3: Новый коллега из Граца.
  e4: Старый велосипед принадлежит моему брату.
  e5: Как тебе красная куртка?
  e6: Видишь вон ту маленькую собаку?
  e7: Новые туфли очень удобные.
  e8: Ты знаешь женщину в синих очках?
  e9: Это хороший план.
  e10: Вена — красивый город.
  e11: Мой новый телефон уже сломался.
  e12: У нас небольшая проблема.
  e13: На нём чёрное пальто.
  e14: У тебя нет тёплого свитера?
  e15: Мои старые друзья живут в Зальцбурге.
  e16: Свободных номеров у нас больше нет.
  e17: Она живёт в маленькой квартире.
  e18: Я езжу на работу на своей старой машине.
  e19: Это дорогой отель.
  e20: На высокой горе ещё лежит снег.
  e21: На ней тёмное платье.
  e22: Мне венский шницель, пожалуйста.
  e23: Встречаемся на центральном вокзале Зальцбурга.
  e24: У неё фиолетовая сумка.

choice:
  c1:
    why: '*der Kollege* — мужской род и подлежащее, то есть именительный падеж. После *der* в именительном падеже окончание *-e*: *der neue Kollege*.'
  c2:
    why: '*einen* показывает мужской род в винительном падеже. После *einen* окончание *-en*: *einen neuen Tisch*.'
  c3:
    why: '*das Buch* — средний род, а у *ein* нет окончания, поэтому средний род показывает окончание прилагательного *-es*: *ein gutes Buch*.'
  c4:
    why: '*in einer* — дательный падеж. В дательном падеже прилагательное всегда оканчивается на *-en*: *in einer kleinen Wohnung*.'
  c5:
    why: '*Schuhe* — множественное число. После *die* во множественном числе прилагательное оканчивается на *-en*: *die roten Schuhe*.'
  c6:
    why: '*einen* показывает мужской род в винительном падеже, поэтому окончание *-en*: *einen großen Regenschirm*.'
  c7:
    why: '*der Nachbar* — мужской род и подлежащее. У *mein* нет окончания, поэтому мужской род показывает окончание прилагательного *-er*: *mein neuer Nachbar*.'
  c8:
    why: 'После *mit* идёт дательный падеж: *mit dem*. В дательном падеже прилагательное всегда оканчивается на *-en*: *mit dem alten Fahrrad*.'
  c9:
    why: '*die Jacke* — женский род в винительном падеже. После *eine* окончание *-e*: *eine warme Jacke*.'
  c10:
    why: '*das Wetter* — средний род и подлежащее. После *das* в именительном падеже окончание *-e*: *das kalte Wetter*.'
  c11:
    why: '*Zimmer* — среднего рода, поэтому *keine* показывает, что здесь множественное число. После *keine* во множественном числе прилагательное оканчивается на *-en*: *keine freien Zimmer*.'
  c12:
    why: 'После *helfen* идёт дательный падеж: *einer Frau*. В дательном падеже прилагательное всегда оканчивается на *-en*: *einer alten Frau*.'
  c13:
    why: '*das Hotel* — средний род, поэтому после *ein* окончание *-es*. *teuer* перед окончанием теряет *e*: *ein teures Hotel*.'
  c14:
    why: '*auf dem* — дательный падеж, поэтому окончание *-en*. *hoch* перед окончанием теряет *c*: *dem hohen Berg*.'
  c15:
    why: 'Прилагательные на *-er* от названий городов никогда не меняются: *ein Wiener Schnitzel*.'

wordOrder:
  w1:
    translation: Я ищу недорогую квартиру.
    why: 'Прилагательное стоит между артиклем и существительным: *eine günstige Wohnung*.'
  w2:
    translation: Это дорогой отель.
    why: 'Прилагательное стоит между *ein* и существительным. *teuer* теряет *e*: *ein teures Hotel*.'
  w3:
    translation: Новые соседи очень милые.
    why: '*die neuen Nachbarn* — подлежащее на первом месте, поэтому дальше идёт глагол *sind*. После *sein* у *nett* нет окончания.'
  w4:
    translation: Мой старый друг живёт в Граце.
    why: '*mein alter Freund* — подлежащее на первом месте, потом глагол *wohnt*. После *mein* в именительном падеже мужского рода прилагательное оканчивается на *-er*.'
  w5:
    translation: Он помогает пожилой женщине.
    why: 'После *helfen* идёт дательный падеж: *einer alten Frau*. Прилагательное стоит между артиклем и существительным.'
  w6:
    translation: У тебя нет тёплого свитера?
    why: 'Вопрос без вопросительного слова начинается с глагола. Потом идут *du* и дополнение *keinen warmen Pullover*.'
  w7:
    translation: Мне венский шницель, пожалуйста.
    why: '*Wiener* стоит перед существительным, как любое прилагательное, но никогда не получает окончания.'

austrianNotes:
  at1: Мне, пожалуйста, холодную колу.
