# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Наша квартира новая.
  e2: У нас новая квартира.
  e3: Новый коллега из Граца.
  e4: Старый велосипед принадлежит моему брату.
  e5: Как тебе красная куртка?
  e6: Видишь вон ту маленькую собаку?
  e7: Новые туфли очень удобные.
  e8: Ты знаешь женщину в синих очках?
  e9: Это хороший план.
  e10: Вена — красивый город.
  e11: Мой новый телефон уже сломался.
  e12: У нас небольшая проблема.
  e13: На нём чёрное пальто.
  e14: У тебя нет тёплого свитера?
  e15: Мои старые друзья живут в Зальцбурге.
  e16: Свободных номеров у нас больше нет.
  e17: Она живёт в маленькой квартире.
  e18: Я езжу на работу на своей старой машине.
  e19: Это дорогой отель.
  e20: На высокой горе ещё лежит снег.
  e21: На ней тёмное платье.
  e22: Мне венский шницель, пожалуйста.
  e23: Встречаемся на центральном вокзале Зальцбурга.
  e24: У неё фиолетовая сумка.

choice:
  c1:
    why: '*der Kollege* — мужской род и подлежащее, то есть именительный падеж. После *der* в именительном падеже окончание *-e*: *der neue Kollege*.'
  c2:
    why: '*einen* показывает мужской род в винительном падеже. После *einen* окончание *-en*: *einen neuen Tisch*.'
  c3:
    why: '*das Buch* — средний род, а у *ein* нет окончания, поэтому средний род показывает окончание прилагательного *-es*: *ein gutes Buch*.'
  c4:
    why: '*in einer* — дательный падеж. В дательном падеже прилагательное всегда оканчивается на *-en*: *in einer kleinen Wohnung*.'
  c5:
    why: '*Äpfel* — множественное число. После *die* во множественном числе прилагательное оканчивается на *-en*: *die roten Äpfel*.'
  c6:
    why: '*die Hose* — женский род в винительном падеже. После *die* у женского рода в винительном падеже окончание *-e*, как и в именительном: *die schwarze Hose*. В винительном падеже на *-en* меняется только мужской род.'
  c7:
    why: '*der Hund* — мужской род и подлежащее. У *mein* нет окончания, поэтому мужской род показывает окончание прилагательного *-er*: *mein kleiner Hund*.'
  c8:
    why: 'После *mit* идёт дательный падеж: *mit dem*. В дательном падеже прилагательное всегда оканчивается на *-en*: *mit dem alten Fahrrad*.'
  c9:
    why: '*die Jacke* — женский род в винительном падеже. После *eine* окончание *-e*: *eine warme Jacke*.'
  c10:
    why: '*das Wetter* — средний род и подлежащее. После *das* в именительном падеже окончание *-e*: *das kalte Wetter*.'
  c11:
    why: '*Eier* — множественное число. После *keine* во множественном числе прилагательное оканчивается на *-en*: *keine frischen Eier*.'
  c12:
    why: 'После *helfen* идёт дательный падеж: *einer Frau*. В дательном падеже прилагательное всегда оканчивается на *-en*: *einer alten Frau*.'
  c13:
    why: '*das Handy* — средний род в винительном падеже. У *kein* нет окончания, поэтому средний род показывает окончание прилагательного *-es*. *teuer* перед окончанием теряет *e*: *kein teures Handy*.'
  c14:
    why: '*in einem* — дательный падеж, поэтому окончание *-en*. *hoch* перед окончанием теряет *c*: *einem hohen Haus*.'
  c15:
    why: '*vor dem* — дательный падеж, но *Wiener* всё равно не получает окончания. Прилагательные на *-er* от названий городов стоят в одной и той же форме в любом роде и падеже: *vor dem Wiener Rathaus*.'
  c16:
    why: 'После *mit* идёт дательный падеж, а *den Nachbarn* — множественное число. В дательном падеже прилагательное всегда оканчивается на *-en*: *mit den freundlichen Nachbarn*.'
  c17:
    why: '*das Auto* — средний род в винительном падеже. У *mein* нет окончания, поэтому средний род показывает окончание прилагательного *-es*: *mein altes Auto*.'
  c18:
    why: '*der Supermarkt* — мужской род и подлежащее. У *ein* нет окончания, поэтому мужской род показывает окончание прилагательного *-er*: *ein großer Supermarkt*.'
  c19:
    why: '*in einem* — дательный падеж. После артикля прилагательное в дательном падеже всегда оканчивается на *-en*, хотя *einem* оканчивается на *-em*: *in einem italienischen Restaurant*.'
  c20:
    why: '*Fotos* — множественное число. После *meine* во множественном числе прилагательное оканчивается на *-en*: *meine neuen Fotos*. С артиклем во множественном числе окончание всегда *-en*.'
  c21:
    why: '*die Familie* — женский род и подлежащее. После *eine* окончание *-e*: *eine nette Familie*.'
  c22:
    why: '*einen* показывает мужской род в винительном падеже, поэтому окончание *-en*. *dunkel* перед окончанием теряет второе *e*: *einen dunklen Anzug*.'
  c23:
    why: 'После *sein* прилагательное стоит не перед существительным, поэтому у него нет окончания: *Die Suppe ist heiß.*'
  c24:
    why: '*der Zug* — мужской род, а *den* показывает винительный падеж. После *den* окончание *-en*: *den nächsten Zug*.'
  c25:
    why: '*das Zimmer* — средний род в винительном падеже. После *das* окончание *-e*: *das große Zimmer*. После артикля *-es* бывает после *ein*, *kein* или притяжательного слова вроде *mein*.'

austrianNotes:
