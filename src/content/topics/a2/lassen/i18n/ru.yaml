# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: На выходные я оставляю ноутбук в офисе.
  e2: Сегодня нам придётся оставить собаку у соседей.
  e3: На выходных родители разрешают мне долго спать.
  e4: Дай я это сделаю!
  e5: Я отдаю брюки в ателье, чтобы их укоротили.
  e6: Нам ремонтируют кухню.
  e7: Мы оставили детей у бабушки с дедушкой.
  e8: Нам отремонтировали кухню.

choice:
  c1:
    why: 'С *du* гласная a меняется на ä: *du lässt*. *lasst* — форма для *ihr*.'
  c2:
    why: 'С *ihr* никакого ä нет: *ihr lasst*. *lässt* — форма для *du* и *er / sie / es*.'
  c3:
    why: 'Значение 2, «разрешать»: начальница позволяет. *Meine Chefin* — это *sie* (один человек), поэтому форма — *lässt*.'
  c4:
    why: 'Значение 3, «поручить»: квартиру красит маляр, а не мы. С *wir* форма — *lassen*.'
  c5:
    why: 'Значение 1, «оставить»: я не беру деньги с собой. С *ich* форма — *lasse*.'
  c6:
    why: 'К Паулю обращаются на «ты» (*du*), поэтому повелительная форма — *lass*. *lasst* — для нескольких человек (*ihr*), а *lässt* — не повелительная форма.'
  c7:
    why: 'Второго глагола нет (значение 1, «оставить»), поэтому в перфекте причастие *gelassen*.'
  c8:
    why: 'Есть второй глагол (*waschen*), поэтому в перфекте в конце остаётся *lassen*: *er hat sein Auto waschen lassen*. *gelassen* бывает только без второго глагола.'
  c9:
    why: 'Окна моет кто-то другой — это значение 3: *lassen* + инфинитив. *machen* так не используют.'
  c10:
    why: 'Значение 1, «оставить»: собака остаётся дома без него. С *er* форма — *lässt*.'
  c11:
    why: 'Вопрос к одному человеку на «ты»: *lässt du …?* В вопросе без вопросительного слова глагол стоит первым.'

wordOrder:
  w1:
    translation: Я отдаю телевизор в ремонт.
    why: '*lasse* стоит на втором месте, второй глагол *reparieren* — в конце. *den Fernseher* тоже может стоять первым; тогда *ich* встаёт после глагола.'
  w2:
    translation: Родители разрешают мне долго спать.
    why: '*lassen* на втором месте, сразу после него *mich* (тот, кому разрешают), а *schlafen* — в конце.'
  w3:
    translation: Дай я это сделаю!
    why: 'Просьба начинается с глагола: *lass*. Второй глагол *machen* — в конце.'
  w4:
    translation: Где ты заказываешь печать фотографий?
    why: 'Сначала вопросительное слово *wo*, потом глагол *lässt*, потом подлежащее *du*. Второй глагол *drucken* — в конце.'
  w5:
    translation: Я оставил паспорт в отеле.
    why: 'Второго глагола нет, поэтому в перфекте в конце стоит *gelassen*, а *habe* — на втором месте. *meinen Pass* и *im Hotel* можно поменять местами, и любое из них может стоять первым.'
  w6:
    translation: Он отдал велосипед в ремонт.
    why: 'Со вторым глаголом перфект заканчивается двумя глаголами: *reparieren lassen* (а не *gelassen*). *hat* — на втором месте.'
  w7:
    translation: Можешь оставить окна открытыми.
    why: 'Когда на втором месте модальный глагол (*kannst*), *lassen* уходит в самый конец. *offen lassen* — «оставить открытым».'

austrianNotes:
  at1: На следующей неделе я отдаю машину на техосмотр.
