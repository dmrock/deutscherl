# English translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: The train is faster than the car.
  e2: My brother is shorter than me.
  e3: Anna is as tall as her mother.
  e4: The weather today isn't as nice as yesterday.
  e5: It's nicest here in spring.
  e6: Which train is the fastest?
  e7: It's hottest in July.
  e8: The way through the park is the shortest.
  e9: My sister is younger than me.
  e10: The nights are longest in winter.
  e11: I prefer tea to coffee.
  e12: The food here is better than at the hotel.
  e13: Who ate the most?
  e14: This jacket is more expensive than the other one.

choice:
  c1:
    why: 'You compare the bike with the bus, so you need the comparative: *langsamer*.'
  c2:
    why: '*als* follows, so you need the comparative. *alt* gets an umlaut: *älter*.'
  c3:
    why: '*als* follows, so you need the comparative. *kalt* gets an umlaut: *kälter*.'
  c4:
    why: 'Both sisters are 1.70 metres tall, so they are equal. For equal things, use the basic form between *so* and *wie*: *so groß wie*.'
  c5:
    why: '*als* follows, so you need the comparative. *groß* gets an umlaut: *größer*.'
  c6:
    why: '*hoch* is irregular: *höher*, *am höchsten*. After *am*, the superlative always ends in *-sten*.'
  c7:
    why: '*gern* is irregular: *lieber*, *am liebsten*. *lieber … als* means "prefer … to". The basic form *gern* cannot go with *als*.'
  c8:
    why: '*gut* is irregular: *besser*, *am besten*. *als* follows, so you need *besser*.'
  c9:
    why: '*viel* is irregular: *mehr*, *am meisten*.'
  c10:
    why: '*heiß* ends in *-ß*, so the superlative adds an extra *e*: *am heißesten*.'
  c11:
    why: '*als* follows, so you need the comparative. *teuer* loses an *e*: *teurer*.'
  c12:
    why: '*als* follows, so you need the comparative. *jung* gets an umlaut: *jünger*.'
  c13:
    why: 'Ten minutes is less than twenty, so by bike you are faster. For things that are not equal, use the comparative and *als*: *schneller als*. German adds *-er* instead of using *mehr* like English "more".'
  c14:
    why: 'After *am*, you need the superlative: *am schönsten*.'
  c15:
    why: '*viel* is irregular: *mehr*, *am meisten*. *als* follows, so you need the comparative *mehr*.'
  c16:
    why: '*hoch* is irregular: it gets an umlaut and loses the *c*: *höher*.'
  c17:
    why: '*voll* gets no umlaut: *voller*, *am vollsten*. Not every short adjective with *o* changes.'
  c18:
    why: '*alt* ends in *-t*, so the superlative adds an extra *e*: *am ältesten*. It also gets an umlaut, as in *älter*.'
  c19:
    why: '*groß* ends in *-ß*, but it is an exception: no extra *e*, only the umlaut: *am größten*.'
  c20:
    why: 'Adjectives that end in *-end* add no extra *e*, although they end in *-d*: *am spannendsten*.'
  c21:
    why: '*gut* is irregular: *besser*, *am besten*.'
  c22:
    why: '*gern* is irregular: *lieber*, *am liebsten*. *Was isst du am liebsten?* means "What do you like eating most?"'
  c23:
    why: '20 degrees is less than 30, so today is not as warm. Use *nicht so* with the basic form and *wie*: *nicht so warm wie*.'
  c24:
    why: 'After *als*, the pronoun is in the same case as the person you compare it with. *sie* is the subject, so you need the nominative *ich*: *größer als ich*.'
  c25:
    why: '*nah* is irregular in the superlative: *am nächsten*.'

