# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Поезд быстрее машины.
  e2: Мой брат ниже меня.
  e3: Анна такого же роста, как её мама.
  e4: Погода сегодня не такая хорошая, как вчера.
  e5: Весной здесь красивее всего.
  e6: Какой поезд едет быстрее всех?
  e7: В июле жарче всего.
  e8: Дорога через парк самая короткая.
  e9: Моя сестра младше меня.
  e10: Зимой ночи самые длинные.
  e11: Я больше люблю чай, чем кофе.
  e12: Еда здесь лучше, чем в отеле.
  e13: Кто съел больше всех?
  e14: Эта куртка дороже, чем та.

choice:
  c1:
    why: 'Ты сравниваешь велосипед с автобусом, поэтому нужна сравнительная степень: *langsamer*.'
  c2:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *alt* получает умлаут: *älter*.'
  c3:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *kalt* получает умлаут: *kälter*.'
  c4:
    why: 'Обе сестры ростом 1,70 метра, то есть они одинаковые. Если вещи одинаковые, начальная форма стоит между *so* и *wie*: *so groß wie*.'
  c5:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *groß* получает умлаут: *größer*.'
  c6:
    why: 'У *hoch* неправильные формы: *höher*, *am höchsten*. После *am* превосходная степень оканчивается на *-en*: *am höchsten*, а не *am höchste*.'
  c7:
    why: 'У *gern* неправильные формы: *lieber*, *am liebsten*. *lieber … als* значит «больше люблю …, чем». Начальная форма *gern* с *als* не сочетается.'
  c8:
    why: 'У *gut* неправильные формы: *besser*, *am besten*. Дальше идёт *als*, поэтому нужно *besser*.'
  c9:
    why: 'У *viel* неправильные формы: *mehr*, *am meisten*.'
  c10:
    why: '*heiß* оканчивается на *-ß*, поэтому в превосходной степени добавляется ещё одно *e*: *am heißesten*.'
  c11:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *teuer* теряет *e*: *teurer*.'
  c12:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *jung* получает умлаут: *jünger*.'
  c13:
    why: 'Десять минут меньше, чем двадцать, значит, на велосипеде быстрее. Если вещи не одинаковые, нужна сравнительная степень и *als*: *schneller als*. *mehr* с начальной формой здесь не подходит: сравнительная степень от *schnell* — *schneller*.'
  c14:
    why: 'После *am* нужна превосходная степень: *am schönsten*.'
  c15:
    why: 'У *viel* неправильные формы: *mehr*, *am meisten*. Дальше идёт *als*, значит, нужна сравнительная степень *mehr*.'
  c16:
    why: 'У *hoch* неправильные формы: появляется умлаут и пропадает *c*: *höher*.'
  c17:
    why: '*voll* не получает умлаут: *voller*, *am vollsten*. Не каждое короткое прилагательное с *o* меняется.'
  c18:
    why: '*alt* оканчивается на *-t*, поэтому в превосходной степени добавляется ещё одно *e*: *am ältesten*. И умлаут тоже появляется, как в *älter*.'
  c19:
    why: '*groß* оканчивается на *-ß*, но это исключение: лишнего *e* нет, только умлаут: *am größten*.'
  c20:
    why: 'Прилагательные на *-end* не получают лишнего *e*, хотя оканчиваются на *-d*: *am spannendsten*.'
  c21:
    why: 'У *gut* неправильные формы: *besser*, *am besten*.'
  c22:
    why: 'У *gern* неправильные формы: *lieber*, *am liebsten*. *Was isst du am liebsten?* значит «Что ты больше всего любишь есть?»'
  c23:
    why: '20 градусов меньше, чем 30, значит, сегодня не так тепло. Нужно *nicht so* с начальной формой и *wie*: *nicht so warm wie*.'
  c24:
    why: 'После *als* местоимение стоит в том же падеже, что и тот, с кем сравниваешь. *sie* — подлежащее, поэтому нужен именительный падеж: *größer als ich*.'
  c25:
    why: 'У *nah* неправильная превосходная степень: *am nächsten*.'

austrianNotes:
  at1: Я больше люблю абрикосы, чем персики.
