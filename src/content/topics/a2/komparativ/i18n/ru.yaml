# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Поезд быстрее машины.
  e2: Мой брат ниже меня.
  e3: Анна такого же роста, как её мама.
  e4: Погода сегодня не такая хорошая, как вчера.
  e5: Весной здесь красивее всего.
  e6: Какой поезд едет быстрее всех?
  e7: В июле жарче всего.
  e8: Дорога через парк самая короткая.
  e9: Моя сестра младше меня.
  e10: Зимой ночи самые длинные.
  e11: Я больше люблю чай, чем кофе.
  e12: Еда здесь лучше, чем в отеле.
  e13: Кто съел больше всех?
  e14: Эта куртка дороже, чем та.

choice:
  c1:
    why: 'Ты сравниваешь велосипед с автобусом, поэтому нужна сравнительная степень: *langsamer*.'
  c2:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *alt* получает умлаут: *älter*.'
  c3:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *kalt* получает умлаут: *kälter*.'
  c4:
    why: 'С *so* и начальной формой *groß* обе одинаковые, поэтому нужно *wie*.'
  c5:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *groß* получает умлаут: *größer*.'
  c6:
    why: 'У *hoch* неправильные формы: *höher*, *am höchsten*.'
  c7:
    why: 'У *gern* неправильные формы: *lieber*, *am liebsten*. *lieber … als* значит «больше люблю …, чем».'
  c8:
    why: 'У *gut* неправильные формы: *besser*, *am besten*. Дальше идёт *als*, поэтому нужно *besser*.'
  c9:
    why: 'У *viel* неправильные формы: *mehr*, *am meisten*.'
  c10:
    why: '*heiß* оканчивается на *-ß*, поэтому в превосходной степени добавляется ещё одно *e*: *am heißesten*.'
  c11:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *teuer* теряет *e*: *teurer*.'
  c12:
    why: 'Дальше идёт *als*, значит, нужна сравнительная степень. *jung* получает умлаут: *jünger*.'
  c13:
    why: 'С *so … wie* всегда нужно *wie*, и с *nicht* тоже: *nicht so groß wie*.'
  c14:
    why: 'После *am* нужна превосходная степень: *am schönsten*.'

wordOrder:
  w1:
    translation: Поезд быстрее машины.
    why: 'Сравнительная степень *schneller* идёт после глагола, потом *als* и то, с чем сравниваешь.'
  w2:
    translation: Я больше люблю чай, чем кофе.
    why: '*lieber* может стоять до или после *Tee*. *als Kaffee* идёт в конце.'
  w3:
    translation: Анна такого же роста, как её мама.
    why: '*so groß* идёт после глагола, потом *wie* и тот, с кем сравниваешь.'
  w4:
    translation: Летом красивее всего.
    why: '*im Sommer* стоит на первом месте, поэтому глагол *ist* идёт вторым, потом *es*. *am schönsten* идёт в конце.'
  w5:
    translation: Какая гора самая высокая?
    why: 'Вопрос начинается с *welcher Berg*, потом глагол *ist*. *am höchsten* идёт в конце.'
  w6:
    translation: Моя сестра младше меня.
    why: 'Сравнительная степень *jünger* идёт после глагола, потом *als ich*.'
  w7:
    translation: Погода сегодня не такая хорошая, как вчера.
    why: '*heute* идёт сразу после глагола. Потом *nicht so schön*, потом *wie gestern*.'
  w8:
    translation: Кто бегает быстрее всех?
    why: 'Вопросительное слово *wer* — подлежащее и стоит первым, потом глагол *läuft* и *am schnellsten*.'

austrianNotes:
  at1: Я больше люблю абрикосы, чем персики.
