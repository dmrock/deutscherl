# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks weil, dass, wenn or denn and the verb that changes with the person.
# In the last section it marks the two verbs around the comma.

examples:
  # weil | denn
  - id: e1
    de: 'Ich bleibe zu Hause, **weil** ich krank **bin**.'
  - id: e2
    de: 'Ich bleibe zu Hause, **denn** ich **bin** krank.'
  # weil as an answer to warum
  - id: e3
    de: 'Warum lernst du Deutsch? – **Weil** ich in Wien **arbeite**.'
  - id: e4
    de: 'Warum kommst du nicht mit? – **Weil** ich keine Zeit **habe**.'
  # dass
  - id: e5
    de: 'Ich glaube, **dass** er heute nicht **kommt**.'
  - id: e6
    de: 'Ich hoffe, **dass** du bald wieder gesund **bist**.'
  # wenn: if
  - id: e7
    de: 'Wir grillen am Sonntag, **wenn** es nicht **regnet**.'
  - id: e8
    de: 'Ich helfe dir gern, **wenn** du Hilfe **brauchst**.'
  # wenn: every time
  - id: e9
    de: 'Ich trinke immer Tee, **wenn** ich krank **bin**.'
  - id: e10
    de: 'Mein Hund bellt, **wenn** es an der Tür **klingelt**.'
  # Two verbs: modal verbs and the Perfekt
  - id: e11
    de: 'Ich lerne jeden Tag, **weil** ich die Prüfung schaffen **will**.'
  - id: e12
    de: 'Ich glaube, **dass** sie schon nach Hause gegangen **ist**.'
  # Two verbs: separable verbs
  - id: e13
    de: 'Ruf mich an, **wenn** du **ankommst**.'
  - id: e14
    de: 'Ich muss jetzt gehen, **weil** mein Zug um sieben Uhr **abfährt**.'
  # The clause first: verb, comma, verb
  - id: e15
    de: 'Weil ich krank **bin**, **bleibe** ich zu Hause.'
  - id: e16
    de: 'Wenn du Zeit **hast**, **gehen** wir einen Kaffee trinken.'

choice:
  - id: c1
    text: Ich glaube, ___.
    answer: dass er morgen kommen kann
    options: [dass er morgen kommen kann, dass er morgen kann kommen, dass er kann morgen kommen, dass kann er morgen kommen]
  - id: c2
    text: Wir gehen spazieren, wenn ___.
    answer: das Wetter schön ist
    options: [das Wetter schön ist, das Wetter ist schön, ist das Wetter schön, schön ist das Wetter]
  - id: c3
    text: Wenn es morgen regnet, ___.
    answer: bleiben wir zu Hause
    options: [bleiben wir zu Hause, wir bleiben zu Hause, wir zu Hause bleiben, zu Hause bleiben wir]
  - id: c4
    text: Weil der Bus nicht kommt, ___.
    answer: gehen wir zu Fuß
    options: [gehen wir zu Fuß, wir gehen zu Fuß, wir zu Fuß gehen, zu Fuß gehen wir]
  - id: c5
    text: Ich bleibe zu Hause, ___ ich krank bin.
    answer: weil
    options: [weil, denn, dass, als]
  - id: c6
    text: Ich bleibe zu Hause, ___ ich bin krank.
    answer: denn
    options: [denn, wenn, dass, weil]
  - id: c7
    text: Ich hoffe, ___ du bald kommst.
    answer: dass
    options: [dass, wenn, weil, denn]
  - id: c8
    text: ___ ich Zeit habe, lese ich gern.
    answer: Wenn
    options: [Wenn, Dass, Denn, Als]
  - id: c9
    text: Sie sagt, ___ der Zug Verspätung hat.
    answer: dass
    options: [dass, denn, weil, als]
  - id: c10
    text: Ich lerne viel, weil ___.
    answer: ich die Prüfung schaffen will
    options: [ich die Prüfung schaffen will, ich will die Prüfung schaffen, ich die Prüfung will schaffen, will ich die Prüfung schaffen]
  - id: c11
    text: Ich weiß, dass ___.
    answer: du viel gearbeitet hast
    options: [du viel gearbeitet hast, du hast viel gearbeitet, du viel hast gearbeitet, hast du viel gearbeitet]
  - id: c12
    text: Sag mir Bescheid, wenn ___.
    answer: der Film anfängt
    options: [der Film anfängt, der Film fängt an, fängt der Film an, der Film an fängt]
  - id: c13
    text: Warum lernst du Deutsch? – ___ ich in Wien arbeite.
    answer: Weil
    options: [Weil, Denn, Dass, Wenn]
  - id: c14
    text: ___ ich klein war, hatte ich einen Hund.
    answer: Als
    options: [Als, Wenn, Dass, Denn]
  - id: c15
    text: ___ ich nächstes Jahr in Wien bin, besuche ich dich.
    answer: Wenn
    options: [Wenn, Als, Dass, Denn]

