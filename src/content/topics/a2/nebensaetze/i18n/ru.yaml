# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я остаюсь дома, потому что болею.
  e2: Я остаюсь дома, так как болею.
  e3: Почему ты учишь немецкий? – Потому что работаю в Вене.
  e4: Почему ты не идёшь с нами? – Потому что у меня нет времени.
  e5: Думаю, он сегодня не придёт.
  e6: Надеюсь, ты скоро поправишься.
  e7: В воскресенье мы жарим шашлыки, если не будет дождя.
  e8: Я с радостью тебе помогу, если тебе нужна помощь.
  e9: Когда я болею, я всегда пью чай.
  e10: Моя собака лает, когда звонят в дверь.
  e11: Я занимаюсь каждый день, потому что хочу сдать экзамен.
  e12: Думаю, она уже ушла домой.
  e13: Позвони мне, когда приедешь.
  e14: Мне пора идти, потому что мой поезд отходит в семь часов.
  e15: Так как я болею, я остаюсь дома.
  e16: Если у тебя есть время, пойдём выпьем кофе.

choice:
  c1:
    why: 'После *dass* глагол, который меняется по лицам, уходит в самый конец, после инфинитива: *dass er morgen kommen kann*. В остальных вариантах *kann* стоит слишком рано.'
  c2:
    why: 'После *wenn* глагол уходит в конец: *wenn das Wetter schön ist*. Он не может остаться на втором месте или стоять сразу после *wenn*.'
  c3:
    why: 'Придаточное с *wenn* занимает первое место, поэтому остальное предложение начинается с глагола: *bleiben wir zu Hause*. В *wir bleiben* глагол оказался бы на третьем месте.'
  c4:
    why: 'Придаточное с *weil* занимает первое место, поэтому дальше идёт глагол *gehen*, потом *wir*. Перед глаголом может стоять только одна часть, и здесь это всё придаточное.'
  c5:
    why: 'Глагол *bin* стоит в конце, значит, нужно *weil*. После *denn* глагол остался бы на втором месте. *als* — для одного события в прошлом.'
  c6:
    why: 'Глагол *bin* стоит на втором месте, значит, нужно *denn*. После *wenn* или *dass* он ушёл бы в конец. В разговоре иногда слышно *weil* с глаголом на втором месте, но в литературном языке после *weil* глагол стоит в конце.'
  c7:
    why: '*hoffen* — глагол мысли и чувства, а то, на что надеются, идёт после *dass*. После *denn* глагол остался бы на втором месте.'
  c8:
    why: 'Это то, что происходит каждый раз, поэтому нужно *wenn*. *als* — для одного события в прошлом, а *ich habe* — настоящее время.'
  c9:
    why: 'То, что она говорит, идёт после *dass*, и глагол *hat* стоит в конце. После *denn* глагол остался бы на втором месте. *weil* называет причину, а здесь придаточное — это то, что она говорит. *als* — для одного события в прошлом.'
  c10:
    why: 'С модальным глаголом в придаточном *will* стоит последним, после инфинитива *schaffen*. После *weil* сначала идёт подлежащее *ich*. В разговоре иногда слышно *weil* с глаголом на втором месте, но в литературном языке после *weil* глагол стоит в конце.'
  c11:
    why: 'В перфекте *hast* стоит последним, после причастия *gearbeitet*.'
  c12:
    why: 'В конце придаточного глагол с отделяемой приставкой снова пишется одним словом: *anfängt*. Приставка не стоит отдельно.'
  c13:
    why: 'Глагол *arbeite* стоит в конце, и ответ называет причину, поэтому нужно *weil*. После *denn* глагол остался бы на втором месте, а *wenn* называет условие, а не причину.'
  c14:
    why: 'Это один период в прошлом (детство), поэтому нужно *als*. *wenn* — для того, что повторяется, или для настоящего и будущего.'
  c15:
    why: 'Это одно событие, но в будущем, поэтому подходит *wenn*. *als* бывает только для прошлого.'

wordOrder:
  w1:
    translation: Я сегодня не приду, потому что у меня нет времени.
    why: 'Придаточное начинается с *weil*, потом подлежащее *ich*. Глагол *habe* уходит в конец.'
  w2:
    translation: Думаю, он сегодня придёт.
    why: 'Придаточное начинается с *dass*, потом *er* и *heute*. Глагол *kommt* уходит в конец.'
  w3:
    translation: Мы пойдём в кино, если завтра будет дождь.
    why: 'Придаточное начинается с *wenn*, потом *es* и *morgen*. Глагол *regnet* уходит в конец.'
  w4:
    translation: Так как идёт дождь, я еду на автобусе.
    why: 'Придаточное с *weil* занимает первое место, поэтому сразу после запятой идёт глагол *nehme*, потом *ich*.'
  w5:
    translation: Здорово, что ты можешь пойти с нами.
    why: 'С модальным глаголом *kannst* стоит последним, после инфинитива *mitkommen*.'
  w6:
    translation: Он говорит, что потерял ключ.
    why: 'В перфекте *hat* стоит последним, после причастия *verloren*.'
  w7:
    translation: Скажи мне, пожалуйста, когда закончишь.
    why: 'Придаточное начинается с *wenn*, потом *du* и *fertig*. Глагол *bist* уходит в конец.'
  w8:
    translation: Когда у меня будет время, я тебя навещу.
    why: 'Придаточное с *wenn* занимает первое место, поэтому сразу после запятой идёт глагол *besuche*, потом *ich* и *dich*.'
  w9:
    translation: Я принесу тебе ключ, когда зайду вечером.
    why: 'Придаточное начинается с *wenn*, потом *ich* и *heute Abend*. В конце придаточного глагол с отделяемой приставкой пишется одним словом: *vorbeikomme*.'
  w10:
    translation: Надеюсь, мы скоро сможем увидеться.
    why: 'После *dass* модальный глагол *können* стоит последним, после инфинитива *sehen*. *uns* идёт сразу после подлежащего *wir*.'

austrianNotes:
  at1: Я сегодня остаюсь дома, потому что у меня простуда.
