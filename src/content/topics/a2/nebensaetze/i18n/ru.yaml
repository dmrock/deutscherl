# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я остаюсь дома, потому что болею.
  e2: Я остаюсь дома, так как болею.
  e3: Почему ты учишь немецкий? – Потому что работаю в Вене.
  e4: Почему ты не идёшь с нами? – Потому что у меня нет времени.
  e5: Думаю, он сегодня не придёт.
  e6: Надеюсь, ты скоро поправишься.
  e7: В воскресенье мы жарим шашлыки, если не будет дождя.
  e8: Я с радостью тебе помогу, если тебе нужна помощь.
  e9: Когда я болею, я всегда пью чай.
  e10: Моя собака лает, когда звонят в дверь.
  e11: Я занимаюсь каждый день, потому что хочу сдать экзамен.
  e12: Думаю, она уже ушла домой.
  e13: Позвони мне, когда приедешь.
  e14: Мне пора идти, потому что мой поезд отходит в семь часов.
  e15: Так как я болею, я остаюсь дома.
  e16: Если у тебя есть время, пойдём выпьем кофе.

choice:
  c1:
    why: 'После *dass* глагол уходит в конец: *dass er recht hat*.'
  c2:
    why: 'После *wenn* глагол уходит в конец: *wenn das Wetter schön ist*.'
  c3:
    why: 'Придаточное с *wenn* занимает первое место, поэтому остальное предложение начинается с глагола: *besuche ich dich*.'
  c4:
    why: 'Придаточное с *weil* занимает первое место, поэтому дальше идёт глагол *nehme*, потом *ich*.'
  c5:
    why: 'Глагол *bin* стоит в конце, значит, нужно *weil*. После *denn* глагол остался бы на втором месте.'
  c6:
    why: 'Глагол *bin* стоит на втором месте, значит, нужно *denn*. После *weil*, *wenn* или *dass* он ушёл бы в конец.'
  c7:
    why: '*hoffen* — глагол мысли и чувства, а то, на что надеются, идёт после *dass*.'
  c8:
    why: 'Это условие или то, что происходит каждый раз, поэтому нужно *wenn*.'
  c9:
    why: 'То, что она говорит, идёт после *dass*. Глагол *hat* стоит в конце.'
  c10:
    why: 'С модальным глаголом в придаточном *will* стоит последним, после инфинитива *schaffen*.'
  c11:
    why: 'В Perfekt *ist* стоит последним, после причастия *gegangen*.'
  c12:
    why: 'В конце придаточного глагол с отделяемой приставкой снова пишется одним словом: *ankommst*.'
  c13:
    why: 'Глагол *arbeite* стоит в конце, и ответ называет причину, поэтому нужно *weil*.'

wordOrder:
  w1:
    translation: Я сегодня не приду, потому что у меня нет времени.
    why: 'Придаточное начинается с *weil*, потом подлежащее *ich*. Глагол *habe* уходит в конец.'
  w2:
    translation: Думаю, он сегодня придёт.
    why: 'Придаточное начинается с *dass*, потом *er* и *heute*. Глагол *kommt* уходит в конец.'
  w3:
    translation: Мы пойдём в кино, если завтра будет дождь.
    why: 'Придаточное начинается с *wenn*, потом *es* и *morgen*. Глагол *regnet* уходит в конец.'
  w4:
    translation: Так как идёт дождь, я еду на автобусе.
    why: 'Придаточное с *weil* занимает первое место, поэтому сразу после запятой идёт глагол *nehme*, потом *ich*.'
  w5:
    translation: Здорово, что ты можешь пойти с нами.
    why: 'С модальным глаголом *kannst* стоит последним, после инфинитива *mitkommen*.'
  w6:
    translation: Он говорит, что потерял ключ.
    why: 'В Perfekt *hat* стоит последним, после причастия *verloren*.'
  w7:
    translation: Скажи мне, пожалуйста, когда закончишь.
    why: 'Придаточное начинается с *wenn*, потом *du* и *fertig*. Глагол *bist* уходит в конец.'
  w8:
    translation: Когда у меня будет время, я тебя навещу.
    why: 'Придаточное с *wenn* занимает первое место, поэтому сразу после запятой идёт глагол *besuche*, потом *ich* и *dich*.'

