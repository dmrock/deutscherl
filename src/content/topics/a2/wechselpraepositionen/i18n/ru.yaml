# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Я на кухне.
  e2: Я иду на кухню.
  e3: Кошка спит под кроватью.
  e4: Кошка забегает под кровать.
  e5: Он сидит рядом со мной.
  e6: Садись рядом со мной!
  e7: Такси ждёт перед отелем.
  e8: Такси подъезжает к отелю.
  e9: Сегодня вечером мы идём в кино.
  e10: Мы встречаемся на вокзале.
  e11: Я ставлю бутылку в холодильник.
  e12: Бутылка стоит в холодильнике.
  e13: Я кладу телефон на стол.
  e14: Телефон лежит на столе.
  e15: Я сажусь на диван.
  e16: Я сижу на диване.
  e17: Я вешаю куртку на крючок.
  e18: Куртка висит на крючке.

choice:
  c1:
    why: 'Книга где-то лежит (*Wo?*), поэтому после *auf* нужен дательный. *Tisch* мужского рода: *dem Tisch*.'
  c2:
    why: 'Ты кладёшь книгу куда-то (*Wohin?*), поэтому после *auf* нужен винительный. *Tisch* мужского рода: *den Tisch*.'
  c3:
    why: 'Ты ставишь молоко куда-то (*Wohin?*): винительный. *Kühlschrank* мужского рода: *in den*.'
  c4:
    why: 'Молоко где-то стоит (*Wo?*): дательный. *in dem* превращается в *im*.'
  c5:
    why: 'Картина где-то висит (*Wo?*): дательный. *Wand* женского рода: *an der Wand*.'
  c6:
    why: 'Ты вешаешь картину куда-то (*Wohin?*): винительный. *Wand* женского рода: *an die Wand*.'
  c7:
    why: 'Сесть — это движение к месту (*Wohin?*), поэтому после *neben* нужен винительный: *mich*.'
  c8:
    why: 'Он где-то сидит (*Wo?*), поэтому после *neben* нужен дательный: *mir*.'
  c9:
    why: 'Ты ставишь сумку куда-то, поэтому нужно *stellen*. *stehen* значит, что что-то где-то стоит.'
  c10:
    why: 'Ключи где-то лежат, поэтому нужно *liegen*. *legen* значит «класть».'
  c11:
    why: 'Ты идёшь куда-то (*Wohin?*): винительный. *in das* превращается в *ins*.'
  c12:
    why: 'Кошка где-то спит (*Wo?*): дательный. *Sofa* среднего рода: *dem Sofa*.'
  c13:
    why: 'Кафе где-то находится (*Wo?*), поэтому после *zwischen* нужен дательный. *Bank* женского рода: *der Bank*.'

wordOrder:
  w1:
    translation: Телефон лежит на столе.
    why: 'Глагол *liegt* стоит вторым. *auf dem Tisch* может стоять и первым, тогда *das Handy* идёт после глагола.'
  w2:
    translation: Бутылка стоит в холодильнике.
    why: 'Глагол *steht* стоит вторым. *im Kühlschrank* может стоять и первым.'
  w3:
    translation: Куда ты идёшь?
    why: 'Первым стоит вопросительное слово *wohin*, потом глагол *gehst* и *du*.'
  w4:
    translation: Поставь, пожалуйста, молоко в холодильник!
    why: 'Просьба начинается с глагола *stell*. *bitte* может стоять до или после *die Milch*.'
  w5:
    translation: Мы встречаемся на вокзале.
    why: 'Глагол *treffen* стоит вторым, а *uns* — сразу после подлежащего. *am Bahnhof* может стоять и первым.'
  w6:
    translation: Дети сидят на диване.
    why: 'Глагол *sitzen* стоит вторым. *auf dem Sofa* может стоять и первым.'
  w7:
    translation: Где висит моя куртка?
    why: 'Первым стоит вопросительное слово *wo*, потом глагол *hängt* и подлежащее *meine Jacke*.'
  w8:
    translation: Садись рядом со мной!
    why: 'Просьба начинается с глагола *setz*, потом *dich*, потом *neben mich*.'

austrianNotes:
  at1: Дети сидят на лестнице.
