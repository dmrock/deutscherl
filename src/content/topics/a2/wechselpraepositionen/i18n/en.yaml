# English translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: I'm in the kitchen.
  e2: I'm going into the kitchen.
  e3: The cat is sleeping under the bed.
  e4: The cat runs under the bed.
  e5: He's sitting next to me.
  e6: Sit down next to me!
  e7: The car is parked in front of the garage.
  e8: I park the car in front of the garage.
  e9: We're going to the cinema tonight.
  e10: We're meeting at the station.
  e11: I put the bottle in the fridge.
  e12: The bottle is in the fridge.
  e13: I put the phone on the table.
  e14: The phone is on the table.
  e15: I sit down on the sofa.
  e16: I'm sitting on the sofa.
  e17: I hang the jacket on the hook.
  e18: The jacket is hanging on the hook.

choice:
  c1:
    why: 'The book is somewhere (*Wo?*), so *auf* takes the dative. *Tisch* is masculine: *dem Tisch*.'
  c2:
    why: 'You put the book somewhere (*Wohin?*), so *auf* takes the accusative. *Tisch* is masculine: *den Tisch*.'
  c3:
    why: 'You put the milk somewhere (*Wohin?*): accusative. *Kühlschrank* is masculine: *in den Kühlschrank*. *im* is the dative.'
  c4:
    why: 'The milk is somewhere (*Wo?*): dative. *Kühlschrank* is masculine, and *in dem* becomes *im*.'
  c5:
    why: 'The picture is somewhere (*Wo?*): dative. *Wand* is feminine: *an der Wand*.'
  c6:
    why: 'You put the picture somewhere (*Wohin?*): accusative. *Wand* is feminine: *an die Wand*.'
  c7:
    why: 'Sitting down is a movement to a place (*Wohin?*), so *neben* takes the accusative. *Schwester* is feminine: *neben meine Schwester*.'
  c8:
    why: 'He is somewhere (*Wo?*), so *neben* takes the dative. *Bruder* is masculine: *neben meinem Bruder*.'
  c9:
    why: 'You put the bag somewhere, so you need *stellen*. *stehen*, *sitzen* and *liegen* say where something is, and they take no object.'
  c10:
    why: 'The keys are somewhere, so you need *liegen*. *legen*, *stellen* and *setzen* mean that you put something somewhere.'
  c11:
    why: 'You go somewhere (*Wohin?*): accusative. *Theater* is neuter, and *in das* becomes *ins*.'
  c12:
    why: 'The cat is somewhere (*Wo?*): dative. *Sofa* is neuter: *dem Sofa*.'
  c13:
    why: 'The café is somewhere (*Wo?*), so *neben* takes the dative. *Bank* is feminine: *neben der Bank*.'
  c14:
    why: 'The lamp is somewhere (*Wo?*), so *über* takes the dative. *Tisch* is masculine: *über dem Tisch*.'
  c15:
    why: 'You put the bike somewhere (*Wohin?*), so *vor* takes the accusative. *Haus* is neuter: *vor das Haus*.'
  c16:
    why: 'You go somewhere (*Wohin?*): accusative. *Berge* is plural: *in die Berge*.'
  c17:
    why: 'The letter was somewhere (*Wo?*), so *zwischen* takes the dative. In the dative plural, the article is *den* and the noun adds *-n*: *zwischen den Büchern*.'
  c18:
    why: 'The car park is somewhere (*Wo?*), so *hinter* takes the dative. *Schule* is feminine: *hinter der Schule*.'
  c19:
    why: 'You put the clock somewhere (*Wohin?*), so *über* takes the accusative. *Tür* is feminine: *über die Tür*.'
  c20:
    why: 'You go somewhere (*Wohin?*): accusative. *Meer* is neuter, and *an das* becomes *ans*.'
  c21:
    why: 'You are somewhere (*Wo?*): dative. *Fenster* is neuter, and *an dem* becomes *am*.'
  c22:
    why: 'Sitting down is a movement to a place (*Wohin?*), so *auf* takes the accusative. *Bank* is feminine: *auf die Bank*.'
  c23:
    why: 'The children are at the table (*Wo?*), so you need *sitzen*. *setzen*, *stellen* and *legen* mean that you put something somewhere.'
  c24:
    why: 'You are waiting somewhere (*Wo?*), so *vor* takes the dative. *Kino* is neuter: *vor dem Kino*.'
  c25:
    why: 'You put the bag somewhere (*Wohin?*), so *unter* takes the accusative. *Tisch* is masculine: *unter den Tisch*.'

