choice:
  c1:
    why: 'Для *er* Konjunktiv I — это основа + *-e*: *er habe*. *habest* — для *du*, *haben* — для *wir* и *sie*, *habet* — для *ihr*.'
  c2:
    why: '*ihr Bruder* — один человек (*er*), поэтому форма — *wohne*. *wohnest* — для *du*, *wohnen* — для множественного числа, *wohnet* — для *ihr*.'
  c3:
    why: 'В Konjunktiv I гласная остаётся как в инфинитиве: *er fahre*, без умлаута. *fahrest* — для *du*, *fahren* — для множественного числа, *fahret* — для *ihr*.'
  c4:
    why: 'Форма для *ich* — основа + *-e*: *ich müsse*. Она отличается от настоящего времени *ich muss*. *müssest* — для *du*, *müssen* — для множественного числа, *müsset* — для *ihr*.'
  c5:
    why: '*die Kinder* — множественное число, поэтому форма *sein* — *seien*.'
  c6:
    why: 'Для *du* Konjunktiv I от *sein* — *seist* (или *seiest*).'
  c7:
    why: '*die Straße* — один предмет (*sie*, единственное число), поэтому форма — *sei*.'
  c8:
    why: '*ihre Kinder* — множественное число. В Konjunktiv I *sie haben* совпадает с настоящим временем, поэтому бери Konjunktiv II: *sie hätten*. *hätte* и *habe* — формы единственного числа, *habest* — для *du*.'
  c9:
    why: '*die Spieler* — множественное число. *sie können* совпадает с настоящим временем, поэтому бери Konjunktiv II: *sie könnten*. *könne* и *könnte* — формы единственного числа, *könnest* — для *du*.'
  c10:
    why: '*sein* образует перфект с *sein*, поэтому в прошлом — *er sei gewesen*. *ihr Bruder* — один человек, значит, не *seien*.'
  c11:
    why: '*verpassen* образует перфект с *haben*, поэтому в прошлом — *er habe verpasst*.'
  c12:
    why: 'Прошлое — это *habe* + причастие прошедшего времени: *er habe geschrieben*.'
  c13:
    why: 'Для будущего бери *werde* + инфинитив. *die Firma* — единственное число (*sie*), поэтому форма — *werde*. *werdest* и *würdest* — для *du*, *werdet* — для *ihr*.'
  c14:
    why: 'Пересказанный вопрос без вопросительного слова начинается с *ob* (ли). *dass* вопрос не вводит.'
  c15:
    why: 'После вопросительного слова глагол уходит в конец, а глагол с отделяемой приставкой не разделяется: *wann der Zug ankomme*. *ankommen* — это инфинитив.'
  c16:
    why: 'Пересказанный приказ или совет — это *solle* + инфинитив. Для *ich* форма — *solle*, а не *soll* из настоящего времени.'

wordOrder:
  w1:
    translation: Она говорит, что устала.
    why: 'Без *dass* пересказ — обычное утвердительное предложение: глагол *sei* стоит на втором месте. Для выделения первым может стоять *müde*, тогда *sie* встаёт после глагола.'
  w2:
    translation: Она говорит, что устала.
    why: 'После *dass* глагол *sei* уходит в конец.'
  w3:
    translation: Он говорит, что опоздал на поезд.
    why: '*habe* стоит на втором месте, причастие *verpasst* — в конце. Первым может стоять и *den Zug*, тогда *er* встаёт после глагола.'
  w4:
    translation: Она спрашивает, открыт ли сегодня музей.
    why: 'После *ob* глагол *sei* уходит в конец. *heute* может стоять до или после *das Museum*.'
  w5:
    translation: Он хотел знать, когда прибудет поезд.
    why: 'После вопросительного слова *wann* глагол уходит в конец. Глагол *ankommen* не разделяется: *ankomme*.'
  w6:
    translation: Врач говорит, что мне нужно пить больше воды.
    why: '*solle* стоит на втором месте, инфинитив *trinken* — в конце. Первым может стоять и *mehr Wasser*, тогда *ich* встаёт после глагола.'
  w7:
    translation: Фирма сообщает, что наймёт новых сотрудников.
    why: '*werde* стоит на втором месте, инфинитив *einstellen* — в конце. Первым может стоять и *neue Mitarbeiter*, тогда *sie* встаёт после глагола.'

