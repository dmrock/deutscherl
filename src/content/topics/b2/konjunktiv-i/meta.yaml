  - title: 'grammis (IDS Mannheim), Fragen: Konjunktiv Präsens in reported speech (er komme, er sei unterwegs gewesen; indicative more frequent in speech; Konjunktiv Präsens can sound formal in informal contexts; reported speech as a dass-clause or a main clause)'
