  - title: 'grammis (IDS Mannheim), Fragen: forms in reported speech (Konjunktiv Präsens where it is clearly recognizable: sei, habe, müsse, solle; otherwise Konjunktiv Präteritum; würde forms mostly avoided in writing)'
    url: https://grammis.ids-mannheim.de/fragen/3548
  - title: 'Wikipedia: Konjunktiv im Deutschen (formation from the infinitive stem; sein without ending in 1st and 3rd person; 1st and 3rd person plural equal the indicative except seien; Konjunktiv II as replacement, würde when that is ambiguous too; past with sei/habe + participle, future with werde; mainly written language)'
    url: https://de.wikipedia.org/wiki/Konjunktiv_im_Deutschen
  - title: 'Duden, Korrektes Deutsch kurz gefasst (Dudenverlag), Konjunktiv: Konjunktiv I from the present stem (er geht, er gehe; er trage); indirect speech in Konjunktiv I in writing, often indicative in speech, fine after dass or a question word; Konjunktiv II when the Konjunktiv I equals the indicative (hätten); Konjunktiv II also as a mere replacement because the Konjunktiv I feels formal (er wüsste statt wisse); würde forms not wrong but stylistically weaker'
