# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Завтра я еду в Грац.
  e2: С завтрашнего дня буду больше заниматься спортом.
  e3: Я позвоню тебе завтра.
  e4: Мы будем вовремя.
  e5: Тебе очень понравится этот город.
  e6: Вы точно сдадите экзамен.
  e7: Сегодня ночью пойдёт снег.
  e8: Цены будут расти дальше.
  e9: Ты скажешь ей правду?
  e10: Чем ты будешь заниматься после учёбы?
  e11: Я уверен, что она получит эту работу.
  e12: Он говорит, что позвонит позже.
  e13: С этого момента буду пить меньше кофе.
  e14: Не волнуйся, я никому не скажу.
  e15: Это не сработает.
  e16: Скоро большинство машин будет ездить на электричестве.
  e17: Где Пауль? – Наверное, ещё в офисе.
  e18: Уже одиннадцать. Дети наверняка уже спят.
  e19: Сейчас ты уберёшь свою комнату!
  e20: Вы сейчас же пойдёте спать!
  e21: Моя сестра станет врачом.
  e22: Моя сестра будет работать в Вене.

choice:
  c1:
    why: 'С *ich* форма *werden* — *werde*: *ich werde anrufen*.'
  c2:
    why: 'С *du* форма — *wirst*. В вопросе без вопросительного слова она стоит первой, а инфинитив *helfen* остаётся в конце.'
  c3:
    why: 'С *es* форма — *wird*: *es wird schneien*. Первым стоит слово *morgen*, поэтому *es* встаёт после глагола.'
  c4:
    why: 'С *ihr* форма — *werdet*: *ihr werdet schaffen*. *werden* — это форма для *wir* и *sie*.'
  c5:
    why: '*Meine Eltern* — множественное число (*sie*), поэтому форма — *werden*.'
  c6:
    why: 'С *ihr* форма — *werdet*. После вопросительного слова *was* глагол стоит вторым, а *machen* — в конце.'
  c7:
    why: 'В Futur I в конце нужен инфинитив: *er wird kommen*. *gekommen* — причастие для перфекта, а *kommt* и *kam* — не инфинитивы.'
  c8:
    why: 'В конце стоит инфинитив, и глагол с отделяемой приставкой не разделяется: *ich werde zurückgeben*. *zurückgegeben* — причастие.'
  c9:
    why: 'После *dass* форма *werden* уходит в самый конец, после инфинитива: *dass Anna die Stelle bekommen wird*. *Anna* — один человек, поэтому *wird*, а не *werden*.'
  c10:
    why: 'Перед *wirst* в конце придаточного стоит инфинитив: *dass du die Stadt lieben wirst*. *geliebt* — причастие.'
  c11:
    why: 'Догадка о настоящем: *er wird wohl liegen* (он, наверное, лежит в кровати). С *er* форма — *wird*, а *werden* — это форма для *wir* и *sie*.'
  c12:
    why: 'Строгое требование к *du*, поэтому форма — *wirst*: *du wirst weglegen*.'

wordOrder:
  w1:
    translation: Я позвоню тебе завтра.
    why: '*werde* стоит на втором месте, инфинитив *anrufen* — в конце. Первым может стоять и *morgen*; тогда *ich* встаёт после глагола.'
  w2:
    translation: Ты мне поможешь?
    why: 'Вопрос без вопросительного слова начинается с *wirst*, потом подлежащее *du*. Инфинитив *helfen* — в конце.'
  w3:
    translation: Что вы будете делать на выходных?
    why: 'Сначала вопросительное слово *was*, потом *werdet*, потом подлежащее *ihr*. Инфинитив *machen* — в конце.'
  w4:
    translation: Завтра пойдёт снег.
    why: '*wird* стоит на втором месте, *schneien* — в конце. Первым может стоять *morgen* или *es*.'
  w5:
    translation: Я думаю, что Анна получит эту работу.
    why: 'После *dass* глаголы уходят в конец: сначала инфинитив *bekommen*, потом *wird* — самым последним словом.'
  w6:
    translation: Он, наверное, в офисе.
    why: 'Догадка о настоящем. *wird* стоит на втором месте, *sein* — в конце, *wohl* — после подлежащего. *im Büro* тоже может стоять первым; тогда *er* встаёт после глагола.'
  w7:
    translation: Сейчас ты всё уберёшь!
    why: 'Строгое требование. *wirst* стоит на втором месте, *aufräumen* — в конце. Первым может стоять и *jetzt*; тогда *du* встаёт после глагола.'
  w8:
    translation: Он говорит, что позвонит позже.
    why: 'После *dass* в конец уходят инфинитив *anrufen* и потом *wird*. Глагол с отделяемой приставкой *anrufen* не разделяется.'

austrianNotes:
  at1: Ты точно сдашь выпускные экзамены (Matura)!
