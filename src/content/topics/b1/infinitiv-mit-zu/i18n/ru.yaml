# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Мне сегодня не хочется готовить.
  e2: Мы решили пожениться в следующем году.
  e3: Я стараюсь учить каждый день десять новых слов.
  e4: Летом мы собираемся поехать в Хорватию.
  e5: Найдётся у тебя завтра время помочь мне с переездом?
  e6: Он боится выступать перед большим количеством людей.
  e7: Важно пить достаточно воды.
  e8: Найти квартиру в Вене совсем не так просто.
  e9: Не забудь позвонить маме.
  e10: Хочешь в субботу пойти вместе?
  e11: Я хочу больше заниматься спортом.
  e12: Я собираюсь больше заниматься спортом.
  e13: Надеюсь скоро снова тебя увидеть.
  e14: Надеюсь, что вы хорошо доберётесь до дома.
  e15: Прошу тебя закрыть окно.
  e16: Врач посоветовал мне больше спать.
  e17: Она говорит, что придёт позже.
  e18: Я учу немецкий, чтобы учиться в Австрии.
  e19: Я каждый день езжу на велосипеде, чтобы оставаться в форме.
  e20: Я говорю медленно, чтобы все меня понимали.
  e21: Я дам тебе свой номер, чтобы ты мог мне позвонить.

choice:
  c1:
    why: 'После *Lust haben* инфинитив идёт с *zu*, и *zu* стоит прямо перед ним: *zu kochen*. Инфинитивная часть никогда не получает форму, которая меняется по лицам, как *koche*.'
  c2:
    why: 'После модального глагола, например *müssen*, инфинитив идёт без *zu*: *ich muss aufstehen*.'
  c3:
    why: '*ausmachen* — глагол с отделяемой приставкой, поэтому *zu* встаёт между *aus* и *machen*, и всё пишется одним словом: *auszumachen*.'
  c4:
    why: '*abholen* — глагол с отделяемой приставкой, поэтому *zu* стоит в середине, одним словом: *abzuholen*. После *Zeit haben* инфинитиву нужно *zu*.'
  c5:
    why: 'После *vorhaben* инфинитив идёт с *zu*, и *zu* стоит прямо перед ним: *zu fahren*.'
  c6:
    why: 'После модального глагола *können* инфинитив идёт без *zu*: *ich kann nicht kommen*.'
  c7:
    why: 'После *es ist* + прилагательное инфинитив идёт с *zu*: *es ist nicht leicht, eine Wohnung zu finden*.'
  c8:
    why: 'После *erlauben* действие выполняет тот, кому разрешили (*mir*), и инфинитив идёт с *zu*: *früher zu gehen*.'
  c9:
    why: 'Приходит *du*, а надеется *ich*, это разные люди. Поэтому нужно придаточное с *dass*, своим подлежащим и глаголом в конце. У инфинитивной части нет подлежащего.'
  c10:
    why: '*um … zu* говорит, для чего что-то делается, и учит язык тот же человек, который будет работать. *damit* и *weil* открывают придаточное со своим подлежащим и глаголом, а *für* не сочетается с инфинитивом.'
  c11:
    why: 'Объясняет *ich*, а понимает *du*, поэтому нужно *damit* со своим подлежащим и глаголом в конце. *um* идёт с *zu* + инфинитив, а после *denn* глагол стоял бы на втором месте.'
  c12:
    why: '*um* открывает инфинитивную часть, а *zu* + инфинитив её закрывает: *um Milch zu kaufen*. *damit* не сочетается с *zu* + инфинитив.'
  c13:
    why: '*um … zu* с глаголом *ankommen*, у которого отделяемая приставка: *zu* стоит в середине, одним словом: *anzukommen*.'
  c14:
    why: 'После модального глагола *sollen* инфинитив идёт без *zu*, а глагол с отделяемой приставкой в конце остаётся одним словом: *anfangen*.'
  c15:
    why: 'После *lassen* инфинитив идёт без *zu*: *ich lasse mein Auto reparieren* (я отдаю машину в ремонт).'
  c16:
    why: 'Будущее время: *werden* + инфинитив без *zu*: *ich werde dir helfen*.'
  c17:
    why: '*es macht Spaß* работает как *es ist* + прилагательное: инфинитив идёт с *zu*, прямо перед ним: *zu arbeiten*.'
  c18:
    why: 'У *besuchen* приставка не отделяется, поэтому *zu* стоит впереди: *zu besuchen*. *zu* в середине бывает только у глаголов с отделяемой приставкой.'
  c19:
    why: 'Вернулся *du*, а в главном предложении *du* нет. Поэтому нужно придаточное с *dass*: *es ist schön, dass du wieder da bist*. *um* и *damit* говорят, для чего что-то делается, а после *denn* глагол стоял бы на втором месте.'
  c20:
    why: 'Убегает собака, а не говорящий. Поэтому нужно придаточное с *dass*, своим подлежащим и глаголом в конце: *dass mein Hund wegläuft*.'

wordOrder:
  w1:
    translation: Мне не хочется работать в воскресенье.
    why: 'После *Lust haben* инфинитивная часть идёт после запятой: сначала *am Sonntag*, потом *zu*, а инфинитив *arbeiten* в конце.'
  w2:
    translation: Не забудь сегодня позвонить брату!
    why: 'У *anrufen* отделяемая приставка, поэтому *zu* стоит в середине: *anzurufen*. Это последнее слово. *heute* и *deinen Bruder* могут стоять в любом порядке.'
  w3:
    translation: Полезно есть много фруктов.
    why: 'После *es ist* + прилагательное инфинитивная часть идёт после запятой, а *zu* стоит прямо перед инфинитивом в конце.'
  w4:
    translation: У тебя есть сегодня вечером время готовить вместе со мной?
    why: 'После *Zeit haben* инфинитивная часть идёт после запятой. *mit mir* стоит перед *zu*, а *kochen* в самом конце.'
  w5:
    translation: Летом мы собираемся поехать в Италию.
    why: 'После *vorhaben* инфинитивная часть идёт после запятой. Сначала время, потом место, а *zu fahren* в конце.'
  w6:
    translation: Я коплю деньги, чтобы купить машину.
    why: '*um* открывает инфинитивную часть, *ein Auto* стоит в середине, а *zu kaufen* её закрывает.'
  w7:
    translation: Я рано встаю, чтобы успеть на первый автобус.
    why: '*um* открывает инфинитивную часть, *den ersten Bus* стоит в середине, а *zu nehmen* её закрывает.'
  w8:
    translation: Я запишу тебе адрес, чтобы ты его не забыл.
    why: 'Забывает *du*, а не *ich*, поэтому придаточное начинается с *damit* и у него своё подлежащее. Глагол *vergisst* уходит в конец, после *nicht*.'
  w9:
    translation: Врач посоветовал мне меньше работать.
    why: 'После *raten* действие выполняет тот, кому советуют (*mir*). Инфинитивная часть идёт после запятой: *weniger zu arbeiten*.'
  w10:
    translation: Вчера я пытался дозвониться тебе в офис.
    why: 'У *anrufen* отделяемая приставка, поэтому *zu* стоит в середине: *anzurufen*. Это последнее слово, а местоимение *dich* стоит в инфинитивной части первым.'
  w11:
    translation: Прошу тебя выключить телефон во время концерта.
    why: 'У *ausschalten* отделяемая приставка, поэтому *zu* стоит в середине: *auszuschalten*. Это последнее слово. *während des Konzerts* и *dein Handy* могут стоять в любом порядке.'

austrianNotes:
  at1: Брать такси на десять минут? Это того не стоит.
