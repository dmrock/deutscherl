# German content of the topic, shared by every locale (`.claude/rules/content.md`).
# In examples, **…** marks the adjective whose ending the page explains.

examples:
  # When there is no article
  - id: e1
    de: 'Ich trinke morgens **schwarzen** Kaffee.'
  - id: e2
    de: 'Auf dem Markt gibt es **frische** Äpfel.'
  # The endings: nominative, accusative, dative
  - id: e3
    de: '**Kalter** Kaffee schmeckt mir nicht.'
  - id: e4
    de: '**Frisches** Obst ist gesund.'
  - id: e5
    de: 'Ich trinke lieber **grünen** Tee.'
  - id: e6
    de: 'Wir brauchen noch **frische** Milch.'
  - id: e7
    de: 'Haben Sie auch **stilles** Wasser?'
  - id: e8
    de: 'Nach **langem** Warten kam endlich der Bus.'
  - id: e9
    de: 'Ich trinke Kaffee mit **warmer** Milch.'
  - id: e10
    de: 'Am Wochenende treffe ich mich mit **alten** Freunden.'
  # What is new compared with ein: the dative singular
  - id: e11
    de: 'Bei **schönem** Wetter essen wir im Garten.'
  - id: e12
    de: 'Sie spricht mit **leiser** Stimme.'
  # Genitive
  - id: e13
    de: 'Wegen **schlechten** Wetters fällt das Konzert aus.'
  - id: e14
    de: 'Trotz **starken** Regens sind wir spazieren gegangen.'
  - id: e15
    de: 'Wegen **großer** Nachfrage gibt es ein zweites Konzert.'
  # After numbers, viele, einige, mehrere
  - id: e16
    de: 'Wir haben zwei **kleine** Kinder.'
  - id: e17
    de: 'In Wien habe ich viele **nette** Leute kennengelernt.'
  - id: e18
    de: 'Ich habe noch einige **alte** Fotos von dir.'
  - id: e19
    de: 'Ich war mit zwei **guten** Freundinnen in Italien.'
  # Greetings and wishes
  - id: e20
    de: '**Guten** Morgen, Frau Huber!'
  - id: e21
    de: '**Herzlichen** Glückwunsch zum Geburtstag!'
  - id: e22
    de: '**Liebe** Grüße aus Graz!'
  - id: e23
    de: '**Frohe** Weihnachten euch allen!'
  - id: e24
    de: 'Auf Wiedersehen und einen **schönen** Tag noch!'
  - id: e25
    de: 'Danke, **schönen** Tag noch!'

choice:
