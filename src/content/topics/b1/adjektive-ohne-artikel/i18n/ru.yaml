# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: По утрам я пью чёрный кофе.
  e2: На рынке есть свежие яблоки.
  e3: Холодный кофе мне не нравится.
  e4: Свежие фрукты полезны.
  e5: Я больше люблю зелёный чай.
  e6: Нам ещё нужно свежее молоко.
  e7: А негазированная вода у вас есть?
  e8: После долгого ожидания автобус наконец пришёл.
  e9: Я пью кофе с тёплым молоком.
  e10: На выходных я встречаюсь со старыми друзьями.
  e11: В хорошую погоду мы едим в саду.
  e12: Она говорит тихим голосом.
  e13: Из-за плохой погоды концерт отменяется.
  e14: Несмотря на сильный дождь, мы пошли гулять.
  e15: Из-за большого спроса будет второй концерт.
  e16: У нас двое маленьких детей.
  e17: В Вене я познакомился со многими приятными людьми.
  e18: У меня ещё есть несколько твоих старых фотографий.
  e19: Я ездила в Италию с двумя хорошими подругами.
  e20: Доброе утро, госпожа Хубер!
  e21: С днём рождения!
  e22: Сердечный привет из Граца!
  e23: Всех с Рождеством!
  e24: До свидания и хорошего дня!
  e25: Спасибо, хорошего дня!

choice:
  c1:
    why: '*der Kaffee* — мужской род и дополнение к *trinken*, то есть винительный падеж. Как у *den*, прилагательное оканчивается на *-en*: *schwarzen Kaffee*.'
  c2:
    why: '*das Brot* — средний род и подлежащее. Артикля нет, поэтому средний род показывает прилагательное окончанием *-es*, как в *das*: *frisches Brot*.'
  c3:
    why: 'После *mit* идёт дательный падеж, а *die Milch* — женский род. Как у *der* в дательном падеже женского рода, прилагательное оканчивается на *-er*: *mit warmer Milch*.'
  c4:
    why: 'После *bei* идёт дательный падеж, а *das Wetter* — средний род. Как у *dem*, прилагательное оканчивается на *-em*: *bei schlechtem Wetter*.'
  c5:
    why: '*Erdbeeren* — множественное число и дополнение к *es gibt*. Во множественном числе в винительном падеже без артикля окончание *-e*: *frische Erdbeeren*.'
  c6:
    why: 'После *mit* идёт дательный падеж, а *Freunden* — множественное число. Как у *den*, прилагательное оканчивается на *-en*: *mit alten Freunden*.'
  c7:
    why: '*der Tee* — мужской род и подлежащее. Артикля нет, поэтому мужской род показывает прилагательное окончанием *-er*, как в *der*: *schwarzer Tee*.'
  c8:
    why: '*das Bier* — средний род и подлежащее. Артикля нет, поэтому окончание *-es*, как в *das*: *kaltes Bier*.'
  c9:
    why: 'После числительного у прилагательного те же окончания, что и без артикля. *Cafés* — множественное число в винительном падеже, поэтому окончание *-e*: *zwei gute Cafés*.'
  c10:
    why: 'После *viele* у прилагательного те же окончания, что и без артикля. *Leute* — множественное число в именительном падеже, поэтому окончание *-e*: *viele nette Leute*.'
  c11:
    why: '*alle* работает как *die*, поэтому во множественном числе прилагательное оканчивается на *-en*: *alle neuen Kollegen*.'
  c12:
    why: 'После *mehrere* у прилагательного те же окончания, что и без артикля. *Fehler* здесь — множественное число в винительном падеже, поэтому окончание *-e*: *mehrere kleine Fehler*.'
  c13:
    why: 'После *mit* идёт дательный падеж. После числительного в дательном падеже множественного числа окончание *-en*, как у *den*: *mit zwei netten Freundinnen*.'
  c14:
    why: 'После *wegen* идёт родительный падеж, а *das Wetter* — средний род. В родительном падеже мужского и среднего рода существительное получает *-s*, а прилагательное оканчивается на *-en*, а не на *-es*: *wegen schlechten Wetters*.'
  c15:
    why: 'Пожелание — дополнение к глаголу, которого нет в предложении, поэтому оно в винительном падеже. *der Glückwunsch* — мужской род, поэтому окончание *-en*: *Herzlichen Glückwunsch*.'
  c16:
    why: 'Пожелание стоит в винительном падеже. *die Nacht* — женский род, поэтому окончание *-e*: *Gute Nacht*.'
  c17:
    why: 'Приветствие — дополнение к глаголу, которого нет в предложении, например *senden*, поэтому оно в винительном падеже. *Grüße* — множественное число, поэтому окончание *-e*: *Liebe Grüße*.'
  c18:
    why: 'Пожелание стоит в винительном падеже. *der Abend* — мужской род, поэтому окончание *-en*, с *einen* и без него: *schönen Abend noch*.'

wordOrder:
  w1:
    translation: В хорошую погоду мы едим в саду.
    why: '*bei schönem Wetter* стоит на первом месте, поэтому дальше идёт глагол *essen*, потом подлежащее *wir*.'
  w2:
    translation: Я пью кофе с тёплым молоком.
    why: 'Прилагательное стоит между *mit* и существительным. После *mit* идёт дательный падеж, поэтому из *die Milch* получается *warmer Milch*.'
  w3:
    translation: На завтрак есть свежий хлеб.
    why: '*zum Frühstück* стоит на первом месте, потом глагол *gibt* и *es*. Дополнение *frisches Brot* идёт в конце.'
  w4:
    translation: В Вене я познакомился со многими приятными людьми.
    why: '*in Wien* стоит на первом месте, потом глагол *habe* и подлежащее *ich*. Причастие *kennengelernt* идёт в конец. После *viele* прилагательное оканчивается на *-e*.'
  w5:
    translation: Несмотря на сильный дождь, мы пошли гулять.
    why: '*trotz starken Regens* стоит на первом месте, поэтому дальше идёт *sind*, потом *wir*. *spazieren gegangen* идёт в конец.'
  w6:
    translation: С днём рождения!
    why: 'Прилагательное стоит перед существительным: *Herzlichen Glückwunsch*. Потом идёт *zum Geburtstag*.'
  w7:
    translation: Передавай привет родителям!
    why: 'Прилагательное стоит перед существительным: *Viele Grüße*. Потом *an* и тот, кому передают привет.'

austrianNotes:
  at1: Яблочный штрудель подают со свежими взбитыми сливками.
