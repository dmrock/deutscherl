# Russian translations and explanations for german.yaml, keyed by item id.
# *word* marks a German word inside the text.

examples:
  e1: Это мужчина, который живёт по соседству с нами.
  e2: Я ищу квартиру, которая не слишком дорогая.
  e3: У меня есть коллега, который очень хорошо говорит по-английски.
  e4: Мне нужен телефон, который долго прослужит.
  e5: Это свитер, который я вчера себе купил.
  e6: Где фотографии, которые ты сделал в отпуске?
  e7: Это коллега, которой я помог с переездом.
  e8: У меня хорошие соседи, которым я могу оставить ключ.
  e9: Это подруга, с которой я еду в Италию.
  e10: Как называется отель, в котором вы жили?
  e11: Как называется фирма, на которую ты работаешь?
  e12: Это коллеги, о которых я тебе рассказывал.
  e13: Фильм, который мы вчера смотрели, был отличный.
  e14: Женщина, которая сидит там у окна, — моя начальница.
  e15: Я посмотрел фильм, который ты мне советовал.
  e16: Можешь одолжить мне книгу, которую ты сейчас читаешь?

choice:
  c1:
    why: '*einen Mann* в главном предложении стоит в винительном падеже, но это не важно. В придаточном говорит сам мужчина, значит, местоимение — подлежащее: именительный падеж *der*.'
  c2:
    why: '*der Pullover* — мужской род, а подлежащее придаточного — *ich*. Свитер — прямое дополнение, поэтому нужен винительный падеж *den*.'
  c3:
    why: '*die Frau* — женский род, а подлежащее — *du*. Прямое дополнение стоит в винительном падеже, а форма женского рода — *die*.'
  c4:
    why: '*das Auto* — средний род, и стоит сама машина, значит, местоимение — подлежащее: именительный падеж *das*.'
  c5:
    why: '*die Leute* — множественное число, и сидят сами люди, значит, местоимение — подлежащее: именительный падеж *die*.'
  c6:
    why: '*das Buch* — средний род, и книга — подлежащее при *gefallen*. *mir* стоит в дательном падеже, а местоимение — в именительном: *das*.'
  c7:
    why: '*helfen* требует дательного падежа, а *das Kind* — средний род, поэтому местоимение — *dem*.'
  c8:
    why: 'Коллега получает цветы, поэтому нужен дательный падеж. *die Kollegin* — женский род: *der*.'
  c9:
    why: 'Друзьям рассказывают, поэтому нужен дательный падеж. Во множественном числе это *denen*, а не *den*.'
  c10:
    why: '*in* для места требует дательного падежа, а *das Hotel* — средний род, поэтому *in dem*.'
  c11:
    why: '*mit* всегда требует дательного падежа, а *der Kollege* — мужской род, поэтому *mit dem*.'
  c12:
    why: '*für* всегда требует винительного падежа, а *die Firma* — женский род, поэтому *für die*.'
  c13:
    why: '*von* всегда требует дательного падежа, а *die Nachbarn* — множественное число, поэтому *von denen*.'
  c14:
    why: 'В относительном придаточном глагол, который меняется по лицам, стоит последним: *gemietet habe*.'
  c15:
    why: 'Существительное вместе с придаточным занимает первое место, поэтому глагол *ist* идёт сразу после второй запятой.'

wordOrder:
  w1:
    translation: Это мужчина, который живёт по соседству с нами.
    why: 'Придаточное начинается с относительного местоимения *der*, а глагол *wohnt* уходит в конец.'
  w2:
    translation: У меня есть коллега, которая очень хорошо говорит по-английски.
    why: 'Придаточное начинается с *die*, а *spricht* уходит в конец. *sehr gut* и *Englisch* могут стоять в любом порядке.'
  w3:
    translation: Где фотографии, которые ты сделал в отпуске?
    why: 'Придаточное начинается с *die*, потом подлежащее *du*. В перфекте *hast* стоит последним, после *gemacht*.'
  w4:
    translation: Это подруга, с которой я еду в Италию.
    why: 'Предлог *mit* стоит перед местоимением *der*. Потом идут *ich* и *nach Italien*, а *fahre* уходит в конец.'
  w5:
    translation: У меня есть соседи, которым я могу оставить ключ.
    why: 'Придаточное начинается с *denen*. С модальным глаголом *kann* стоит последним, после инфинитива *geben*.'
  w6:
    translation: Фильм, который мы вчера смотрели, был отличный.
    why: 'Придаточное стоит сразу после *der Film* и заканчивается на *haben*. Потом главное предложение продолжается своим глаголом *war*.'
  w7:
    translation: Я посмотрел фильм, который ты мне советовал.
    why: 'Придаточное стоит после причастия *gesehen*, в конце предложения. Оно начинается с *den*, а *hast* стоит последним.'
  w8:
    translation: Как называется фирма, на которую ты работаешь?
    why: 'Предлог *für* стоит перед местоимением *die*. Потом идёт *du*, а *arbeitest* уходит в конец.'

austrianNotes:
  at1: Пакет, который ты принёс, слишком маленький.
