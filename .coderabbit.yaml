# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit pull request reviews. Project rules come from CLAUDE.md and .claude/rules/.
language: en-US

reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!docs/architecture.html"
    # Generated by `review:sync`; never edited by hand.
    - "!src/content/topics/**/review.yaml"
  path_instructions:
    - path: "src/content/topics/**/german.yaml"
      instructions: >-
        German example sentences and exercise items for learners. Check grammar, spelling,
        case, gender, verb forms and word order, and that each sentence sounds natural.
        Austrian usage is intentional where the topic marks it as Austrian.
    - path: "src/content/topics/**/*.mdx"
      instructions: >-
        Grammar explanation in the learner's native language. Check that the rules are
        correct and match the German examples in german.yaml of the same topic.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".claude/rules/*.md"
