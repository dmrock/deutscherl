# Git hooks (https://lefthook.dev). Installed by `pnpm install` via the `prepare` script.
pre-commit:
  piped: true
  jobs:
    - name: biome
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,css,astro,svelte}'
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{astro,svelte}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: language
      run: node scripts/check-language.ts {staged_files}

    # Recomputes review hashes and resets changed scopes to draft (CLAUDE.md, "Review and
    # verification"), then stages review.yaml so the reset shows up in the same commit.
    - name: review
      glob: 'src/content/topics/**'
      run: node scripts/review.ts sync && git add src/content/topics/*/*/review.yaml
